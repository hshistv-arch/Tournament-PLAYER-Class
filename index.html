        var tmHTML = '<span class="tsh-time">'+esc(nm.startTime)+'</span>';
        noInner = it.vert ? (noInner+tmHTML) : (tmHTML+noInner);
      }
      var npos = it.vert ? ('left:'+it.x+'px;top:'+it.y+'px;min-width:'+it.w+'px;height:'+it.h+'px') : ('left:'+it.x+'px;bottom:'+(lay.h-it.y-it.h)+'px;width:'+it.w+'px');
      if(o.interactive && nm && !nm.bye && !nm.dead && (o.allowPending || !nm.preview)){
        labels += '<button type="button" class="'+ncls+'" style="'+npos+'" data-action="open-tpl-match" '+o.openAttrs(nm)+' title="No.'+it.no+' のスコア入力・試合開始・取消">'+noInner+'</button>';
      } else {
        labels += '<span class="'+ncls+'" style="'+npos+'">'+noInner+'</span>';
      }
      return;
    }
    // box
    var m = it.cons ? o.getMatch(it.cons.no) : null;
    var occ = null;
    if(it.role==="champ" || (!it.cons && it.own!=null)){ var om = o.getMatch(it.own); occ = om ? om.winner : null; }
    else if(m) occ = m[it.cons.side];
    var cls = "tsh-box tsh-"+it.role+(it.vert?" tsh-v":"");
    var attrs = "";
    if(m && occ){
      var resolved = !!m.winner && !m.bye;
      if(resolved){ cls += (m.winner===occ) ? " win" : " lose"; }
      else if(m.bye){ cls += " bye"; }
      else if(m.started && m.a && m.b){ cls += " live"; }
      if(resolvable(m)){ cls += " pick"; if(o.interactive) attrs = ' data-action="'+(o.actionName||"resolve-elim-match")+'" data-mid="'+m.id+'" data-winner="'+occ+'" '+o.attrsFor(m); }
      if(!o.isActive(m)) cls += " off";
    } else if(!m && occ && it.role==="champ"){ cls += " win"; }
    if(it.role==="champ" && occ) cls += " win";
    if(o.goalOf(it)) cls += " goal";
    // エントリーのない(選手がいない)枠には斜線を引く。予選の途中から始めた決勝の空き枠は、これから決まる枠なので対象外
    if(it.role==="slot" && !occ && !(t && isEarlyFinals(t) && def.key && String(def.key).indexOf("finals")===0)) cls += " empty";

    else if(occ){
      inner += tshPlayerHTML(t, occ);

      if(m && it.cons && !m.bye && m.a && m.b){
        var sc = m.score || {a:null, b:null}, sv = sc[it.cons.side], isWin = !!m.winner && m.winner===occ;
        var stxt = (sv!=null) ? sv : (isWin ? "W" : (m.winner ? "不戦敗" : null));
        if(stxt!=null) inner += '<span class="tsh-score'+(isWin?' win':'')+(stxt==="不戦敗"?' walk':'')+'" title="スコア">'+esc(stxt)+'</span>';
      }
    }
    else if(it.lsrc!=null) inner += '<span class="tsh-lbl">'+it.lsrc+'-L</span>';
    if(it.role==="slot" && o.slotEdit){
      var editAttrs = o.slotEdit(it);
      if(editAttrs) inner += '<button type="button" class="tsh-edit no-print" data-action="open-tpl-slot" '+editAttrs+' title="この枠の選手を変更">✎</button>';
    }
    var title = occ ? (' title="'+esc(playerNameWithAffiliation(t, occ)+(displayClassOf(t, occ) ? " / "+displayClassOf(t, occ) : ""))+'"') : "";
    var numPos = it.role==="slot" ? (' data-numat="'+it.numAt+'"') : "";
    boxes += '<div class="'+cls+'" style="'+pos+'"'+attrs+title+numPos+'>'+inner+'</div>';
  });
  var fitMode = (tshZoom==="fit" || tshZoom==="fitw");
  var tsc = tshTextScale((fitMode ? 1 : tshZoom) * Math.min(1, tshBrowserZoom()));
  return '<div class="tsh-scroll"><div class="tsh-zoom'+(tsc.compact?' tsh-compact':'')+'" style="zoom:'+(fitMode?1:tshZoom)+';'+tsc.vars+'"'+(fitMode?'':(' data-z="'+tshZoom+'"'))+(fitMode?(' data-fit="'+tshZoom+'" data-w="'+lay.w+'" data-h="'+lay.h+'"'):'')+'><div class="tsh" style="width:'+lay.w+'px;height:'+lay.h+'px">'+lines+boxes+labels+'</div></div></div>';
}

var tshFinalsDefCache = {};
function tshFinalsDef(size){
  if(tshFinalsDefCache[size]) return tshFinalsDefCache[size];
  var matches = {}, order = [], no = 0, prev = [], round = 1;
  for(var i=0;i<size/2;i++){ matches[++no] = {no:no, side:"wb", round:1, a:{p:2*i+1}, b:{p:2*i+2}}; order.push(no); prev.push(no); }

    round++;
    var cur = [];
    for(var j=0;j<prev.length;j+=2){ matches[++no] = {no:no, side:"wb", round:round, a:{w:prev[j]}, b:{w:prev[j+1]}}; order.push(no); cur.push(no); }
    prev = cur;
  }
  tshFinalsDefCache[size] = {key:"finals"+size, type:"single", size:size, order:order, matches:matches, wbFinal:[no], lbFinal:[]};
  return tshFinalsDefCache[size];
}

// 予選グループの勝者側で、最終ラウンド(=決勝トーナメントに直結するラウンド)まで
// 既に判明している勝者のidだけを配列で返す(敗者復活側はまだ対象外)
function projectedElimAdvancersForGroup(t, g){
  if(g.tpl){
    var idxP = tplIndex(g), defP = TPL_DEFS[g.tpl];
    if(defP.type!=="double"){
      // 決勝進出人数まで絞り込んだ時点の勝ち残り(最終ラウンドの勝者と、次のラウンドから登場するシード枠の選手)
      var capP = cappedRoundsFor(t, g);
      var knownP = [];
      (defP.wbRounds[capP-1]||[]).forEach(function(no){ var w = idxP[no].winner; if(w) knownP.push(w); });
      (defP.wbRounds[capP]||[]).forEach(function(no){
        [defP.matches[no].a, defP.matches[no].b].forEach(function(s2){ if(s2.p!=null && g.slots[s2.p-1]) knownP.push(g.slots[s2.p-1]); });
      });
      return knownP;
    }
    return defP.wbFinal.map(function(no){ return idxP[no].winner; }).filter(function(id){ return !!id; });
  }
  var wbTarget = (hasLoserBracket(t) && t.advancePerGroupWB!=null) ? t.advancePerGroupWB : t.advancePerGroup;
  var cappedRoundsG = roundsNeededForTarget(g.targetSize, wbTarget);
  var lastRound = buildWbDisplayRounds(g, cappedRoundsG)[cappedRoundsG-1] || [];
  var known = lastRound.filter(function(m){ return m && wbMatchDecided(m) && m.winner; }).map(function(m){ return m.winner; });
  return known.slice(0, wbTarget);
}
// 進出者が一部でも判明している場合の、決勝トーナメント枠の暫定組み合わせ(未確定の枠はnullのまま、
// 不戦扱いにはしない = buildBracketFromSlotsとは別の軽量な組み立て)
function buildProjectedFinalsBracket(slots){
  var round1 = [];
  for(var i=0;i<slots.length;i+=2){
    round1.push({id:"pf0_m"+(i/2), round:1, a:slots[i]||null, b:slots[i+1]||null, winner:null, deltas:null, bye:false, preview:true, score:{a:null,b:null}});
  }
  var totalRounds = Math.max(1, Math.round(Math.log2(slots.length)));
  return {totalRounds:totalRounds, rounds:[round1], eliminatedRound:{}, entrants:slots.filter(function(x){ return x; })};
}

function tournamentPointDeltas(t){
  var totals = {};
  function add(playerId, amount){
    if(!playerId || amount==null) return;
    totals[playerId] = (totals[playerId]||0) + amount;
  }
  function walkMatches(matches){
    (matches||[]).forEach(function(m){
      if(m.deltas) m.deltas.forEach(function(d){ add(d.playerId, d.amount); });
    });
  }
  function walkBracket(b){
    if(!b) return;
    b.rounds.forEach(function(r){ walkMatches(r); });
  }
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(b){
      walkMatches(b.matches);
      if(b.penaltyDeltas) Object.keys(b.penaltyDeltas).forEach(function(id){ add(id, b.penaltyDeltas[id]); });
    });
  } else {
    (t.groups||[]).forEach(function(g){
      walkBracket(g.wb);
      walkBracket(g.lb);
      if(g.penaltyDeltas) Object.keys(g.penaltyDeltas).forEach(function(id){ add(id, g.penaltyDeltas[id]); });
    });
  }
  if(t.preFinals) walkMatches(t.preFinals.matches);
  walkBracket(t.finals);
  if(t.advanceBonusApplied) Object.keys(t.advanceBonusApplied).forEach(function(id){ add(id, t.advanceBonusApplied[id]); });
  if(t.finishDeltas) t.finishDeltas.forEach(function(d){ add(d.playerId, d.amount); });
  return totals;
}
function previousPointsOf(playerId){
  for(var i=state.tournaments.length-1;i>=0;i--){
    var tour = state.tournaments[i];
    if(tour.status!=="completed") continue;
    var totals = tournamentPointDeltas(tour);
    if(totals[playerId]!==undefined){
      return pointsOf(playerId) - totals[playerId];
    }
  }
  return null;
}

function redrawFinals(t){
  if(!t.finals || !t.finalists || !t.finalists.length) return;
  if(t.status==="completed") reverseFinalize(t);
  t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  var shuffled = t.finalists.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=tmp;
  }
  var size=1; while(size<shuffled.length) size*=2;
  while(shuffled.length<size) shuffled.push(null);
  t.finals = buildFinalsBracket(shuffled, false);
  t.status = "finals";
}
function finalsCardHalfSize(t){
  var size=1; while(size<(t.finalists||[]).length) size*=2;
  return Math.max(1, size/2);
}
function finalsCardOf(t, id){ return (t.finalsDrawCards && t.finalsDrawCards[id]) || null; }
function finalsCardLabel(card){ return (card.suit==="spade" ? "♠" : "♥")+card.number; }
function finalsDrawAllDrawn(t){
  if(!t.finalists || !t.finalists.length) return false;
  return t.finalists.every(function(id){ return !!finalsCardOf(t, id); });
}
function resetFinalsDrawCards(t){
  t.finalsDrawCards = {};
}
function drawFinalsCardFor(t, id){
  if(!t.finalists || t.finalists.indexOf(id)<0) return;
  if(!t.finalsDrawCards) t.finalsDrawCards = {};
  if(t.finalsDrawCards[id]) return;
  var half = finalsCardHalfSize(t);
  var taken = {};
  Object.keys(t.finalsDrawCards).forEach(function(pid){
    var c = t.finalsDrawCards[pid];
    taken[c.suit+c.number] = true;
  });
  var remaining = [];
  ["spade","heart"].forEach(function(suit){
    for(var n=1;n<=half;n++){ if(!taken[suit+n]) remaining.push({suit:suit, number:n}); }
  });
  if(!remaining.length) return;
  t.finalsDrawCards[id] = remaining[Math.floor(Math.random()*remaining.length)];
}
function applyFinalsDraw(t){
  if(!t.finalists || !t.finalists.length) return;
  if(t.status==="completed") reverseFinalize(t);
  var half = finalsCardHalfSize(t);
  var slots = new Array(half*2).fill(null);
  var draws = t.finalsDrawCards || {};
  t.finalists.forEach(function(id){
    var card = draws[id];
    if(!card) return;
    var idx = (card.number-1)*2 + (card.suit==="spade" ? 0 : 1);
    if(idx>=0 && idx<slots.length) slots[idx] = id;
  });
  rebuildFinalsFromSlots(t, slots);
}
function finalsHasProgress(t){
  if(!t.finals) return false;
  if(t.status==="completed") return true;
  return t.finals.rounds.some(function(r){ return r.some(function(m){ return !!m.winner && !m.bye; }); });
}
function finalsSlotsArray(t){
  var slots = [];
  t.finals.rounds[0].forEach(function(m){ slots.push(m.a); slots.push(m.b); });
  return slots;
}
function assignFinalsSlot(t, slotIdx, newPlayerId){
  var slots = finalsSlotsArray(t);
  var newVal = newPlayerId || null;
  if(newVal!==null){
    var ownerIdx = slots.indexOf(newVal);
    if(ownerIdx>=0 && ownerIdx!==slotIdx){ slots[ownerIdx] = slots[slotIdx]; }
  }
  slots[slotIdx] = newVal;
  return slots;
}
function rebuildFinalsFromSlots(t, slots){
  if(t.status==="completed") reverseFinalize(t);
  t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  if(isEarlyFinals(t)){ t.finals = buildFinalsBracket(slots, true); return; }
  t.finals = buildFinalsBracket(slots, false);
  t.status = "finals";
}
// ---------- 予備決勝戦: 組み合わせ変更(再抽選/手動編集/トランプ抽選)。決勝トーナメントの同機能と同じ体験を、1ラウンドの試合リストに対して提供する ----------

function assignPreFinalsSlot(t, slotIdx, newPlayerId){

    var ownerIdx = slots.indexOf(newVal);
    if(ownerIdx>=0 && ownerIdx!==slotIdx){ slots[ownerIdx] = slots[slotIdx]; }
  }
  slots[slotIdx] = newVal;

}
function rebuildPreFinalsFromSlots(t, slots){

}
function redrawPreFinals(t){
  if(!t.preFinals) return;
  var pool = preFinalsSlotsArray(t).filter(Boolean);
  t.preFinals.matches.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
  for(var i=pool.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp;
  }
  t.preFinals = { matches: buildPreFinalsMatches(pool) };
}
function preFinalsHasProgress(t){
  return !!(t.preFinals && t.preFinals.matches.some(function(m){ return !!m.winner; }));
}
function preFinalsCardHalfSize(t){

function preFinalsCardOf(t, id){ return (t.preFinalsDrawCards && t.preFinalsDrawCards[id]) || null; }
function preFinalsDrawAllDrawn(t){

function resetPreFinalsDrawCards(t){ t.preFinalsDrawCards = {}; }
function drawPreFinalsCardFor(t, id){
  var pool = preFinalsSlotsArray(t).filter(Boolean);
  if(pool.indexOf(id)<0) return;
  if(!t.preFinalsDrawCards) t.preFinalsDrawCards = {};
  if(t.preFinalsDrawCards[id]) return;
  var half = preFinalsCardHalfSize(t);
  var taken = {};
  Object.keys(t.preFinalsDrawCards).forEach(function(pid){
    var c = t.preFinalsDrawCards[pid];
    taken[c.suit+c.number] = true;
  });
  var remaining = [];
  ["spade","heart"].forEach(function(suit){
    for(var n=1;n<=half;n++){ if(!taken[suit+n]) remaining.push({suit:suit, number:n}); }
  });
  if(!remaining.length) return;
  t.preFinalsDrawCards[id] = remaining[Math.floor(Math.random()*remaining.length)];
}
function applyPreFinalsDraw(t){
  var pool = preFinalsSlotsArray(t).filter(Boolean);
  if(!pool.length) return;
  var half = preFinalsCardHalfSize(t);
  var slots = new Array(half*2).fill(null);
  var draws = t.preFinalsDrawCards || {};
  pool.forEach(function(id){
    var card = draws[id];
    if(!card) return;
    var idx = (card.number-1)*2 + (card.suit==="spade" ? 0 : 1);
    if(idx>=0 && idx<slots.length) slots[idx] = id;
  });
  rebuildPreFinalsFromSlots(t, slots);
}

    delete affiliationCheckByTid[t.getAttribute("data-tid")];
    render();
  }
  else if(action==="resolve-prefinals-match"){
    var tidPF = t.getAttribute("data-tid"); var tourPF = findTournament(tidPF);
    if(!tourPF || !tourPF.preFinals) return;
    var midPF = t.getAttribute("data-mid"); var winnerPF = t.getAttribute("data-winner");
    var mPF = tourPF.preFinals.matches.find(function(x){ return x.id===midPF; });
    if(mPF && !mPF.winner){
      resolveMatch(mPF, winnerPF, tourPF);
      if(preFinalsAllDone(tourPF)) completePreFinalsAndBuildFinals(tourPF);
    }
    saveState(); render();
  }
  else if(action==="undo-prefinals-match"){
    var tidUPF = t.getAttribute("data-tid"); var tourUPF = findTournament(tidUPF);
    if(!tourUPF || !tourUPF.preFinals) return;
    if(!confirm("この結果を取り消しますか?")) return;
    var midUPF = t.getAttribute("data-mid");
    var mUPF = tourUPF.preFinals.matches.find(function(x){ return x.id===midUPF; });
    if(mUPF && mUPF.winner){ undoMatchDeltas(mUPF); mUPF.winner=null; mUPF.deltas=null; }
    saveState(); render();
  }
  else if(action==="resolve-match"){
    var tid2 = t.getAttribute("data-tid"); var tour2 = findTournament(tid2);
    if(!tour2) return;
    if(tour2.status!=="prelim") return;
    var mid = t.getAttribute("data-mid"); var winner = t.getAttribute("data-winner");
    var bidx = Number(t.getAttribute("data-block"));
    var block = tour2.blocks[bidx];
    var m2 = block.matches.find(function(x){return x.id===mid;});
    if(m2 && !m2.winner){ resolveMatch(m2, winner, tour2); recomputeBlockElimination(block, tour2); }
    saveState(); render();
  }
  else if(action==="undo-match"){
    var tid3 = t.getAttribute("data-tid"); var tour3 = findTournament(tid3);
    if(!tour3) return;
    if(!confirm("この結果を取り消しますか?後続の組み合わせ結果や決勝トーナメントの結果も一緒に取り消される場合があります。")) return;
    var mid2 = t.getAttribute("data-mid");
    var bidx2 = Number(t.getAttribute("data-block"));
    var block2 = tour3.blocks[bidx2];
    correctBlockMatch(tour3, block2, mid2);
    saveState(); render();
  }
  else if(action==="resolve-elim-match"){
    var tid6=t.getAttribute("data-tid"); var tour6=findTournament(tid6);
    if(!tour6) return;
    if(tour6.status!=="prelim") return;
    var gi=Number(t.getAttribute("data-group"));
    var g = tour6.groups[gi];
    if(groupReached(tour6, g)) return;
    var side=t.getAttribute("data-side"); var mid5=t.getAttribute("data-mid"); var winner3=t.getAttribute("data-winner");
    var match5 = findElimMatch(g, side, mid5);
    if(match5 && !match5.winner && !match5.bye){
      resolveMatch(match5, winner3, tour6);
      advanceElimGroup(tour6, g);
      recomputeElimGroup(tour6, g);
      saveState(); render();
      return;
    }
    if(!match5 && side==="wb"){
      var parsed5 = parseWbFuturePos(mid5);
      var virt5 = parsed5 ? virtualWbMatch(g, parsed5.round, parsed5.mi) : null;
      if(virt5 && !virt5.winner && !virt5.bye && (virt5.a===winner3 || virt5.b===winner3)){
        resolveMatch(virt5, winner3, tour6);
        g.futureWbByPos = g.futureWbByPos || {};
        g.futureWbByPos[parsed5.round+"_"+parsed5.mi] = {winner: virt5.winner, deltas: virt5.deltas, fmtSnap: virt5.fmtSnap||null};
        saveState(); render();
      }
    }
  }
  else if(action==="undo-elim-match"){
    var tid7=t.getAttribute("data-tid"); var tour7=findTournament(tid7);
    if(!tour7) return;
    if(!confirm("この結果を取り消しますか?後続の組み合わせ結果や決勝トーナメントの結果も一緒に取り消される場合があります。")) return;
    var gi2=Number(t.getAttribute("data-group"));
    var g2 = tour7.groups[gi2];
    var side2=t.getAttribute("data-side"); var mid6=t.getAttribute("data-mid");
    correctElimMatch(tour7, g2, side2, mid6);
    saveState(); render();
  }
  else if(action==="start-early-finals"){
    var tidEF = t.getAttribute("data-tid"); var tourEF = findTournament(tidEF);
    if(!tourEF || tourEF.finals || tourEF.status!=="prelim") return;
    createEarlyFinals(tourEF);
    saveState(); render();
  }
  else if(action==="cancel-early-finals"){
    var tidCF = t.getAttribute("data-tid"); var tourCF = findTournament(tidCF);
    if(!tourCF || !isEarlyFinals(tourCF)) return;
    if(finalsHasProgress(tourCF) && !confirm("先行編成した決勝トーナメントを取り消すと、既に入力した決勝の結果も取り消されます。よろしいですか?")){ render(); return; }
    cancelEarlyFinals(tourCF);
    saveState(); render();
  }
  else if(action==="resolve-bracket"){
    var tid4=t.getAttribute("data-tid"); var tour4=findTournament(tid4);
    if(!tour4) return;
    var mid3=t.getAttribute("data-mid"); var winner2=t.getAttribute("data-winner");
    var match=null;
    tour4.finals.rounds.forEach(function(r){ r.forEach(function(mm){ if(mm.id===mid3) match=mm; }); });
    if(match && !match.winner && !match.bye){
      resolveMatch(match, winner2, tour4);
      var loserId = winner2===match.a ? match.b : match.a;
      tour4.finals.eliminatedRound[loserId] = match.round;
      finalsSync(tour4);
      var justCompleted = match.round===tour4.finals.totalRounds;
      if(justCompleted){
        if(isEarlyFinals(tour4)) completeEarlyFinals(tour4);
        finalizeTournamentResult(tour4);
      }
      saveState(); render();
      if(justCompleted && confirm("大会が終了しました。今すぐクラウドにバックアップを保存しますか?")){
        createCloudBackup();
      }
    }
  }
  else if(action==="undo-bracket"){
    var tid5=t.getAttribute("data-tid"); var tour5=findTournament(tid5);
    if(!tour5) return;
    var mid4=t.getAttribute("data-mid");
    if(mid4==="final-reopen"){
      if(confirm("大会結果(優勝・準優勝・ボーナス)を取り消してやり直しますか?")){
        reverseFinalize(tour5); tour5.status="finals"; restoreEarlyIfNeeded(tour5); finalsSync(tour5); saveState(); render();
      }
      return;
    }
    if(!confirm("この結果を取り消しますか?後続の対戦結果も一緒に取り消されます。")) return;
    correctBracketMatch(tour5, mid4);
    saveState(); render();
  }
}, false);

// 出場選手の割当プルダウン(トーナメント表・ブロック表・決勝・予備決勝戦)にフォーカスした状態でDeleteキーを押すと、
// マウスでプルダウンを開いて「(不戦/空き)」を選び直さなくても、その場で選択を空き(不戦)に戻せる
document.addEventListener("keydown", function(e){
  if(e.key!=="Delete") return;
  var el = e.target;
  if(!el || el.tagName!=="SELECT") return;
  var action = el.getAttribute("data-action");
  if(action!=="assign-slot" && action!=="assign-finals-slot" && action!=="assign-prefinals-slot") return;
  if(el.value==="") return;
  el.value = "";
  el.dispatchEvent(new Event("change", {bubbles:true}));
  e.preventDefault();
}, false);
document.addEventListener("change", function(e){
  setUserInteracting(false);
  var t = e.target;
  var action = t.getAttribute && t.getAttribute("data-action");
  if(!action) return;
  if(action==="qr-event-cls-select"){
    route.qrEventForm = route.qrEventForm || {};
    route.qrEventForm.cls = t.value;
    render();
  }
  else if(action==="entry-mode-radio"){
    var tidEM=t.getAttribute("data-tid");
    entryModeByTid[tidEM] = t.value==="noPoints" ? "noPoints" : "points";
    var tourEM=findTournament(tidEM);
    if(tourEM){
      var ntem = ensureTournamentSetupState(tourEM);
      ntem.usePointsAndSets = t.value!=="noPoints";
      if(ntem.usePointsAndSets && ntem.setCountTable==="D") ntem.setCountTable = "A";
    }
    render();
  }
  else if(action==="topFormat-radio"){
    var tidTF=t.getAttribute("data-tid"); var tourTF=findTournament(tidTF); if(!tourTF) return;
    var ntf = ensureTournamentSetupState(tourTF); ntf.format = t.value; render();
  }
  else if(action==="setCountTable-radio"){
    var tidSC=t.getAttribute("data-tid"); var tourSC=findTournament(tidSC); if(!tourSC) return;
    var ntst = ensureTournamentSetupState(tourSC);
    ntst.setCountTable = normalizeSetTable(t.value, ntst.usePointsAndSets);
    render();
  }
  else if(action==="useSchedule-radio"){
    var tidUS=t.getAttribute("data-tid"); var tourUS=findTournament(tidUS); if(!tourUS) return;
    var ntus = ensureTournamentSetupState(tourUS); ntus.useSchedule = t.value==="yes"; render();
  }
  else if(action==="tplAdvance-radio"){
    var tidTA=t.getAttribute("data-tid"); var tourTA=findTournament(tidTA); if(!tourTA) return;
    ensureTournamentSetupState(tourTA).tplAdvance = Number(t.value);
    render();
  }
  else if(action==="prelimType-radio"){
    var tidPT=t.getAttribute("data-tid"); var tourPT=findTournament(tidPT); if(!tourPT) return;
    var ntp = ensureTournamentSetupState(tourPT); ntp.prelimType = t.value;
    render();
  }
  else if(action==="update-points"){ updatePlayerPoints(t.getAttribute("data-id"), t.value); }
  else if(action==="update-name"){ updatePlayerName(t.getAttribute("data-id"), t.value); }
  else if(action==="update-kana"){ updatePlayerKana(t.getAttribute("data-id"), t.value); }
  else if(action==="update-affiliation"){ updatePlayerAffiliation(t.getAttribute("data-id"), t.value); }
  else if(action==="update-entry-class"){
    var pEC = getPlayer(t.getAttribute("data-id"));
    if(pEC){ pEC.manualEntryClass = t.value; saveState(); render(); }
  }
  else if(action==="update-pair-points"){
    var tidPP = t.getAttribute("data-tid"); var tourPP = findTournament(tidPP);
    if(!tourPP) return;
    var idPP = t.getAttribute("data-id");
    var valPP = t.value==="" ? null : Math.max(1, Math.round(Number(t.value))||1);
    tourPP.manualPairPoints = tourPP.manualPairPoints || {};
    if(valPP==null) delete tourPP.manualPairPoints[idPP]; else tourPP.manualPairPoints[idPP] = valPP;
    saveState(); render();
  }
  else if(action==="set-fee-method"){
    var tidFM=t.getAttribute("data-tid"); var tourFM=findTournament(tidFM); if(!tourFM) return;
    var idFM=t.getAttribute("data-id");
    tourFM.entries[idFM] = tourFM.entries[idFM] || {entered:false, feePaid:false};
    tourFM.entries[idFM].feeMethod = t.value || null;
    tourFM.entries[idFM].feePaid = !!t.value;
    saveState(); render();
  }
  else if(action==="lb-oneset-toggle"){
    var tidLB=t.getAttribute("data-tid"); var tourLB=findTournament(tidLB); if(!tourLB) return;
    var ntlb = ensureTournamentSetupState(tourLB); ntlb.lbOneSetDown = t.checked; render();
  }
  else if(action==="update-manual-class-live"){
    var tidmcl = t.getAttribute("data-tid");
    var tourmcl = findTournament(tidmcl);
    if(!tourmcl) return;
    tourmcl.manualClasses = tourmcl.manualClasses || {};
    tourmcl.manualClasses[t.getAttribute("data-id")] = t.value;
    saveState(); render();
  }
  else if(action==="change-format"){
    var tidCF = t.getAttribute("data-tid"); var tourCF = findTournament(tidCF);
    if(!tourCF) return;
    var newFmt = t.value;
    if(newFmt!==tourCF.format) changeTournamentFormat(tourCF, newFmt);
    render();
  }
  else if(action==="update-event-date"){
    var tidED = t.getAttribute("data-tid"); var tourED = findTournament(tidED);
    if(!tourED || !t.value) return;
    tourED.eventDate = t.value;
    saveState(); render();
  }
  else if(action==="update-tournament-name"){
    var tidTN = t.getAttribute("data-tid"); var tourTN = findTournament(tidTN);
    if(!tourTN) return;
    var nameTN = t.value.trim();
    if(!nameTN){ t.value = tourTN.name; return; }
    tourTN.name = nameTN;
    saveState(); render();
  }
  else if(action==="update-guide-step-title" || action==="update-guide-step-desc"){
    var idxGS = Number(t.getAttribute("data-idx"));
    if(!state.settings.guideSteps) state.settings.guideSteps = GUIDE_STEPS_DEFAULT.map(function(s){ return {title:s.title, desc:s.desc}; });
    if(action==="update-guide-step-title") state.settings.guideSteps[idxGS].title = t.value;
    else state.settings.guideSteps[idxGS].desc = t.value;
    saveState(); render();
  }
  else if(action==="update-tpl-advance"){
    var tidTV = t.getAttribute("data-tid"); var tourTV = findTournament(tidTV);
    if(!tourTV || tourTV.format!=="elimPrelim") return;
    var newTotalTV = Number(t.value);
    if(!newTotalTV || newTotalTV===tourTV.advancePerGroup) return;
    var hasProgTV = tourTV.groups.some(function(g, gi){ return groupOrBlockHasProgress(tourTV, gi); }) || !!tourTV.finals || !!tourTV.preFinals;
    if(hasProgTV && !confirm("決勝進出人数(表)を変更すると、既に入力されている対戦結果(場合によっては予備決勝戦・決勝トーナメントの結果も)がすべて取り消されます。よろしいですか?")){
      render();
      return;
    }
    if(tourTV.preFinals) unwindPreFinalsIfNeeded(tourTV);
    else if(tourTV.finals) unwindFinalsIfNeeded(tourTV);
    tourTV.advancePerGroup = newTotalTV;
    applyTplAdvance(tourTV);
    tourTV.groups.forEach(function(g){ rebuildGroupFromSlots(tourTV, g); });
    saveState(); render();
  }
  else if(action==="update-est-tables"){
    var tourET = findTournament(t.getAttribute("data-tid")); if(!tourET) return;
    var vET = Math.round(Number(t.value)); tourET.estTables = (vET>=1 && vET<=40) ? vET : null;
    saveState(); render();
  }
  else if(action==="update-est-minutes"){
    var tourEM2 = findTournament(t.getAttribute("data-tid")); if(!tourEM2) return;
    var vEM = Math.round(Number(t.value)); tourEM2.estMinutes = (vEM>=3 && vEM<=180) ? vEM : null;
    saveState(); render();
  }
  else if(action==="set-tsh-zoom"){
    tshZoom = (t.value==="fit" || t.value==="fitw") ? t.value : (Number(t.value) || 1);
    render();
  }
  else if(action==="update-bracket-format"){
    var tidGc = t.getAttribute("data-tid"); var tourGc = findTournament(tidGc);
    if(!tourGc) return;
    changeBracketFormat(tourGc, Number(t.value));
  }
  else if(action==="update-prelim-type"){
    var tidPT2 = t.getAttribute("data-tid"); var tourPT2 = findTournament(tidPT2);
    if(!tourPT2 || tourPT2.format!=="elimPrelim") return;
    var newTypePT2 = t.value;
    if(["single","double","round1Double"].indexOf(newTypePT2)<0 || newTypePT2===tourPT2.prelimType) return;
    var hasProgPT2 = tourPT2.groups.some(function(g, gi){ return groupOrBlockHasProgress(tourPT2, gi); }) || !!tourPT2.finals || !!tourPT2.preFinals;
    if(hasProgPT2 && !confirm("予選方式を変更すると、敗者復活ブロックの有無が切り替わり、既に入力されている対戦結果(場合によっては予備決勝戦・決勝トーナメントの結果も)がすべて取り消されます。よろしいですか?")){
      render();
      return;
    }
    if(tourPT2.preFinals) unwindPreFinalsIfNeeded(tourPT2);
    else if(tourPT2.finals) unwindFinalsIfNeeded(tourPT2);
    var hadKeyPT2 = tplKeyFor(tourPT2, tourPT2.bracketSize), hadSizePT2 = tourPT2.bracketSize;
    tourPT2.prelimType = newTypePT2;
    if(hasLoserBracket(tourPT2) && tourPT2.advancePerGroupWB==null){
      tourPT2.advancePerGroupWB = Math.ceil(tourPT2.advancePerGroup/2);
      tourPT2.advancePerGroupLB = tourPT2.advancePerGroup - tourPT2.advancePerGroupWB;
    }
    applyTplAdvance(tourPT2);
    if(hadKeyPT2 !== tplKeyFor(tourPT2, tourPT2.bracketSize) || hadSizePT2 !== tourPT2.bracketSize){
      // 表に対応する形式との行き来では、選手枠の並び(枠数)が変わるため、出場選手を現在のシード順で新しい枠に並べ直す
      tourPT2.groups.forEach(function(g){
        var gsPT2 = makeGroupSlots(tourPT2, g.slots.filter(function(x){ return x; }), tourPT2.bracketSize);
        g.targetSize = gsPT2.targetSize; g.slots = gsPT2.slots;
      });
    }
    tourPT2.groups.forEach(function(g){ rebuildGroupFromSlots(tourPT2, g); });
    saveState(); render();
  }
  else if(action==="update-block-count"){
    var tidBK = t.getAttribute("data-tid"); var tourBK = findTournament(tidBK);
    if(!tourBK || tourBK.format!=="blockPrelim") return;
    var newCount = Math.max(1, Math.round(Number(t.value))||1);
    if(newCount===tourBK.blockCount) return;
    var hasProgBK = tourBK.blocks.some(function(b, bi){ return groupOrBlockHasProgress(tourBK, bi); }) || !!tourBK.finals;
    if(hasProgBK && !confirm("ブロック数を変更すると、出場選手が自動で再割当され、既に入力されている対戦結果(場合によっては決勝トーナメントの結果も)が取り消されます。よろしいですか?")){
      render();
      return;
    }
    if(tourBK.finals) unwindFinalsIfNeeded(tourBK);
    var idsBK = currentLineupIds(tourBK);
    var resultBK = computeAiBlockAssignment(idsBK, newCount, tourBK);
    tourBK.blocks.forEach(function(b){
      (b.matches||[]).forEach(function(m){ if(m.winner) undoMatchDeltas(m); });
      if(b.penaltyDeltas){
        Object.keys(b.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= b.penaltyDeltas[id]; });
      }
    });
    tourBK.blockCount = newCount;
    tourBK.blocks = resultBK.sizes.map(function(size, bi){
      var slots = new Array(size).fill(null);
      resultBK.perGroupIds[bi].forEach(function(id, i){ slots[i] = id; });
      return {index:bi, targetSize:size, slots:slots};
    });
    tourBK.blocks.forEach(function(b){ rebuildBlockFromSlots(tourBK, b); });
    if(tourBK.status!=="assigning") captureEntryPoints(tourBK);
    saveState(); render();
  }
  else if(action==="update-elim-group-count"){
    var tidEG = t.getAttribute("data-tid"); var tourEG = findTournament(tidEG);
    if(!tourEG || tourEG.format!=="elimPrelim") return;
    var newCountEG = Math.max(1, Math.round(Number(t.value))||1);
    if(newCountEG===tourEG.elimGroupCount) return;
    var idsEG = currentLineupIds(tourEG);
    var maxBracketSize = BRACKET_SIZES[BRACKET_SIZES.length-1];
    if(Math.ceil(idsEG.length/newCountEG) > maxBracketSize){
      alert("現在の出場人数("+idsEG.length+"名)をグループ数"+newCountEG+"で均等に分けると、1グループあたりの人数が最大フォーマット("+maxBracketSize+"名用)を超えるため、変更できません。グループ数を増やしてください。");
      render();
      return;
    }
    var hasProgEG = tourEG.groups.some(function(g, gi){ return groupOrBlockHasProgress(tourEG, gi); }) || !!tourEG.finals || !!tourEG.preFinals;
    if(hasProgEG && !confirm("グループ数を変更すると、出場選手が自動で再割当され、既に入力されている対戦結果(場合によっては予備決勝戦・決勝トーナメントの結果も)が取り消されます。よろしいですか?")){
      render();
      return;
    }
    if(tourEG.preFinals) unwindPreFinalsIfNeeded(tourEG);
    if(tourEG.finals) unwindFinalsIfNeeded(tourEG);
    var resultEG = computeAiBlockAssignment(idsEG, newCountEG, tourEG);
    tourEG.groups.forEach(function(g){
      if(g.wb){ g.wb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.lb){ g.lb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.penaltyDeltas){
        Object.keys(g.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= g.penaltyDeltas[id]; });
      }
      if(g.futureWbByPos){
        Object.keys(g.futureWbByPos).forEach(function(key){
          var entry = g.futureWbByPos[key];
          if(entry.deltas) entry.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
        });
      }
    });
    tourEG.elimGroupCount = newCountEG;
    var maxGroupLenEG = Math.max.apply(null, resultEG.perGroupIds.map(function(ids){ return ids.length; }));
    tourEG.bracketSize = smallestBracketSizeFor(maxGroupLenEG, tourEG.prelimType);
    applyTplAdvance(tourEG);
    tourEG.groups = resultEG.perGroupIds.map(function(ids, gi){
      var gsEG = makeGroupSlots(tourEG, ids, tourEG.bracketSize);
      return { index:gi, targetSize:gsEG.targetSize, slots: gsEG.slots };
    });
    tourEG.groups.forEach(function(g){ rebuildGroupFromSlots(tourEG, g); });
    if(tourEG.status!=="assigning") captureEntryPoints(tourEG);
    saveState(); render();
  }
  else if(action==="update-finals-target-size"){
    var tidFT = t.getAttribute("data-tid"); var tourFT = findTournament(tidFT);
    if(!tourFT) return;
    var rawFT = t.value;
    tourFT.finalsTargetSize = rawFT==="" ? null : Math.max(1, Math.round(Number(rawFT))||1);
    saveState(); render();
  }

    if(t.value && toura.eligiblePlayerIds && toura.eligiblePlayerIds.indexOf(t.value)<0){

    }

    if(needsWarning && !confirm("この枠の選手を変更すると、既に入力されている対戦結果(場合によっては決勝トーナメントの結果も)が取り消されます。よろしいですか?")){
      render();
      return;
    }

    unwindFinalsIfNeeded(toura);
    var groups = toura.format==="blockPrelim" ? toura.blocks : toura.groups;
    touched.forEach(function(gi){
      if(toura.format==="blockPrelim") rebuildBlockFromSlots(toura, groups[gi]);
      else rebuildGroupFromSlots(toura, groups[gi]);

      unwindFinalsIfNeeded(tourAGWB);

    tourAGWB.advancePerGroupWB = vAGWB;
    tourAGWB.advancePerGroup = tourAGWB.advancePerGroupWB + tourAGWB.advancePerGroupLB;

      if(!confirm("決勝進出人数を変更すると、既に確定している決勝トーナメントの結果が取り消されます。よろしいですか?")){ render(); return; }

    }
    tourAGLB.advancePerGroupLB = vAGLB;
    tourAGLB.advancePerGroup = tourAGLB.advancePerGroupWB + tourAGLB.advancePerGroupLB;
    saveState(); render();
  }
  else if(action==="update-advance-per-block"){
    var tidAB=t.getAttribute("data-tid"); var tourAB=findTournament(tidAB);

    var vAB=Math.max(1, Math.round(Number(t.value))||1);
    if(tourAB.finals && vAB!==tourAB.advancePerBlock){
      if(!confirm("決勝進出人数を変更すると、既に確定している決勝トーナメントの結果が取り消されます。よろしいですか?")){ render(); return; }
      unwindFinalsIfNeeded(tourAB);

    tourAB.advancePerBlock = vAB;
    saveState(); render();

  else if(action==="update-score"){
    var tids=t.getAttribute("data-tid"); var tours=findTournament(tids);

    var scope=t.getAttribute("data-scope");
    var which=t.getAttribute("data-which");
    var raw=t.value;
    var val = raw==="" ? null : Math.max(0, Math.round(Number(raw)));
    if(raw!=="" && !isFinite(val)) return;
    var match=null;
    if(scope==="block"){
      var bidx3=Number(t.getAttribute("data-block"));
      match = tours.blocks[bidx3].matches.find(function(m){ return m.id===t.getAttribute("data-mid"); });
    } else if(scope==="elim"){
      var gi3=Number(t.getAttribute("data-group"));
      var side3=t.getAttribute("data-side");
      match = findElimMatch(tours.groups[gi3], side3, t.getAttribute("data-mid"));
    } else if(scope==="bracket"){
      tours.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.id===t.getAttribute("data-mid")) match=m; }); });

    var idxMT = scopeMT==="block" ? Number(t.getAttribute("data-block")) : (scopeMT==="elim" ? Number(t.getAttribute("data-group")) : null);
    var sideMT = t.getAttribute("data-side");
    var matchMT = findStreamMatch(tourMT, scopeMT, idxMT, sideMT, t.getAttribute("data-mid"));
    if(matchMT){ matchMT.startTime = t.value || null; saveState(); render(); }

}, false);

document.addEventListener("submit", function(e){
  setUserInteracting(false);
  var form = e.target;
  if(form.getAttribute("data-form")==="add-player"){
    e.preventDefault();
    var fd = new FormData(form);
    addPlayer(fd.get("name"), fd.get("points"), fd.get("kana"));
    form.reset();
  }
  else if(form.getAttribute("data-form")==="add-guest-player"){
    e.preventDefault();
    var fdRG = new FormData(form);
    addGuestPlayer(fdRG.get("name"), fdRG.get("kana"), fdRG.get("cls"), fdRG.get("affiliation"));
    form.reset();
  }
  else if(form.getAttribute("data-form")==="add-player-entry"){
    e.preventDefault();
    var tidAPE=form.getAttribute("data-tid"); var tourAPE=findTournament(tidAPE);
    if(!tourAPE) return;
    var fdE = new FormData(form);
    var newId = addPlayer(fdE.get("name"), fdE.get("points"), fdE.get("kana"));
    if(newId){
      tourAPE.entries[newId] = {entered:true, feePaid:false};
      saveState(); render();
    }
    form.reset();
  }
  else if(form.getAttribute("data-form")==="add-guest-entry"){
    e.preventDefault();
    var tidAGE=form.getAttribute("data-tid"); var tourAGE=findTournament(tidAGE);
    if(!tourAGE) return;
    var fdG = new FormData(form);
    var newGuestId = addGuestPlayer(fdG.get("name"), fdG.get("kana"), fdG.get("cls"), fdG.get("affiliation"));
    if(newGuestId){
      tourAGE.entries[newGuestId] = {entered:true, feePaid:false};
      saveState(); render();
    }
    form.reset();
  }
  else if(form.getAttribute("data-form")==="qr-event-register"){
    e.preventDefault();
    var tidQR=form.getAttribute("data-tid"); var tourQR=findTournament(tidQR);
    if(!tourQR) return;
    var fdQR = new FormData(form);
    var newQRId = addGuestPlayer(fdQR.get("name"), fdQR.get("kana"), fdQR.get("cls"), fdQR.get("affiliation"));
    if(newQRId){
      tourQR.entries[newQRId] = {entered:true, feePaid:false};
      setStoredEventPlayerId(newQRId);
      route.qrEventForm = null;
      saveState(); render();
    }
  }
  else if(form.getAttribute("data-form")==="create-tournament-shell"){
    e.preventDefault();
    var fdS = new FormData(form);
    var nameS = (fdS.get("name")||"").trim();
    if(!nameS){ alert("大会名を入力してください。"); return; }
    createTournamentShell(nameS, fdS.get("eventDate"));
  }
  else if(form.getAttribute("data-form")==="tournament-setup"){
    e.preventDefault();
    var tidTS=form.getAttribute("data-tid"); var tourTS=findTournament(tidTS);
    if(!tourTS) return;
    var nt = ensureTournamentSetupState(tourTS);
    if(nt.totalParticipants < 2){ alert("参加人数は2名以上にしてください。"); return; }
    if(nt.format==="elimPrelim"){
      if(nt.totalParticipants > 128){ alert("参加人数が128名を超えています。128名までのトーナメントに対応しています。"); return; }
      var bracketSize = smallestBracketSizeFor(nt.totalParticipants, nt.prelimType);
      var effectiveAdvancePerGroup = hasLoserBracketType(nt.prelimType) ? (nt.advancePerGroupWB+nt.advancePerGroupLB) : nt.advancePerGroup;
      var variantsTS = tplVariantsFor(nt.prelimType, bracketSize);
      if(nt.prelimType==="double" && variantsTS.length>1){
        var chosenTS = variantsTS.filter(function(v){ return v.wbAdvance+v.lbAdvance===nt.tplAdvance; })[0] || variantsTS[0];
        effectiveAdvancePerGroup = chosenTS.wbAdvance + chosenTS.lbAdvance;
      }
      if(nt.prelimType==="single" && variantsTS.length && tplHasFixedAdvance(variantsTS[0].key)){
        effectiveAdvancePerGroup = variantsTS[0].wbAdvance + variantsTS[0].lbAdvance;
      }
      if(hasLoserBracketType(nt.prelimType) && effectiveAdvancePerGroup<1){ alert("決勝進出人数(勝者側+敗者側)は1名以上にしてください。"); return; }
      if(bracketSize < effectiveAdvancePerGroup){ alert("決勝進出人数がフォーマットの人数より多くなっています。"); return; }
      finalizeTournamentSetup(tourTS, {format:"elimPrelim", prelimType:nt.prelimType, lbOneSetDown:nt.lbOneSetDown, bracketSize:bracketSize, advancePerGroup:effectiveAdvancePerGroup, advancePerGroupWB:nt.advancePerGroupWB, advancePerGroupLB:nt.advancePerGroupLB, totalParticipants:nt.totalParticipants, selectedIds:nt.selectedIds, usePointsAndSets:nt.usePointsAndSets, setCountTable:nt.setCountTable, customSets:nt.customSets, useSchedule:nt.useSchedule, estTables:nt.estTables, estMinutes:nt.estMinutes});
    } else {
      if(nt.totalParticipants < nt.blockCount*2){ alert("参加人数がブロック数に対して少なすぎます。"); return; }
      if(Math.floor(nt.totalParticipants/nt.blockCount) < nt.advancePerBlock){ alert("各ブロックからの決勝進出人数が、1ブロックあたりの人数より多くなっています。"); return; }
      finalizeTournamentSetup(tourTS, {format:"blockPrelim", groupCount:nt.blockCount, advancePerBlock:nt.advancePerBlock, totalParticipants:nt.totalParticipants, selectedIds:nt.selectedIds, usePointsAndSets:nt.usePointsAndSets, setCountTable:nt.setCountTable, customSets:nt.customSets, useSchedule:nt.useSchedule, estTables:nt.estTables, estMinutes:nt.estMinutes});
    }
  }
}, false);

// ============ INIT ============
state = loadState();
saveLocalOnly();
if(DISPLAY_MODE){ document.body.classList.add("display-mode-active"); }
if(STREAM_MODE){
  document.body.classList.add("display-mode-active");
  if(STREAM_TRANSPARENT) document.body.classList.add("stream-transparent-active");
}
if(DRAW_MODE){ document.body.classList.add("display-mode-active"); }
if(GUIDE_MODE){ document.body.classList.add("guide-mode-active"); }
render();
syncFromServer();
if(DISPLAY_MODE){ setInterval(syncFromServer, DISPLAY_POLL_MS); startDisplayAutoScroll(); }
if(STREAM_MODE){ setInterval(syncFromServer, STREAM_POLL_MS); }
if(DRAW_MODE){ setInterval(syncFromServer, DRAW_POLL_MS); }

})();
</script>
