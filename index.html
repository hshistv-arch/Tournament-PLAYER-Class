@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130E; --surface:#1D1A13; --surface-2:#242019; --text:#F1EBDC; --muted:#B0A48A;
    --border:#332D20; --accent:#E0AC55; --accent-ink:#F7E4BC; --felt:#3E9270; --felt-ink:#CDEFDF;
    --rust:#D98567; --rust-ink:#FBE1D6; --win:#4FAE78; --loss:#E06C64;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15130E; --surface:#1D1A13; --surface-2:#242019; --text:#F1EBDC; --muted:#B0A48A;
  --border:#332D20; --accent:#E0AC55; --accent-ink:#F7E4BC; --felt:#3E9270; --felt-ink:#CDEFDF;
  --rust:#D98567; --rust-ink:#FBE1D6; --win:#4FAE78; --loss:#E06C64;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#EFEBDF; --text:#211E17; --muted:#746B58;
  --border:#E1DACB; --accent:#B8862E; --accent-ink:#5C4718; --felt:#1E5C42; --felt-ink:#123424;
  --rust:#A5583A; --rust-ink:#6B3320; --win:#2E7D4F; --loss:#B23A34;
  --shadow: 0 1px 2px rgba(33,30,23,.06), 0 4px 12px rgba(33,30,23,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image: linear-gradient(color-mix(in srgb, var(--bg) 80%, transparent), color-mix(in srgb, var(--bg) 80%, transparent)), var(--logo-url);
  background-size: cover; background-position: center top; background-attachment: fixed; background-repeat: no-repeat;
  color:var(--text); font-family:var(--font-body);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0 0 .3em;}
h1{font-size:1.5rem;} h2{font-size:1.2rem;} h3{font-size:1.02rem;}
a{color:inherit;}
button{font-family:inherit;}
.num{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
.app-shell{display:flex; min-height:100vh;}
.sidenav{
  width:216px; flex:0 0 216px; background:var(--surface-2); border-right:1px solid var(--border);
  padding:1.1rem .9rem; display:flex; flex-direction:column; gap:1.4rem;
}
.brand{display:flex; flex-direction:column; gap:.4rem; padding:0 .35rem; align-items:center; text-align:center;}
.brand-logo{width:100%; max-width:168px; aspect-ratio:546/472; background-image:var(--logo-url); background-size:contain; background-position:center; background-repeat:no-repeat;}
.brand .eyebrow{font-size:.68rem; letter-spacing:.08em; color:var(--muted); text-transform:uppercase;}
.brand .title{font-family:var(--font-display); font-size:1.08rem; font-weight:700; line-height:1.3;}
.navgroup{display:flex; flex-direction:column; gap:.15rem;}
.navlink{
  display:flex; align-items:center; gap:.55rem; padding:.55rem .65rem; border-radius:8px;
  color:var(--muted); text-decoration:none; cursor:pointer; font-size:.92rem; border:1px solid transparent;
  background:none; text-align:left; width:100%;
}
.navlink:hover{background:var(--surface); color:var(--text);}
.navlink.active{background:var(--surface); color:var(--text); border-color:var(--border); font-weight:600;}
.navlink .ico{width:1.1em; text-align:center; opacity:.85;}
.nav-spacer{flex:1;}
.nav-foot{font-size:.72rem; color:var(--muted); padding:0 .35rem;}
.main{flex:1; min-width:0; padding:1.6rem 2rem 4rem;}
.main-inner{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
.page-head p.sub{color:var(--muted); margin:.15rem 0 0; font-size:.88rem;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:1.1rem 1.2rem; box-shadow:var(--shadow);
}
.card > h2, .card > h3{margin-bottom:.8rem;}
.stat-row{display:flex; gap:.7rem; flex-wrap:wrap;}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:.7rem 1rem; flex:1; min-width:130px; box-shadow:var(--shadow);
}
.stat .label{font-size:.72rem; color:var(--muted); letter-spacing:.03em;}
.stat .value{font-size:1.4rem; font-weight:700; margin-top:.15rem;}
.tabs{display:flex; gap:.3rem; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab{
  padding:.5rem .85rem; border:none; background:none; color:var(--muted); cursor:pointer;
  font-size:.88rem; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab.active{color:var(--text); border-bottom-color:var(--accent); font-weight:600;}
.btn{
  display:inline-flex; align-items:center; gap:.4rem; padding:.5rem .9rem; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
  font-size:.86rem; font-weight:600; white-space:nowrap;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#211605;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-felt{background:var(--felt); border-color:var(--felt); color:#fff;}
.btn-ghost{background:none; border-color:transparent;}
.btn-danger{color:var(--loss); border-color:var(--loss);}
.btn-sm{padding:.3rem .55rem; font-size:.78rem;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.field{display:flex; flex-direction:column; gap:.3rem;}
.field label{font-size:.78rem; color:var(--muted);}
.field input[type=text], .field input[type=number], .field select{
  padding:.5rem .6rem; border:1px solid var(--border); border-radius:8px; background:var(--bg);
  color:var(--text); font-size:.92rem; font-family:inherit;
}
.field input[type=number]{font-family:var(--font-num);}
.form-row{display:flex; gap:.8rem; flex-wrap:wrap; align-items:end;}
.radio-card-row{display:flex; gap:.7rem; flex-wrap:wrap;}
.radio-card{
  flex:1; min-width:240px; border:1px solid var(--border); border-radius:var(--radius); padding:.75rem .9rem;
  cursor:pointer; display:flex; gap:.6rem; align-items:flex-start; background:var(--surface);
}
.radio-card:hover{border-color:var(--accent);}
.radio-card input{margin-top:.2rem;}
.radio-card .rc-title{font-weight:700; font-size:.92rem;}
.radio-card .rc-desc{font-size:.78rem; color:var(--muted); margin-top:.15rem;}
.radio-card.checked{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--surface));}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
table.data{border-collapse:collapse; width:100%; font-size:.88rem;}
table.data th, table.data td{padding:.5rem .65rem; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
table.data thead th{background:var(--surface-2); position:sticky; top:0; font-size:.74rem; color:var(--muted); letter-spacing:.02em;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:var(--surface-2);}
table.matrix{border-collapse:collapse; font-size:.78rem;}
table.matrix th, table.matrix td{border:1px solid var(--border); padding:0; text-align:center;}
table.matrix thead th{background:var(--surface-2); padding:.35rem .4rem; font-size:.72rem; color:var(--muted);}
table.matrix tbody th{background:var(--surface-2); padding:.35rem .5rem; font-size:.75rem; color:var(--text); text-align:left;}
table.matrix input{
  width:2.6rem; text-align:center; border:none; background:none; padding:.4rem .1rem; font-family:var(--font-num);
  color:var(--text);
}
table.matrix input:focus{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface);}
table.matrix td.pos input{color:var(--win);}
table.matrix td.neg input{color:var(--loss);}
.badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:2.6em; padding:.15rem .5rem;
  border-radius:999px; font-size:.74rem; font-weight:700; font-family:var(--font-num); letter-spacing:.02em;
}
.badge.tier-A{background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent-ink);}
.badge.tier-B{background:color-mix(in srgb, var(--felt) 22%, transparent); color:var(--felt-ink);}
.badge.tier-C{background:color-mix(in srgb, var(--rust) 22%, transparent); color:var(--rust-ink);}
.pill{display:inline-flex; align-items:center; gap:.35rem; padding:.2rem .6rem; border-radius:999px; font-size:.74rem; font-weight:600; border:1px solid var(--border);}
.pill.setup{color:var(--muted);}
.pill.assigning{color:var(--rust-ink); border-color:var(--rust); background:color-mix(in srgb, var(--rust) 14%, transparent);}
.pill.prelim{color:var(--accent-ink); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent);}
.pill.finals{color:var(--felt-ink); border-color:var(--felt); background:color-mix(in srgb, var(--felt) 16%, transparent);}
.pill.completed{color:var(--muted); background:var(--surface-2);}
.delta-plus{color:var(--win); font-weight:700;}
.delta-minus{color:var(--loss); font-weight:700;}
.checklist{display:flex; flex-direction:column; gap:0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.check-row{display:flex; align-items:center; gap:.6rem; padding:.5rem .7rem; border-bottom:1px solid var(--border); font-size:.88rem;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:var(--surface-2);}
.check-row .name{flex:1;}
.match-row{display:flex; align-items:center; gap:.6rem; padding:.55rem .3rem; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.match-row:last-child{border-bottom:none;}
.match-side{display:flex; align-items:center; gap:.3rem; flex:1; min-width:170px;}
.match-vs{color:var(--muted); font-size:.78rem;}
.match-result{font-size:.78rem; color:var(--muted); margin-left:auto;}
.empty-note{color:var(--muted); font-size:.86rem; padding:.6rem 0;}
.result-banner{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.1rem;}
.result-banner h3{margin-bottom:.5rem;}

var PLAYER_SEED = [
["池田 義則",54],["池辺 明弘",50],["池辺 龍太郎",58],["石井 伸之",101],["石川 証",87],

["清水 知男",82],["鈴木 拓也",100],["鈴木 光俊",120],["須田 誠治",61],["関口 芳則",47],
["瀬沼 孝徳",58],["瀬間 康憲",37],["高橋 卓",79],["竹内",97],["丹治 秀徳",52],

var CURRENT_ROSTER_VERSION = 2;

function defaultState(){
  return {
    settings:{
      classBounds: DEFAULT_CLASS_BOUNDS.map(function(b){return {code:b.code,min:b.min};}),
      winMatrix: JSON.parse(JSON.stringify(WIN_MATRIX_DEFAULT)),
      loseMatrix: JSON.parse(JSON.stringify(LOSE_MATRIX_DEFAULT)),
      bonuses: JSON.parse(JSON.stringify(BONUS_DEFAULT))
    },
    players: PLAYER_SEED.map(function(row,i){
      return {id:"p"+(i+1), name:row[0], points:row[1]};
    }),
    rosterVersion: CURRENT_ROSTER_VERSION,
    entries: {},
    previousChampionId: null,
    tournaments: [],
    currentTournamentId: null
  };
}

var STORAGE_KEY = "billiards_tourney_state_v4";
var state = null;

function migrateBestBorC(parsed){
  if(parsed && parsed.settings && parsed.settings.bonuses){
    var b = parsed.settings.bonuses;
    if(b.bestBorCInFinals!==undefined && b.bestCInFinals===undefined){
      b.bestCInFinals = b.bestBorCInFinals;
      delete b.bestBorCInFinals;
    }
  }
  return parsed;
}
function applyRosterUpdate(parsed){
  var version = parsed.rosterVersion || 1;
  if(version >= CURRENT_ROSTER_VERSION) return parsed;
  var byName = {};
  parsed.players.forEach(function(p){ byName[p.name] = p; });
  PLAYER_SEED.forEach(function(row){
    var name = row[0], points = row[1];
    if(byName[name]){
      byName[name].points = points;
    } else {
      var id = "p_seed_" + Date.now() + "_" + Math.floor(Math.random()*100000);
      parsed.players.push({id:id, name:name, points:points});
    }
  });
  parsed.rosterVersion = CURRENT_ROSTER_VERSION;
  return parsed;
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.settings && parsed.players){
        parsed.entries = parsed.entries || {};
        return applyRosterUpdate(migrateBestBorC(parsed));
      }
    }
    var legacy = localStorage.getItem("billiards_tourney_state_v3");
    if(legacy){
      var parsedLegacy = JSON.parse(legacy);
      if(parsedLegacy && parsedLegacy.settings && parsedLegacy.players){
        parsedLegacy.entries = {};
        return applyRosterUpdate(migrateBestBorC(parsedLegacy));
      }
    }
  }catch(e){ console.warn("state load failed", e); }
  return defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("state save failed", e); }
}

function getPlayer(id){
  for(var i=0;i<state.players.length;i++) if(state.players[i].id===id) return state.players[i];
  return null;
}
function playerName(id){ var p=getPlayer(id); return p ? p.name : "(削除された選手)"; }
function pointsOf(id){ var p=getPlayer(id); return p ? p.points : 0; }

function classOf(points){
  var bounds = state.settings.classBounds;
  for(var i=0;i<bounds.length;i++){ if(points>=bounds[i].min) return bounds[i].code; }
  return bounds[bounds.length-1].code;
}
function tierOf(code){
  var c = code.charAt(0);
  return c==="S" ? "A" : c;
}
function tierBelowB(id){
  var t = tierOf(classOf(pointsOf(id)));
  return t==="B" || t==="C";
}
function classRangeLabel(bounds, idx){
  var b = bounds[idx];
  if(idx===0) return b.min+"以上";
  var prevMin = bounds[idx-1].min;
  return b.min+"～"+(prevMin-1);
}
function findTournament(id){
  for(var i=0;i<state.tournaments.length;i++) if(state.tournaments[i].id===id) return state.tournaments[i];
  return null;
}
function distributeCount(total, groups){
  groups = Math.max(1, groups);
  var base = Math.floor(total/groups), rem = total%groups;
  var sizes = [];
  for(var i=0;i<groups;i++) sizes.push(base + (i<rem?1:0));
  return sizes;
}
function eligiblePlayerIdsForNewEvent(){
  return state.players.filter(function(p){
    var e = state.entries[p.id];
    return e && e.entered && e.feePaid;
  }).map(function(p){ return p.id; });
}

// ---------- routing ----------
var route = {screen:"roster"};
function navigate(r){ route = r; render(); window.scrollTo(0,0); }

// ---------- generic helpers ----------
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function fmtDelta(n){
  if(n===0 || n==null) return '<span class="hint">±0</span>';
  return n>0 ? '<span class="delta-plus">+'+n+'</span>' : '<span class="delta-minus">'+n+'</span>';
}
function badge(code){ return '<span class="badge tier-'+tierOf(code)+'">'+code+'</span>'; }
function dateStamp(ts){
  var d = ts ? new Date(ts) : new Date();
  var p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

// ---------- round robin / seeding ----------
function roundRobinPairs(ids){
  var pairs=[];
  for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);
  return pairs;
}
function seedOrder(size){
  var seeds=[1,2];
  while(seeds.length<size){
    var total = seeds.length*2+1;
    var next=[];
    for(var i=0;i<seeds.length;i++) next.push(seeds[i], total-seeds[i]);
    seeds=next;
  }
  return seeds;
}
function computeDefaultBracketSlots(ids){
  var sorted = ids.slice().sort(function(a,b){ return pointsOf(b)-pointsOf(a); });
  var size=1; while(size<sorted.length) size*=2;
  var order = seedOrder(size);
  return order.map(function(seedIdx){ return sorted[seedIdx-1] || null; });
}
function buildBracketFromSlots(slots){
  var round1=[];
  for(var i=0;i<slots.length;i+=2){
    var a=slots[i], b=slots[i+1];
    var bye = (!a || !b);
    round1.push({
      id:"r1_m"+(i/2), round:1, a:a, b:b,
      winner: bye ? (a || b) : null,
      deltas: null, bye: bye, score:{a:null,b:null}
    });
  }
  var totalRounds = Math.max(1, Math.round(Math.log2(slots.length)));
  var bracket = {totalRounds:totalRounds, rounds:[round1], eliminatedRound:{}, entrants: slots.filter(function(x){ return x; })};
  maybeAdvanceRounds(bracket);
  return bracket;
}
function buildBracket(ids){
  return buildBracketFromSlots(computeDefaultBracketSlots(ids));
}
function roundIsDone(round){
  return round.every(function(m){ return !!m.winner || (m.bye && !m.a && !m.b); });
}
function maybeAdvanceRounds(bracket){
  while(true){
    var last = bracket.rounds[bracket.rounds.length-1];
    var allDone = roundIsDone(last);
    if(!allDone) break;
    if(bracket.rounds.length>=bracket.totalRounds) break;
    var winners = last.map(function(m){ return m.winner; });
    var nextRound=[];
    for(var i=0;i<winners.length;i+=2){
      var a=winners[i], b=winners[i+1];
      var bye = (!a || !b);
      nextRound.push({
        id:"r"+(bracket.rounds.length+1)+"_m"+(i/2), round: bracket.rounds.length+1,
        a:a, b:b, winner: bye ? (a||b) : null, deltas:null, bye:bye, score:{a:null,b:null}
      });
    }
    bracket.rounds.push(nextRound);
  }
}
function roundName(roundIdx, totalRounds){
  var fromEnd = totalRounds-roundIdx;
  if(fromEnd===0) return "決勝";
  if(fromEnd===1) return "準決勝";
  if(fromEnd===2) return "準々決勝";
  return roundIdx+"回戦";
}

// ---------- core scoring engine ----------
function resolveMatch(match, winnerId){
  var loserId = winnerId===match.a ? match.b : match.a;
  var winner = getPlayer(winnerId), loser = getPlayer(loserId);
  if(!winner || !loser) return [];
  var wClass = classOf(winner.points), lClass = classOf(loser.points);
  var winDelta = state.settings.winMatrix[wClass][lClass] || 0;
  var loseDelta = state.settings.loseMatrix[lClass][wClass] || 0;
  var deltas=[];
  if(winDelta){ winner.points += winDelta; deltas.push({playerId:winnerId, amount:winDelta, reason:"勝利 ("+wClass+" vs "+lClass+")"}); }
  if(loseDelta){ loser.points += loseDelta; deltas.push({playerId:loserId, amount:loseDelta, reason:"敗北 ("+lClass+" vs "+wClass+")"}); }
  if(state.previousChampionId && loserId===state.previousChampionId){
    var b = state.settings.bonuses.beatPrevChampion || 0;
    if(b){ winner.points += b; deltas.push({playerId:winnerId, amount:b, reason:BONUS_LABELS.beatPrevChampion}); }
  }
  match.winner = winnerId;
  match.deltas = deltas;
  return deltas;
}
function undoMatchDeltas(match){
  if(!match.winner || !match.deltas) { match.winner=null; match.deltas=null; return; }
  match.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
  match.winner=null; match.deltas=null;
}

// ---------- ② block prelim ----------
function recomputeBlockElimination(block){
  var losses={};
  block.playerIds.forEach(function(id){ losses[id]=0; });
  block.matches.forEach(function(m){
    if(m.winner){ var loserId = m.winner===m.a ? m.b : m.a; losses[loserId]=(losses[loserId]||0)+1; }
  });
  block.eliminated = block.eliminated || {};
  block.penaltyDeltas = block.penaltyDeltas || {};
  block.playerIds.forEach(function(id){
    var was = !!block.eliminated[id];
    var now = losses[id]>=2;
    if(now && !was){
      block.eliminated[id]=true;
      var pen = state.settings.bonuses.prelimDoubleLossPenalty || 0;
      if(pen){ var p=getPlayer(id); if(p) p.points += pen; block.penaltyDeltas[id]=pen; }
    } else if(!now && was){
      block.eliminated[id]=false;
      var applied = block.penaltyDeltas[id];
      if(applied){ var p2=getPlayer(id); if(p2) p2.points -= applied; delete block.penaltyDeltas[id]; }
    }
  });
  block.losses = losses;
}
function correctBlockMatch(t, block, matchId){
  unwindFinalsIfNeeded(t);
  var match = block.matches.find(function(m){ return m.id===matchId; });
  if(!match || !match.winner) return;
  undoMatchDeltas(match);
  recomputeBlockElimination(block);
}
function finalizeBlockPrelim(t){
  var advancers=[];
  t.blocks.forEach(function(block){
    var ranked = block.playerIds.slice().sort(function(a,b){
      var wa = block.matches.filter(function(m){ return m.winner===a; }).length;
      var wb = block.matches.filter(function(m){ return m.winner===b; }).length;
      if(wb!==wa) return wb-wa;
      return pointsOf(b)-pointsOf(a);
    });
    var adv = ranked.slice(0, t.advancePerBlock);
    block.advanced = adv;
    advancers = advancers.concat(adv);
  });
  applyAdvanceBonusAndBuildFinals(t, advancers);
}
function rebuildBlockFromSlots(t, b){
  if(b.matches){
    b.matches.forEach(function(m){ if(m.winner) undoMatchDeltas(m); });
  }
  if(b.penaltyDeltas){
    Object.keys(b.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= b.penaltyDeltas[id]; });
  }
  var real = b.slots.filter(function(x){ return x; });
  b.playerIds = real;
  b.matches = roundRobinPairs(real).map(function(pair,i){ return {id:"b"+b.index+"m"+i, a:pair[0], b:pair[1], winner:null, deltas:null, score:{a:null,b:null}}; });
  b.eliminated={}; b.losses={}; b.penaltyDeltas={}; b.advanced=[];
}

// ---------- ① single/double elimination prelim (per group) ----------
function tallyLosses(roundsArr, losses){
  roundsArr.forEach(function(round){
    round.forEach(function(m){
      if(m.winner && !m.bye){ var loserId = m.winner===m.a ? m.b : m.a; losses[loserId]=(losses[loserId]||0)+1; }
    });
  });
}
function recomputeElimGroup(t, g){
  var threshold = g.threshold;
  var ids = g.wb.entrants;
  var losses = {};
  ids.forEach(function(id){ losses[id]=0; });
  tallyLosses(g.wb.rounds, losses);
  if(t.prelimType==="double") tallyLosses(g.lb.rounds, losses);
  g.eliminated = g.eliminated || {};
  g.penaltyDeltas = g.penaltyDeltas || {};
  ids.forEach(function(id){
    var was = !!g.eliminated[id];
    var now = losses[id] >= threshold;
    if(now && !was){
      g.eliminated[id] = true;
      if(threshold===2){
        var pen = state.settings.bonuses.prelimDoubleLossPenalty || 0;
        if(pen){ var p=getPlayer(id); if(p) p.points += pen; g.penaltyDeltas[id]=pen; }
      }
    } else if(!now && was){
      g.eliminated[id] = false;
      var applied = g.penaltyDeltas[id];
      if(applied){ var p2=getPlayer(id); if(p2) p2.points -= applied; delete g.penaltyDeltas[id]; }
    }
  });
  g.losses = losses;
  g.aliveCount = ids.filter(function(id){ return losses[id] < threshold; }).length;
}
function lbRoundSource(prelim, i){
  if(i % 2 === 1){
    if(i===1){
      var wbR1 = prelim.wb.rounds[0];
      if(!wbR1 || !roundIsDone(wbR1)) return null;
      return wbR1.filter(function(m){ return !m.bye; }).map(function(m){ return m.winner===m.a?m.b:m.a; });
    }
    var prevLB = prelim.lb.rounds[i-2];
    if(!prevLB || !roundIsDone(prevLB)) return null;
    return prevLB.map(function(m){ return m.winner; }).filter(function(x){ return x; });
  }
  var prevLB2 = prelim.lb.rounds[i-2];
  if(!prevLB2 || !roundIsDone(prevLB2)) return null;
  var wbRoundIdx = (i/2+1)-1;
  var wbRound = prelim.wb.rounds[wbRoundIdx];
  if(!wbRound || !roundIsDone(wbRound)) return null;
  var lbWinners = prevLB2.map(function(m){ return m.winner; }).filter(function(x){ return x; });
  var wbLosers = wbRound.filter(function(m){ return !m.bye; }).map(function(m){ return m.winner===m.a?m.b:m.a; });
  return lbWinners.concat(wbLosers);
}
function advanceLB(prelim){
  var guard=0;
  while(guard<40){
    guard++;
    var nextIdx = prelim.lb.rounds.length+1;
    var source = lbRoundSource(prelim, nextIdx);
    if(!source) break;
    if(source.length===0) break;
    var matches=[];
    for(var idx=0; idx<source.length; idx+=2){
      var a=source[idx], b=source[idx+1];
      if(b===undefined){
        matches.push({id:"lb_r"+nextIdx+"_m"+(idx/2), round:nextIdx, a:a, b:null, winner:a, deltas:null, bye:true, score:{a:null,b:null}});
      } else {
        matches.push({id:"lb_r"+nextIdx+"_m"+(idx/2), round:nextIdx, a:a, b:b, winner:null, deltas:null, bye:false, score:{a:null,b:null}});
      }
    }
    prelim.lb.rounds.push(matches);
  }
}
function advanceElimGroup(t, g){
  maybeAdvanceRounds(g.wb);
  if(t.prelimType==="double") advanceLB(g);
}
function findElimMatch(g, side, mid){
  var rounds = side==="wb" ? g.wb.rounds : g.lb.rounds;
  var found=null;
  rounds.forEach(function(r){ r.forEach(function(m){ if(m.id===mid) found=m; }); });
  return found;
}
function correctElimMatch(t, g, side, matchId){
  unwindFinalsIfNeeded(t);
  if(side==="wb"){
    var match = findElimMatch(g, "wb", matchId);
    if(!match || match.bye || !match.winner) return;
    var targetRound = match.round;
    if(t.prelimType==="double"){
      var affectedLbFrom = targetRound===1 ? 1 : 2*(targetRound-1);
      var keepLbCount = affectedLbFrom - 1;
      while(g.lb.rounds.length > keepLbCount){
        var poppedLb = g.lb.rounds.pop();
        poppedLb.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
      }
    }
    while(g.wb.rounds.length > targetRound){
      var poppedWb = g.wb.rounds.pop();
      poppedWb.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
    }
    undoMatchDeltas(match);
  } else {
    var matchLb = findElimMatch(g, "lb", matchId);
    if(!matchLb || matchLb.bye || !matchLb.winner) return;
    var targetRoundLb = matchLb.round;
    while(g.lb.rounds.length > targetRoundLb){
      var popped2 = g.lb.rounds.pop();
      popped2.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
    }
    undoMatchDeltas(matchLb);
  }
  advanceElimGroup(t, g);
  recomputeElimGroup(t, g);
}
function finalizeElimPrelim(t){
  var advancers=[];
  t.groups.forEach(function(g){
    var alive = g.wb.entrants.filter(function(id){ return g.losses[id] < g.threshold; });
    var ranked = alive.slice().sort(function(a,b){ return pointsOf(b)-pointsOf(a); });
    if(ranked.length > t.advancePerGroup) ranked = ranked.slice(0, t.advancePerGroup);
    g.advanced = ranked;
    advancers = advancers.concat(ranked);
  });
  applyAdvanceBonusAndBuildFinals(t, advancers);
}
function rebuildGroupFromSlots(t, g){
  if(g.wb){
    g.wb.rounds.forEach(function(round){ round.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  }
  if(g.lb){
    g.lb.rounds.forEach(function(round){ round.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  }
  if(g.penaltyDeltas){
    Object.keys(g.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= g.penaltyDeltas[id]; });
  }
  g.wb = buildBracketFromSlots(g.slots);
  g.lb = t.prelimType==="double" ? {rounds:[]} : null;
  g.losses={}; g.eliminated={}; g.penaltyDeltas={};
  g.threshold = t.prelimType==="double" ? 2 : 1;
  advanceElimGroup(t, g);
  recomputeElimGroup(t, g);
}

function applyAdvanceBonusAndBuildFinals(t, advancers){
  var bonus = state.settings.bonuses.finalsAdvance || 0;
  t.advanceBonusApplied = t.advanceBonusApplied || {};
  advancers.forEach(function(id){
    if(!t.advanceBonusApplied[id] && bonus){
      var p=getPlayer(id); if(p){ p.points += bonus; t.advanceBonusApplied[id]=bonus; }
    }
  });
  t.finalists = advancers;
  t.finals = buildBracket(advancers);
  t.status = "finals";
}

function finalizeTournamentResult(t){
  var lastRound = t.finals.rounds[t.finals.rounds.length-1];
  var finalMatch = lastRound[0];
  var championId = finalMatch.winner;
  var runnerUpId = championId===finalMatch.a ? finalMatch.b : finalMatch.a;
  var bonuses = state.settings.bonuses;
  var finishDeltas=[];
  function progressRank(id){
    if(id===championId) return Infinity;
    var r = t.finals.eliminatedRound[id];
    return (r===undefined) ? -1 : r;
  }
  var champAmt = tierBelowB(championId) ? bonuses.championBelowB : bonuses.champion;
  if(champAmt){ getPlayer(championId).points += champAmt; finishDeltas.push({playerId:championId, amount:champAmt, reason:BONUS_LABELS.champion}); }
  if(runnerUpId){
    var ruAmt = tierBelowB(runnerUpId) ? bonuses.runnerUpBelowB : bonuses.runnerUp;
    if(ruAmt){ getPlayer(runnerUpId).points += ruAmt; finishDeltas.push({playerId:runnerUpId, amount:ruAmt, reason:BONUS_LABELS.runnerUp}); }
  }
  var entrants = t.finals.entrants;
  var bTier = entrants.filter(function(id){ return tierOf(classOf(pointsOf(id)))==="B"; });
  var cTier = entrants.filter(function(id){ return tierOf(classOf(pointsOf(id)))==="C"; });
  function pickBest(list){
    if(!list.length) return null;
    return list.slice().sort(function(a,b){
      var pr = progressRank(b)-progressRank(a);
      if(pr!==0) return pr;
      return pointsOf(b)-pointsOf(a);
    })[0];
  }
  var bestB = pickBest(bTier);
  if(bestB && bonuses.bestBInFinals){ getPlayer(bestB).points += bonuses.bestBInFinals; finishDeltas.push({playerId:bestB, amount:bonuses.bestBInFinals, reason:BONUS_LABELS.bestBInFinals}); }
  var bestC = pickBest(cTier);
  if(bestC && bonuses.bestCInFinals){ getPlayer(bestC).points += bonuses.bestCInFinals; finishDeltas.push({playerId:bestC, amount:bonuses.bestCInFinals, reason:BONUS_LABELS.bestCInFinals}); }
  t.finishDeltas = finishDeltas;
  t.championId = championId;
  t.runnerUpId = runnerUpId;
  t.previousChampionBefore = (state.previousChampionId===undefined) ? null : state.previousChampionId;
  state.previousChampionId = championId;
  t.status = "completed";
}
function reverseFinalize(t){
  if(!t.finishDeltas) { return; }
  t.finishDeltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
  state.previousChampionId = (t.previousChampionBefore===undefined) ? null : t.previousChampionBefore;
  t.finishDeltas=null; t.championId=null; t.runnerUpId=null; t.previousChampionBefore=undefined;
}
function correctBracketMatch(t, matchId){
  var finals = t.finals;
  var match=null, matchRound=null;
  finals.rounds.forEach(function(r,ri){ r.forEach(function(m){ if(m.id===matchId){ match=m; matchRound=ri+1; } }); });
  if(!match || match.bye || !match.winner) return;
  if(t.status==="completed"){ reverseFinalize(t); t.status="finals"; }
  while(finals.rounds.length > matchRound){
    var popped = finals.rounds.pop();
    popped.forEach(function(m){
      if(m.winner && !m.bye){
        var loserId = m.winner===m.a?m.b:m.a;
        delete finals.eliminatedRound[loserId];
        undoMatchDeltas(m);
      }
    });
  }
  var loserId2 = match.winner===match.a?match.b:match.a;
  delete finals.eliminatedRound[loserId2];
  undoMatchDeltas(match);
}
function unwindFinalsIfNeeded(t){
  if(!t.finals) return;
  if(t.status==="completed") reverseFinalize(t);
  t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  if(t.advanceBonusApplied){
    Object.keys(t.advanceBonusApplied).forEach(function(id){
      var p=getPlayer(id); if(p) p.points -= t.advanceBonusApplied[id];
    });
    t.advanceBonusApplied = {};
  }
  t.finals = null;
  t.finalists = null;
  t.status = "prelim";
}
function groupOrBlockHasProgress(t, idx){
  if(t.format==="blockPrelim"){
    var b = t.blocks[idx];
    return !!(b.matches && b.matches.some(function(m){ return !!m.winner; }));
  }
  var g = t.groups[idx];
  if(!g.wb) return false;
  var wbHas = g.wb.rounds.some(function(r){ return r.some(function(m){ return m.winner && !m.bye; }); });
  var lbHas = g.lb && g.lb.rounds.some(function(r){ return r.some(function(m){ return m.winner && !m.bye; }); });
  return wbHas || !!lbHas;
}
function resizeGroupOrBlockSlots(t, idx, newSize){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  var g = groups[idx];
  var newLen = newSize;
  if(t.format==="elimPrelim"){
    newLen = 1; while(newLen < newSize) newLen *= 2;
  }
  var newSlots = g.slots.slice(0, newLen);
  while(newSlots.length < newLen) newSlots.push(null);
  g.slots = newSlots;
  g.targetSize = newSize;
}

// ---------- roster mutation actions ----------
function addPlayer(name, points){
  name=(name||"").trim();
  if(!name) return;
  points = Math.round(Number(points));
  if(!isFinite(points)) points=50;
  var id = "p_" + Date.now() + "_" + Math.floor(Math.random()*1000);
  state.players.push({id:id, name:name, points:points});
  saveState(); render();
}
function updatePlayerPoints(id, points){
  var p=getPlayer(id); if(!p) return;
  points=Math.round(Number(points));
  if(!isFinite(points)) return;
  p.points=points; saveState(); render();
}
function deletePlayer(id){
  if(!confirm("この選手をロースターから削除しますか?過去の大会記録の名前表示は保持されます。")) return;
  state.players = state.players.filter(function(p){ return p.id!==id; });

// ---------- tournament creation (shape only; players assigned afterward) ----------
function createTournament(opts){
  var id = "t_"+Date.now();
  var t = { id:id, name:opts.name, format:opts.format, createdAt:Date.now(), status:"assigning" };
  var eligible = eligiblePlayerIdsForNewEvent();
  t.eligiblePlayerIds = eligible.length ? eligible : state.players.map(function(p){ return p.id; });
  var sizes = distributeCount(opts.totalParticipants, opts.groupCount);
  if(opts.format==="blockPrelim"){
    t.blockCount = opts.groupCount;
    t.advancePerBlock = opts.advancePerBlock;
    t.advanceBonusApplied = {};
    t.blocks = sizes.map(function(size, bi){
      return { index:bi, targetSize:size, slots:new Array(size).fill(null) };
    });
    t.finals = null;
    t.blocks.forEach(function(b){ rebuildBlockFromSlots(t, b); });
  } else {
    t.prelimType = opts.prelimType;
    t.advancePerGroup = opts.advancePerGroup;
    t.advanceBonusApplied = {};
    t.groups = sizes.map(function(size, gi){
      var bracketSize=1; while(bracketSize<size) bracketSize*=2;
      return { index:gi, targetSize:size, slots:new Array(bracketSize).fill(null) };
    });
    t.finals = null;
    t.groups.forEach(function(g){ rebuildGroupFromSlots(t, g); });
  }
  state.tournaments.push(t);
  state.currentTournamentId = id;
  saveState();
  navigate({screen:"tournament", id:id});
}
function reverseAllTournamentEffects(t){
  if(t.finals){
    reverseFinalize(t);
    t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  }
  if(t.advanceBonusApplied){
    Object.keys(t.advanceBonusApplied).forEach(function(id){
      var p=getPlayer(id); if(p) p.points -= t.advanceBonusApplied[id];
    });
  }
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(b){
      (b.matches||[]).forEach(function(m){ if(m.winner) undoMatchDeltas(m); });
      if(b.penaltyDeltas){
        Object.keys(b.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= b.penaltyDeltas[id]; });
      }
    });
  } else {
    (t.groups||[]).forEach(function(g){
      if(g.wb){ g.wb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.lb){ g.lb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.penaltyDeltas){
        Object.keys(g.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= g.penaltyDeltas[id]; });
      }
    });
  }
}
function deleteTournament(id){
  var t = findTournament(id);
  if(!t) return;
  if(!confirm("この大会の記録を削除しますか?この操作は取り消せません。この大会で加減算されたポイントはすべて元に戻ります。")) return;
  reverseAllTournamentEffects(t);
  state.tournaments = state.tournaments.filter(function(x){ return x.id!==id; });
  saveState();
  navigate({screen:"history"});
}

// ---------- slot assignment ----------
function findSlotOwner(t, playerId){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  for(var gi=0; gi<groups.length; gi++){
    var si = groups[gi].slots.indexOf(playerId);
    if(si>=0) return {idx:gi, slotIdx:si};
  }
  return null;
}
function assignSlot(t, targetIdx, targetSlotIdx, newPlayerId){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  var arr = groups[targetIdx].slots;
  var newVal = newPlayerId || null;
  var touched = [targetIdx];
  if(newVal!==null){
    var owner = findSlotOwner(t, newVal);
    if(owner && !(owner.idx===targetIdx && owner.slotIdx===targetSlotIdx)){
      var ownerArr = groups[owner.idx].slots;
      ownerArr[owner.slotIdx] = arr[targetSlotIdx];
      touched.push(owner.idx);
    }
  }
  arr[targetSlotIdx] = newVal;
  return touched;
}
function confirmLineup(t){
  t.status = "prelim";
  saveState(); render();
}

// ---------- export / import ----------
function exportData(){
  var dataStr = JSON.stringify(state, null, 2);
  var filename = "billiards-tournament-" + dateStamp() + ".json";
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:filename, data:dataStr}).catch(function(err){
      if(err && err.code==="declined") return;
      alert("バックアップの保存に失敗しました: " + (err && err.message ? err.message : err));
    });
  } else {
    var blob = new Blob([dataStr], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
}
function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.players || !parsed.settings) throw new Error("形式が不正です");
      if(!confirm("読み込んだデータで現在のデータを上書きします。よろしいですか?")) return;
      state = parsed;
      state.entries = state.entries || {};
      state.currentTournamentId = state.currentTournamentId || null;
      saveState();
      navigate({screen:"roster"});
    }catch(e){ alert("読み込みに失敗しました: " + e.message); }
  };
  reader.readAsText(file);
}

function matrixTable(kind, title, desc){

  var rows = CLASSES.map(function(rc){

    '<h3>'+title+'</h3><p class="hint">'+desc+'</p>'+
    '<div class="table-wrap"><table class="matrix"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+

function matchRow(match, tprefix, extraActionData, matchNo, resolvable){
  var a = match.a, b = match.b;
  var resolved = !!match.winner;
  var actionData = extraActionData || "";
  if(resolvable===undefined) resolvable = true;
  function sideBtn(id, side){
    if(!id) return '<span class="hint">(不戦)</span>';
    var label = playerName(id)+" ("+classOf(pointsOf(id))+")";
    var isWinner = match.winner===id;
    var scoreHTML = "";
    if(match.a && match.b){
      var score = match.score || {a:null,b:null};
      var val = score[side];
      scoreHTML = '<input type="number" class="num score-input-inline" min="0" data-action="update-score" data-scope="block" data-which="'+side+'" data-mid="'+match.id+'" '+actionData+' value="'+(val==null?"":val)+'" placeholder="-">';
    }
    var clickable = !resolved && resolvable;
    return '<button class="btn btn-sm'+(isWinner?' btn-felt':'')+'" '+
      (clickable?'':'disabled')+' data-action="resolve-match" data-scope="'+tprefix+'" data-mid="'+match.id+'" data-winner="'+id+'" '+actionData+'>'+
      esc(label)+(isWinner?' 🏆':'')+'</button>'+scoreHTML;
  }
  var undo = resolved ? '<button class="btn btn-sm btn-ghost" data-action="undo-match" data-scope="'+tprefix+'" data-mid="'+match.id+'" '+actionData+'>取消</button>' : '';
  var matchNoHTML = matchNo ? '<span class="match-no">No.'+matchNo+'</span>' : "";
  return '<div class="match-row">'+
    matchNoHTML+
    '<div class="match-side">'+sideBtn(a,"a")+'</div>'+
    '<div class="match-vs">vs</div>'+
    '<div class="match-side">'+sideBtn(b,"b")+'</div>'+
    '<div class="match-result">'+undo+'</div>'+
  '</div>';
}

function renderTournamentScreen(id){
  var t = findTournament(id);
  if(!t) return '<p class="empty-note">大会が見つかりません。</p>';
  if(t.format==="blockPrelim") return renderBlockPrelimTournament(t);
  return renderElimPrelimTournament(t);
}

// ---------- connected bracket visual ----------
function bflowSideHTML(m, playerId, opts){
  if(!playerId) return '<div class="bflow-side bye">(不戦)</div>';
  var isWinner = m.winner===playerId;
  var resolved = !!m.winner;
  var cls = "bflow-side"+(isWinner?" winner":"");
  if(m.bye){
    return '<div class="'+cls+' bye">'+esc(playerName(playerId))+' '+badge(classOf(pointsOf(playerId)))+'<span class="pts num">不戦勝</span></div>';
  }
  var canClick = !resolved && opts.resolvable;
  var attrs = canClick ? ('data-action="'+opts.actionName+'" data-mid="'+m.id+'" data-winner="'+playerId+'" '+opts.extraAttrs) : "";
  if(!canClick) cls += resolved ? "" : " locked";
  var scoreHTML = "";
  if(m.a && m.b){
    var score = m.score || {a:null,b:null};
    var which = (playerId===m.a) ? "a" : "b";
    var val = score[which];
    scoreHTML = '<input type="number" class="num score-input-inline" min="0" data-action="update-score" data-scope="'+opts.scoreScope+'" data-which="'+which+'" data-mid="'+m.id+'" '+opts.extraAttrs+' value="'+(val==null?"":val)+'" placeholder="-">';
  }
  return '<div class="'+cls+'" '+attrs+'><span class="pname">'+esc(playerName(playerId))+' '+badge(classOf(pointsOf(playerId)))+'</span>'+scoreHTML+'<span class="pts num">'+pointsOf(playerId)+'</span></div>';
}
function renderBracketFlow(rounds, roundLabelFn, opts){
  var counter = 0;
  var html = rounds.map(function(roundMatches, ri){
    var n = roundMatches.length;
    var isLast = ri===rounds.length-1;
    var connectors = "";
    if(!isLast){
      for(var p=0; p*2+1<n; p++){
        var topA = ((p*2)+0.5)/n*100, topB = ((p*2+1)+0.5)/n*100;
        connectors += '<div class="bflow-connector" style="top:'+topA.toFixed(3)+'%;height:'+(topB-topA).toFixed(3)+'%;"></div>';
      }
    }
    var matches = roundMatches.map(function(m){
      counter++;
      var undo = (m.winner && !m.bye) ?
        '<button class="btn btn-sm btn-ghost" data-action="'+opts.undoActionName+'" data-mid="'+m.id+'" '+opts.extraAttrs+'>取消</button>' : "";
      var noHTML = m.bye ? "" : '<span class="match-no">No.'+counter+'</span>';
      return '<div class="bflow-match">'+bflowSideHTML(m, m.a, opts)+bflowSideHTML(m, m.b, opts)+'<div class="bflow-match-footer">'+noHTML+undo+'</div></div>';
    }).join("");
    return '<div class="bflow-round"><div class="bflow-round-label">'+roundLabelFn(ri, rounds.length)+'</div>'+
      '<div class="bflow-slots">'+connectors+matches+'</div></div>';
  }).join("");
  return '<div class="bflow-wrap"><div class="bflow">'+html+'</div></div>';
}

}
function renderSimpleRounds(rounds, roundLabelFn, opts){
  if(!rounds.length) return '<p class="empty-note">敗者復活ブロックの組み合わせはまだありません。</p>';
  var counter = 0;
  var html = rounds.map(function(roundMatches, ri){
    var matches = roundMatches.map(function(m){
      counter++;
      var undo = (m.winner && !m.bye) ?
        '<button class="btn btn-sm btn-ghost" data-action="'+opts.undoActionName+'" data-mid="'+m.id+'" '+opts.extraAttrs+'>取消</button>' : "";
      var noHTML = m.bye ? "" : '<span class="match-no">No.'+counter+'</span>';
      return '<div class="simple-match">'+simpleSideHTML(m, m.a, opts)+simpleSideHTML(m, m.b, opts)+'<div class="bflow-match-footer">'+noHTML+undo+'</div></div>';
    }).join("");
    return '<div class="simple-round"><div class="simple-round-label">敗者復活 '+(ri+1)+'回戦</div>'+matches+'</div>';
  }).join("");
  return '<div class="simple-bracket">'+html+'</div>';
}

function renderOneBlock(t, block){
  var standings = block.playerIds.slice().sort(function(a,b){
    var wa = block.matches.filter(function(m){return m.winner===a;}).length;
    var wb = block.matches.filter(function(m){return m.winner===b;}).length;
    if(wb!==wa) return wb-wa;
    return pointsOf(b)-pointsOf(a);
  });
  var rows = standings.map(function(id){
    var w = block.matches.filter(function(m){return m.winner===id;}).length;
    var elim = block.eliminated && block.eliminated[id];
    return '<tr><td>'+esc(playerName(id))+'</td><td>'+badge(classOf(pointsOf(id)))+'</td>'+
      '<td class="num">'+pointsOf(id)+'</td><td class="num">'+w+'勝'+(block.losses?(block.losses[id]||0):0)+'敗</td>'+
      '<td>'+(elim?'<span class="pill" style="color:var(--loss);border-color:var(--loss)">予選敗退</span>':'')+'</td></tr>';
  }).join("");
  var matches = block.matches.map(function(m,mi){ return matchRow(m, "prelim", 'data-tid="'+t.id+'" data-block="'+block.index+'"', mi+1, t.status==="prelim"); }).join("");
  return '<div class="card"><h3>ブロック '+(block.index+1)+'</h3>'+
    renderGroupControls(t, "block", block.index, block.targetSize, "各ブロックの決勝進出人数", t.advancePerBlock, "update-advance-per-block")+
    renderEditSlots(t, "block", block.index, block.slots, false)+
    '<div class="table-wrap"><table class="data"><thead><tr><th>氏名</th><th>クラス</th><th>ポイント</th><th>戦績</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="margin-top:.6rem">'+matches+'</div></div>';
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  if(action==="nav"){
    var screen = t.getAttribute("data-screen");
    var r = {screen:screen};
    if(t.getAttribute("data-id")) r.id = t.getAttribute("data-id");
    navigate(r);
  }
  else if(action==="settings-tab"){ route = {screen:"settings", tab:t.getAttribute("data-tab")}; render(); }
  else if(action==="roster-sort"){ route.rosterSort = t.getAttribute("data-sort"); render(); }
  else if(action==="delete-player"){ deletePlayer(t.getAttribute("data-id")); }
  else if(action==="reset-entries"){
    if(confirm("エントリー状況をリセットしますか?")){ state.entries={}; saveState(); render(); }
  }
  else if(action==="reset-bounds"){
    if(confirm("クラス区分をデフォルトに戻しますか?")){ state.settings.classBounds = DEFAULT_CLASS_BOUNDS.map(function(b){return{code:b.code,min:b.min};}); saveState(); render(); }
  }
  else if(action==="reset-matrix"){
    var kind = t.getAttribute("data-matrix");
    if(confirm("この表をデフォルトに戻しますか?")){
      state.settings[kind] = JSON.parse(JSON.stringify(kind==="winMatrix" ? WIN_MATRIX_DEFAULT : LOSE_MATRIX_DEFAULT));
      saveState(); render();
    }
  }
  else if(action==="reset-bonus"){
    if(confirm("ボーナス設定をデフォルトに戻しますか?")){ state.settings.bonuses = JSON.parse(JSON.stringify(BONUS_DEFAULT)); saveState(); render(); }
  }
  else if(action==="export-data"){ exportData(); }
  else if(action==="delete-tournament"){ deleteTournament(t.getAttribute("data-id")); }
  else if(action==="topFormat-radio"){
    var ntf = ensureNewTournamentState(); ntf.format = t.value; render();
  }
  else if(action==="prelimType-radio"){
    var ntp = ensureNewTournamentState(); ntp.prelimType = t.value; render();
  }
  else if(action==="confirm-lineup"){
    var tidc=t.getAttribute("data-tid"); var tourc=findTournament(tidc);
    if(tourc) confirmLineup(tourc);
  }
  else if(action==="finalize-block-prelim"){
    var tid = t.getAttribute("data-tid"); var tour = findTournament(tid);
    if(tour){ finalizeBlockPrelim(tour); saveState(); render(); }
  }
  else if(action==="finalize-elim-prelim"){
    var tid0 = t.getAttribute("data-tid"); var tour0 = findTournament(tid0);
    if(tour0){ finalizeElimPrelim(tour0); saveState(); render(); }
  }
  else if(action==="resolve-match"){
    var tid2 = t.getAttribute("data-tid"); var tour2 = findTournament(tid2);
    if(!tour2) return;
    if(tour2.status!=="prelim") return;
    var mid = t.getAttribute("data-mid"); var winner = t.getAttribute("data-winner");
    var bidx = Number(t.getAttribute("data-block"));
    var block = tour2.blocks[bidx];
    var m2 = block.matches.find(function(x){return x.id===mid;});
    if(m2 && !m2.winner){ resolveMatch(m2, winner); recomputeBlockElimination(block); }
    saveState(); render();
  }
  else if(action==="undo-match"){
    var tid3 = t.getAttribute("data-tid"); var tour3 = findTournament(tid3);
    if(!tour3) return;
    if(!confirm("この結果を取り消しますか?後続の組み合わせ結果や決勝トーナメントの結果も一緒に取り消される場合があります。")) return;
    var mid2 = t.getAttribute("data-mid");
    var bidx2 = Number(t.getAttribute("data-block"));
    var block2 = tour3.blocks[bidx2];
    correctBlockMatch(tour3, block2, mid2);
    saveState(); render();
  }
  else if(action==="resolve-elim-match"){
    var tid6=t.getAttribute("data-tid"); var tour6=findTournament(tid6);
    if(!tour6) return;
    if(tour6.status!=="prelim") return;
    var gi=Number(t.getAttribute("data-group"));
    var g = tour6.groups[gi];
    if(g.aliveCount <= tour6.advancePerGroup) return;
    var side=t.getAttribute("data-side"); var mid5=t.getAttribute("data-mid"); var winner3=t.getAttribute("data-winner");
    var match5 = findElimMatch(g, side, mid5);
    if(match5 && !match5.winner && !match5.bye){
      resolveMatch(match5, winner3);
      advanceElimGroup(tour6, g);
      recomputeElimGroup(tour6, g);
      saveState(); render();
    }
  }
  else if(action==="undo-elim-match"){
    var tid7=t.getAttribute("data-tid"); var tour7=findTournament(tid7);
    if(!tour7) return;
    if(!confirm("この結果を取り消しますか?後続の組み合わせ結果や決勝トーナメントの結果も一緒に取り消される場合があります。")) return;
    var gi2=Number(t.getAttribute("data-group"));
    var g2 = tour7.groups[gi2];
    var side2=t.getAttribute("data-side"); var mid6=t.getAttribute("data-mid");
    correctElimMatch(tour7, g2, side2, mid6);
    saveState(); render();
  }
  else if(action==="resolve-bracket"){
    var tid4=t.getAttribute("data-tid"); var tour4=findTournament(tid4);
    if(!tour4) return;
    var mid3=t.getAttribute("data-mid"); var winner2=t.getAttribute("data-winner");
    var match=null;
    tour4.finals.rounds.forEach(function(r){ r.forEach(function(mm){ if(mm.id===mid3) match=mm; }); });
    if(match && !match.winner && !match.bye){
      resolveMatch(match, winner2);
      var loserId = winner2===match.a ? match.b : match.a;
      tour4.finals.eliminatedRound[loserId] = match.round;
      maybeAdvanceRounds(tour4.finals);
      if(match.round===tour4.finals.totalRounds) finalizeTournamentResult(tour4);
      saveState(); render();
    }
  }
  else if(action==="undo-bracket"){
    var tid5=t.getAttribute("data-tid"); var tour5=findTournament(tid5);
    if(!tour5) return;
    var mid4=t.getAttribute("data-mid");
    if(mid4==="final-reopen"){
      if(confirm("大会結果(優勝・準優勝・ボーナス)を取り消してやり直しますか?")){
        reverseFinalize(tour5); tour5.status="finals"; saveState(); render();
      }
      return;
    }
    if(!confirm("この結果を取り消しますか?後続の対戦結果も一緒に取り消されます。")) return;
    correctBracketMatch(tour5, mid4);
    saveState(); render();
  }
}, false);

document.addEventListener("change", function(e){
  var t = e.target;
  var action = t.getAttribute && t.getAttribute("data-action");
  if(!action) return;
  if(action==="update-points"){ updatePlayerPoints(t.getAttribute("data-id"), t.value); }
  else if(action==="toggle-entry"){
    var id=t.getAttribute("data-id");
    state.entries[id] = state.entries[id] || {entered:false, feePaid:false};
    state.entries[id].entered = t.checked;
    if(!t.checked) state.entries[id].feePaid = false;
    saveState(); render();
  }
  else if(action==="toggle-fee"){
    var id2=t.getAttribute("data-id");
    state.entries[id2] = state.entries[id2] || {entered:false, feePaid:false};
    state.entries[id2].feePaid = t.checked;
    saveState(); render();
  }
  else if(action==="update-bound"){
    var idx = Number(t.getAttribute("data-idx"));
    var v = Math.round(Number(t.value));
    if(isFinite(v)){ state.settings.classBounds[idx].min = v; saveState(); render(); }
  }
  else if(action==="update-matrix"){
    var kind=t.getAttribute("data-matrix"), row=t.getAttribute("data-row"), col=t.getAttribute("data-col");
    var v2 = Math.round(Number(t.value));
    if(isFinite(v2)){ state.settings[kind][row][col]=v2; saveState(); render(); }
  }
  else if(action==="update-bonus"){
    var key=t.getAttribute("data-key");
    var v3 = Math.round(Number(t.value));
    if(isFinite(v3)){ state.settings.bonuses[key]=v3; saveState(); render(); }
  }
  else if(action==="update-prev-champion"){
    state.previousChampionId = t.value || null; saveState(); render();
  }
  else if(action==="import-file"){
    if(t.files && t.files[0]) importDataFromFile(t.files[0]);
  }
  else if(action==="groupCount-input"){
    var ntg = ensureNewTournamentState();
    ntg.groupCount = Math.max(1, Math.round(Number(t.value))||1); render();
  }
  else if(action==="advancePerGroup-input"){
    var ntag = ensureNewTournamentState();
    ntag.advancePerGroup = Math.max(1, Math.round(Number(t.value))||1); render();
  }
  else if(action==="blockCount-input"){
    var ntb = ensureNewTournamentState();
    ntb.blockCount = Math.max(1, Math.round(Number(t.value))||1); render();
  }
  else if(action==="advancePerBlock-input"){
    var ntap = ensureNewTournamentState();
    ntap.advancePerBlock = Math.max(1, Math.round(Number(t.value))||1); render();
  }
  else if(action==="totalParticipants-input"){
    var nttp = ensureNewTournamentState();
    nttp.totalParticipants = Math.max(2, Math.round(Number(t.value))||2); render();
  }
  else if(action==="assign-slot"){
    var tida=t.getAttribute("data-tid"); var toura=findTournament(tida);
    if(!toura) return;
    var idx=Number(t.getAttribute("data-idx"));
    var slotIdx=Number(t.getAttribute("data-slot"));
    var needsWarning = groupOrBlockHasProgress(toura, idx) || !!toura.finals;
    if(needsWarning && !confirm("この枠の選手を変更すると、既に入力されている対戦結果(場合によっては決勝トーナメントの結果も)が取り消されます。よろしいですか?")){
      render();
      return;
    }
    var touched = assignSlot(toura, idx, slotIdx, t.value);
    unwindFinalsIfNeeded(toura);
    var groups = toura.format==="blockPrelim" ? toura.blocks : toura.groups;
    touched.forEach(function(gi){
      if(toura.format==="blockPrelim") rebuildBlockFromSlots(toura, groups[gi]);
      else rebuildGroupFromSlots(toura, groups[gi]);
    });
    saveState(); render();
  }
  else if(action==="resize-group"){
    var tidR=t.getAttribute("data-tid"); var tourR=findTournament(tidR);
    if(!tourR) return;
    var idxR=Number(t.getAttribute("data-idx"));
    var newSize=Math.max(1, Math.round(Number(t.value))||1);
    var hasProgR = groupOrBlockHasProgress(tourR, idxR) || !!tourR.finals;
    if(hasProgR && !confirm("人数を変更すると、既に入力されている対戦結果(場合によっては決勝トーナメントの結果も)が取り消されます。よろしいですか?")){
      render();
      return;
    }
    if(tourR.finals) unwindFinalsIfNeeded(tourR);
    resizeGroupOrBlockSlots(tourR, idxR, newSize);
    var groupsR = tourR.format==="blockPrelim" ? tourR.blocks : tourR.groups;
    if(tourR.format==="blockPrelim") rebuildBlockFromSlots(tourR, groupsR[idxR]);
    else rebuildGroupFromSlots(tourR, groupsR[idxR]);
    saveState(); render();
  }
  else if(action==="update-advance-per-group"){
    var tidAG=t.getAttribute("data-tid"); var tourAG=findTournament(tidAG);
    if(!tourAG) return;
    var vAG=Math.max(1, Math.round(Number(t.value))||1);
    if(tourAG.finals && vAG!==tourAG.advancePerGroup){
      if(!confirm("決勝進出人数を変更すると、既に確定している決勝トーナメントの結果が取り消されます。よろしいですか?")){ render(); return; }
      unwindFinalsIfNeeded(tourAG);
    }
    tourAG.advancePerGroup = vAG;
    saveState(); render();
  }
  else if(action==="update-advance-per-block"){
    var tidAB=t.getAttribute("data-tid"); var tourAB=findTournament(tidAB);
    if(!tourAB) return;
    var vAB=Math.max(1, Math.round(Number(t.value))||1);
    if(tourAB.finals && vAB!==tourAB.advancePerBlock){
      if(!confirm("決勝進出人数を変更すると、既に確定している決勝トーナメントの結果が取り消されます。よろしいですか?")){ render(); return; }
      unwindFinalsIfNeeded(tourAB);
    }
    tourAB.advancePerBlock = vAB;
    saveState(); render();
  }
  else if(action==="update-score"){
    var tids=t.getAttribute("data-tid"); var tours=findTournament(tids);
    if(!tours) return;
    var scope=t.getAttribute("data-scope");
    var which=t.getAttribute("data-which");
    var raw=t.value;
    var val = raw==="" ? null : Math.max(0, Math.round(Number(raw)));
    if(raw!=="" && !isFinite(val)) return;
    var match=null;
    if(scope==="block"){
      var bidx3=Number(t.getAttribute("data-block"));
      match = tours.blocks[bidx3].matches.find(function(m){ return m.id===t.getAttribute("data-mid"); });
    } else if(scope==="elim"){
      var gi3=Number(t.getAttribute("data-group"));
      var side3=t.getAttribute("data-side");
      match = findElimMatch(tours.groups[gi3], side3, t.getAttribute("data-mid"));
    } else if(scope==="bracket"){
      tours.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.id===t.getAttribute("data-mid")) match=m; }); });
    }
    if(match){ match.score = match.score || {a:null,b:null}; match.score[which]=val; saveState(); render(); }
  }
}, false);

document.addEventListener("submit", function(e){
  var form = e.target;
  if(form.getAttribute("data-form")==="add-player"){
    e.preventDefault();
    var fd = new FormData(form);
    addPlayer(fd.get("name"), fd.get("points"));
    form.reset();
  }
  else if(form.getAttribute("data-form")==="create-tournament"){
    e.preventDefault();
    var nt = ensureNewTournamentState();
    var fd2 = new FormData(form);
    var name = (fd2.get("name")||"").trim();
    if(!name){ alert("大会名を入力してください。"); return; }
    if(nt.totalParticipants < 2){ alert("参加人数は2名以上にしてください。"); return; }
    if(nt.format==="elimPrelim"){
      if(nt.totalParticipants < nt.groupCount){ alert("参加人数がグループ数より少なくなっています。"); return; }
      if(Math.floor(nt.totalParticipants/nt.groupCount) < nt.advancePerGroup){ alert("各グループからの決勝進出人数が、1グループあたりの人数より多くなっています。"); return; }
      createTournament({name:name, format:"elimPrelim", prelimType:nt.prelimType, groupCount:nt.groupCount, advancePerGroup:nt.advancePerGroup, totalParticipants:nt.totalParticipants});
    } else {
      if(nt.totalParticipants < nt.blockCount*2){ alert("参加人数がブロック数に対して少なすぎます。"); return; }
      if(Math.floor(nt.totalParticipants/nt.blockCount) < nt.advancePerBlock){ alert("各ブロックからの決勝進出人数が、1ブロックあたりの人数より多くなっています。"); return; }
      createTournament({name:name, format:"blockPrelim", groupCount:nt.blockCount, advancePerBlock:nt.advancePerBlock, totalParticipants:nt.totalParticipants});
    }
  }
}, false);

// ============ INIT ============
state = loadState();
saveState();
render();

})();
</script>
