@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C0B09; --surface:#17150F; --surface-2:#221F16; --text:#F7F2E3; --muted:#C2B697;
    --border:#5A4F36; --accent:#E8B84A; --accent-ink:#FBE9B8; --on-accent:#1A1204; --felt:#4BAA82; --felt-ink:#D4F2E4;
    --rust:#E39A7C; --rust-ink:#FCE4D9; --win:#5BC389; --loss:#F07A72; --start:#6C9AFF;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B09; --surface:#17150F; --surface-2:#221F16; --text:#F7F2E3; --muted:#C2B697;
  --border:#5A4F36; --accent:#E8B84A; --accent-ink:#FBE9B8; --on-accent:#1A1204; --felt:#4BAA82; --felt-ink:#D4F2E4;
  --rust:#E39A7C; --rust-ink:#FCE4D9; --win:#5BC389; --loss:#F07A72; --start:#6C9AFF;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#F3F0E7; --surface:#FFFFFF; --surface-2:#E8E2D2; --text:#14110B; --muted:#4A4332;
  --border:#B9AE92; --accent:#C99A2E; --accent-ink:#4A3708; --on-accent:#1A1204; --felt:#17573D; --felt-ink:#0F3A29;
  --rust:#9B4A2C; --rust-ink:#5E2A15; --win:#1B7140; --loss:#B3261E; --start:#1D4ED8;
  --shadow: 0 1px 2px rgba(20,17,11,.10), 0 4px 14px rgba(20,17,11,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image: linear-gradient(color-mix(in srgb, var(--bg) 93%, transparent), color-mix(in srgb, var(--bg) 93%, transparent)), var(--art-url);
  background-size: cover; background-position: center top; background-attachment: fixed; background-repeat: no-repeat;
  color:var(--text); font-family:var(--font-body);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0 0 .3em;}
h1{font-size:1.5rem;} h2{font-size:1.2rem;} h3{font-size:1.02rem;}
a{color:inherit;}
button{font-family:inherit;}
.num{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
.app-shell{display:flex; min-height:100vh;}
.sidenav{
  width:216px; flex:0 0 216px; background:var(--side-bg); border-right:1px solid var(--side-line); color:var(--side-text);
  padding:1.1rem .9rem; display:flex; flex-direction:column; gap:1.4rem;
  /* 画面をスクロールしても、左側のメニューが一緒に表示され続ける */
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; z-index:30;
}
.brand{display:flex; flex-direction:column; gap:.4rem; padding:0 .35rem; align-items:center; text-align:center;}
.brand-logo{width:100%; max-width:176px; aspect-ratio:1/1; border-radius:14px; background-image:var(--logo-url); background-size:cover; background-position:center; background-repeat:no-repeat; box-shadow:0 0 0 1px rgba(232,196,106,.35), 0 6px 18px rgba(0,0,0,.5);}
.brand .eyebrow{font-size:.68rem; letter-spacing:.08em; color:var(--side-muted); text-transform:uppercase;}
.brand .title{font-family:var(--font-display); font-size:.98rem; font-weight:700; line-height:1.3; color:var(--side-gold); text-wrap:balance;}
.navgroup{display:flex; flex-direction:column; gap:.15rem;}
.navlink{
  display:flex; align-items:center; gap:.55rem; padding:.55rem .65rem; border-radius:8px;
  color:var(--side-text); text-decoration:none; cursor:pointer; font-size:.92rem; border:1px solid transparent;
  background:none; text-align:left; width:100%;
}
.navlink:hover{background:var(--side-hover); color:#fff;}
.navlink.active{background:var(--side-hover); color:var(--side-gold); border-color:rgba(232,196,106,.45); font-weight:700;}
.navlink .ico{width:1.1em; text-align:center; opacity:.9;}
.nav-spacer{flex:1;}
.nav-foot{font-size:.72rem; color:var(--side-muted); padding:0 .35rem;}
.nav-foot.sync-ok{color:#6FD39A;}
.nav-foot.sync-error, .nav-foot.sync-offline{color:#FF8F86;}
.main{flex:1; min-width:0; padding:1.6rem 2rem 4rem;}
.main-inner{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
/* 大会開始後は、大会画面上部のタイトルとボタンをスクロールに追従させる */
body.t-head-sticky .t-head{position:sticky; top:0; z-index:35; background:var(--bg); padding:.5rem 0; margin-top:-.5rem; border-bottom:1px solid var(--border);}
.page-head p.sub{color:var(--muted); margin:.15rem 0 0; font-size:.88rem;}
.tournament-name-input{font:inherit; font-size:1.5rem; font-weight:700; color:var(--text); border:1px solid transparent; background:transparent; padding:.1rem .3rem; margin:0 0 0 -.3rem; border-radius:6px; max-width:100%; width:22rem;}
.tournament-name-input:hover{border-color:var(--border);}
.tournament-name-input:focus{border-color:var(--border); background:var(--surface); outline:none;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:1.1rem 1.2rem; box-shadow:var(--shadow);
}
.card > h2, .card > h3{margin-bottom:.8rem;}
.stat-row{display:flex; gap:.7rem; flex-wrap:wrap;}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:.7rem 1rem; flex:1; min-width:130px; box-shadow:var(--shadow);
}
.stat .label{font-size:.72rem; color:var(--muted); letter-spacing:.03em;}
.stat .value{font-size:1.4rem; font-weight:700; margin-top:.15rem;}
.tabs{display:flex; gap:.3rem; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab{
  padding:.5rem .85rem; border:none; background:none; color:var(--muted); cursor:pointer;
  font-size:.88rem; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab.active{color:var(--text); border-bottom-color:var(--accent); font-weight:600;}
.btn{
  display:inline-flex; align-items:center; gap:.4rem; padding:.5rem .9rem; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
  font-size:.86rem; font-weight:600; white-space:nowrap;
}
.btn:hover{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); border-color:color-mix(in srgb, var(--accent) 70%, #000); color:var(--on-accent);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-felt{background:var(--felt); border-color:var(--felt); color:#fff;}
.btn-start-ready{background:var(--start); border-color:var(--start); color:#fff;}
.btn-live{background:var(--loss); border-color:var(--loss); color:#fff;}
.btn-ghost{background:none; border-color:transparent;}
.btn-danger{color:var(--loss); border-color:var(--loss);}
.btn-sm{padding:.3rem .55rem; font-size:.78rem;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.field{display:flex; flex-direction:column; gap:.3rem;}
.field label{font-size:.78rem; color:var(--muted);}
.field input[type=text], .field input[type=number], .field select{
  padding:.5rem .6rem; border:1px solid var(--border); border-radius:8px; background:var(--bg);
  color:var(--text); font-size:.92rem; font-family:inherit;
}
.field input[type=number]{font-family:var(--font-num);}
.form-row{display:flex; gap:.8rem; flex-wrap:wrap; align-items:end;}
.radio-card-row{display:flex; gap:.7rem; flex-wrap:wrap;}
.radio-card{
  flex:1; min-width:240px; border:1px solid var(--border); border-radius:var(--radius); padding:.75rem .9rem;
  cursor:pointer; display:flex; gap:.6rem; align-items:flex-start; background:var(--surface);
}
.radio-card:hover{border-color:var(--accent);}
.radio-card input{margin-top:.2rem;}
.radio-card .rc-title{font-weight:700; font-size:.92rem;}
.radio-card .rc-desc{font-size:.78rem; color:var(--muted); margin-top:.15rem;}
.radio-card.checked{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--surface));}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
table.data{border-collapse:collapse; width:100%; font-size:.88rem;}
table.data th, table.data td{padding:.5rem .65rem; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
table.data thead th{background:var(--surface-2); position:sticky; top:0; font-size:.74rem; color:var(--muted); letter-spacing:.02em;}
table.data input[type=text], table.data input[type=number], table.data select{background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.25rem .4rem; font:inherit;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:var(--surface-2);}
table.matrix{border-collapse:collapse; font-size:.78rem;}
table.matrix th, table.matrix td{border:1px solid var(--border); padding:0; text-align:center;}
table.matrix thead th{background:var(--surface-2); padding:.35rem .4rem; font-size:.72rem; color:var(--muted);}
table.matrix tbody th{background:var(--surface-2); padding:.35rem .5rem; font-size:.75rem; color:var(--text); text-align:left;}
table.matrix input{
  width:2.6rem; text-align:center; border:none; background:none; padding:.4rem .1rem; font-family:var(--font-num);
  color:var(--text);
}
table.matrix input:focus{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface);}
table.matrix td.pos input{color:var(--win);}
table.matrix td.neg input{color:var(--loss);}
.badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:2.6em; padding:.15rem .5rem;
  border-radius:999px; font-size:.74rem; font-weight:700; font-family:var(--font-num); letter-spacing:.02em;
}
.badge.tier-A{background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent-ink);}
.badge.tier-B{background:color-mix(in srgb, var(--felt) 22%, transparent); color:var(--felt-ink);}
.badge.tier-C{background:color-mix(in srgb, var(--rust) 22%, transparent); color:var(--rust-ink);}
.pill{display:inline-flex; align-items:center; gap:.35rem; padding:.2rem .6rem; border-radius:999px; font-size:.74rem; font-weight:600; border:1px solid var(--border);}
.pill.setup{color:var(--muted);}
.pill.assigning{color:var(--rust-ink); border-color:var(--rust); background:color-mix(in srgb, var(--rust) 14%, transparent);}
.pill.prelim{color:var(--accent-ink); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent);}
.pill.finals{color:var(--felt-ink); border-color:var(--felt); background:color-mix(in srgb, var(--felt) 16%, transparent);}
.pill.completed{color:var(--muted); background:var(--surface-2);}
.delta-plus{color:var(--win); font-weight:700;}
.delta-minus{color:var(--loss); font-weight:700;}
.match-delta{margin-left:.35rem; font-size:.9em;}
.checklist{display:flex; flex-direction:column; gap:0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.check-row{display:flex; align-items:center; gap:.6rem; padding:.5rem .7rem; border-bottom:1px solid var(--border); font-size:.88rem;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:var(--surface-2);}
.check-row .name{flex:1;}
.match-row{display:flex; align-items:center; gap:.6rem; padding:.55rem .3rem; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.match-row:last-child{border-bottom:none;}
.match-side{display:flex; align-items:center; gap:.3rem; flex:1; min-width:170px;}
.match-vs{color:var(--muted); font-size:.78rem;}
.match-result{font-size:.78rem; color:var(--muted); margin-left:auto;}
.empty-note{color:var(--muted); font-size:.86rem; padding:.6rem 0;}
.result-banner{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.1rem;}
.result-banner h3{margin-bottom:.5rem;}
.bonus-log{display:flex; flex-direction:column; gap:.25rem; font-size:.85rem;}
.bonus-log .row{display:flex; justify-content:space-between; gap:1rem;}
.tourn-card{border:1px solid var(--border); border-radius:var(--radius); padding:.9rem 1rem; background:var(--surface); box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;}
.hint{font-size:.78rem; color:var(--muted);}
::placeholder{color:var(--muted); opacity:.7;}
.divider{height:1px; background:var(--border); border:none; margin:.2rem 0;}
input[type=checkbox], input[type=radio]{accent-color:var(--accent); width:16px; height:16px;}
select{padding:.45rem .55rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
details > summary{list-style:none;}
details > summary::-webkit-details-marker{display:none;}
details > summary:before{content:"▸ "; color:var(--muted);}
details[open] > summary:before{content:"▾ ";}

/* ---- connected bracket visual (finals / winners-side elimination) ---- */
.bflow-wrap{overflow-x:auto; padding:.3rem .1rem 1rem;}
.bflow{display:flex; align-items:stretch;}
.bflow-round{display:flex; flex-direction:column; width:380px; flex:none; margin-right:34px;}
.bflow-round:last-child{margin-right:0;}
.bflow-round-label{flex:none; font-size:.82rem; color:var(--muted); text-align:center; letter-spacing:.03em; margin-bottom:.5rem;}
.bflow-slots{flex:1; display:flex; flex-direction:column; justify-content:space-around; position:relative; min-height:220px;}
.bflow-match{
  flex:none; min-height:92px; margin:5px 0; border:1px solid var(--border); border-radius:8px; background:var(--surface);
  box-shadow:var(--shadow); display:flex; flex-direction:column; position:relative; z-index:1;
}
.bflow-match.preview{border-style:dashed; opacity:.75;}
.bflow-slot-edit{border-top:1px solid var(--border); background:var(--surface-2);}
.bflow-slot-edit summary{cursor:pointer; font-size:.68rem; color:var(--muted); padding:.2rem .35rem; list-style:none; user-select:none;}
.bflow-slot-edit summary::-webkit-details-marker{display:none;}
.bflow-slot-edit summary:hover{color:var(--text);}
.bflow-slot-edit-body{display:flex; flex-direction:column; gap:2px; padding:0 .35rem .3rem;}
/* Excel(表)と同じ見た目のトーナメント表 */
.tsh-scroll{overflow:auto; max-width:100%; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:.2rem; -webkit-overflow-scrolling:touch;}
.tsh{position:relative; font-size:12px; color:var(--text);}
body{cursor:grab;}
body.dragging, body.dragging *{cursor:grabbing !important; user-select:none !important;}
.tsh-ln{position:absolute; background:var(--text); display:block;}
.tsh-box{position:absolute; box-sizing:border-box; border:1.5px solid var(--text); background:var(--surface); display:flex; align-items:center; overflow:hidden; white-space:nowrap; line-height:1.1; padding:0 5px; font-size:12px;}
.tsh-txt{display:flex; flex-direction:column; justify-content:center; flex:1; min-width:0; overflow:hidden; line-height:1.2;}
.tsh-txt .tsh-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none; font-size:var(--nfs,12px);}
.tsh-score{flex:none; min-width:18px; margin-left:3px; padding:0 4px; border-radius:9px; background:var(--surface-2,#efebdf); color:var(--text); font-size:var(--scfs,12px); font-weight:700; line-height:1.25; text-align:center; font-family:var(--font-num);}
.tsh-score.walk{font-size:9px; font-weight:400; color:var(--muted);}
.walkover-tag{font-size:.72rem; color:var(--muted); margin:0 .2rem; white-space:nowrap;}
.tsh-score.win{background:color-mix(in srgb, var(--win,#2e7d4f) 30%, var(--surface)); color:var(--text);}
.tsh-slot .tsh-score{margin-right:18px;}
.tsh-slot[data-numat="right"] .tsh-score{margin-right:0;}
.tsh-v .tsh-score{writing-mode:horizontal-tb; margin:2px 0 0; min-width:0; align-self:center;}
.tsh-v.tsh-slot .tsh-score{margin-right:0; margin-bottom:18px;}
.tsh-sub{display:flex; align-items:center; gap:3px; overflow:hidden; white-space:nowrap; font-size:10px; color:var(--muted); font-weight:400;}
.tsh-sub .tsh-aff{overflow:hidden; text-overflow:ellipsis; min-width:0;}
.tsh-sub .badge{flex:none; display:inline-block; font-size:9px !important; padding:0 4px !important; line-height:12px !important; height:12px; min-width:0; border-radius:6px; margin:0;}
.tsh-box .tsh-name{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;}
.tsh-txt .tsh-name{flex:none;}
.tsh-box .tsh-lbl{color:var(--muted); font-size:var(--lfs,10px); flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis;}
.tsh-compact .tsh-sub{display:none;}
.tsh-compact .tsh-txt .tsh-name{line-height:1.15;}
.tsh-slot{padding:0;}
.tsh-slot .tsh-txt{padding:0 20px 0 5px;}
.tsh-slot[data-numat="right"] .tsh-txt{padding:0 5px 0 20px;}
.tsh-slot[data-numat="right"] .tsh-edit{right:auto; left:1px;}
.tsh-v.tsh-slot .tsh-txt{padding:0;}
.tsh-v.tsh-slot .tsh-edit{top:auto; bottom:1px;}
.tsh-sno{flex:none; width:26px; height:100%; display:flex; align-items:center; justify-content:center; font-size:var(--snofs,11px); overflow:hidden; background:var(--surface-2,#efebdf); color:var(--muted);}
.tsh-slot[data-numat="left"] .tsh-sno{border-right:1px solid var(--text);}
.tsh-slot[data-numat="right"]{flex-direction:row-reverse;}
.tsh-slot[data-numat="right"] .tsh-sno{border-left:1px solid var(--text);}
.tsh-box.pick{cursor:pointer; background:color-mix(in srgb, var(--start,#5b8def) 14%, var(--surface));}
.tsh-box.pick:hover{background:color-mix(in srgb, var(--start,#5b8def) 32%, var(--surface));}
.tsh-box.live{box-shadow:inset 0 0 0 2px var(--loss,#d33);}
.tsh-box.win{background:color-mix(in srgb, var(--win,#2e7d4f) 20%, var(--surface)); font-weight:700;}
.tsh-box.lose{color:var(--muted); background:var(--surface);}
.tsh-box.bye{color:var(--muted);}
.tsh-box.tsh-slot.empty{background:linear-gradient(to top right, transparent calc(50% - 1px), var(--text) calc(50% - 1px), var(--text) calc(50% + 1px), transparent calc(50% + 1px)), var(--surface);}
.tsh-box.tsh-slot.empty .tsh-sno{background:transparent;}
.tsh-box.off{opacity:.55;}
.tsh-box.goal{background:color-mix(in srgb, #f0c040 28%, var(--surface)); box-shadow:inset 0 0 0 2px #e0b030;}
.tsh-box.goal.win{background:color-mix(in srgb, #f0c040 40%, var(--surface));}
.tsh-champ{justify-content:center; font-size:14px; border-width:2px;}
.tsh-champ .tsh-name{text-align:center; flex:none; max-width:100%;}
.tsh-v{flex-direction:column; justify-content:flex-start; padding:3px 0; align-items:center;}
.tsh-v .tsh-txt{writing-mode:vertical-rl; flex:1; min-height:0; padding:0; align-items:flex-start; justify-content:flex-start; max-height:100%;}
.tsh-v .tsh-txt .tsh-name{text-overflow:clip; overflow:hidden; max-height:100%;}
.tsh-v .tsh-sub{flex-direction:row; max-height:100%;}
.tsh-v .tsh-sub .badge{padding:2px 0 !important; line-height:12px !important; height:auto; width:12px; border-radius:6px;}
.tsh-v .tsh-name{padding:0; text-overflow:clip;}
.tsh-v .tsh-txt .tsh-name{font-size:min(var(--nfs,12px), 16px);}
.tsh-v .tsh-lbl{writing-mode:vertical-rl; flex:1;}
.tsh-v .tsh-sno{width:100%; height:20px; border:0 !important; border-bottom:1px solid var(--text) !important;}
.nav-pl{display:inline-flex; flex-direction:column; align-items:flex-start; line-height:1.2; vertical-align:middle;}
.nav-pl .nav-sub{font-size:.68rem; font-weight:400; opacity:.9; white-space:nowrap;}
.nav-vs{font-weight:400; margin:0 .15rem; vertical-align:middle;}
button[data-action="jump-to-match"]{text-align:left;}
.tsh-edit{position:absolute; top:1px; right:1px; width:16px; height:16px; padding:0; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--muted); font-size:11px; line-height:14px; cursor:pointer; opacity:.55; z-index:2;}
.tsh-edit:hover{opacity:1; color:var(--text); background:var(--surface-2,#efebdf);}
.tsh-no{position:absolute; display:block; box-sizing:border-box; font-size:var(--numfs,11px); line-height:calc(var(--numfs,11px) + 3px); text-align:center; font-family:inherit; color:var(--text); background:transparent; border:0; padding:0; border-radius:7px; white-space:nowrap;}
.tsh-nv{line-height:calc(var(--numfs,11px) + 5px); padding:0 3px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
.tsh-time{display:block; font-size:calc(var(--numfs,11px)*.85); line-height:1.15; color:var(--muted); font-weight:400; white-space:nowrap;}
.tsh-no.ready .tsh-time,.tsh-no.live .tsh-time{color:inherit;}
button.tsh-no{cursor:pointer;}
button.tsh-no:hover{background:var(--surface-2,#efebdf); text-decoration:underline;}
.tsh-no.ready{background:var(--start,#5b8def); color:#fff; font-weight:700;}
.tsh-no.live{background:var(--loss,#d33); color:#fff; font-weight:700;}
.tsh-no.done{color:var(--muted);}
.tsh-no.bye,.tsh-no.off{color:var(--muted); opacity:.55;}
.tsh-no.jump-highlight{outline:3px solid var(--accent); outline-offset:2px;}
.tsh-cap{position:absolute; font-size:var(--capfs,11px); font-weight:700; letter-spacing:.04em; color:var(--muted); display:flex; align-items:flex-end; white-space:nowrap;}
.h2h-card .bflow-round-label{display:none;}
.h2h-card .bflow-round{padding-top:0;}
#qr-print-root{display:none;}
@media print{ body.qr-print-only .app-shell, body.qr-print-only .display-updated, body.qr-print-only .display-close-btn{display:none !important;} body.qr-print-only #qr-print-root{display:block; padding:2rem;} }
@media print{ .tsh-scroll{overflow:visible; border:0;} .tsh-zoom{zoom:.55 !important;} }
.h2h-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; display:flex; align-items:center; justify-content:center; padding:1rem;}
.h2h-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-width:520px; width:100%; max-height:82vh; overflow-y:auto; padding:1.1rem 1.2rem;}
.h2h-head{display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:.4rem;}
.h2h-head h3{margin:0;}
.h2h-players{font-weight:600; margin:.2rem 0;}
.h2h-record{color:var(--muted); margin:.2rem 0 .8rem;}
.guide-flow{display:flex; flex-direction:column; align-items:center; gap:0; max-width:640px; margin:0 auto;}
.guide-step{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:.9rem 1.1rem; width:100%; box-sizing:border-box;}
.guide-step h3{margin:0 0 .3rem; font-size:1rem;}
.rr-grid-wrap{overflow-x:auto; margin-bottom:.7rem;}
.rr-grid{border-collapse:collapse; font-size:.82rem; white-space:nowrap;}
.rr-grid th, .rr-grid td{border:1px solid var(--border); padding:.3rem .45rem; text-align:center;}
.rr-grid th{background:var(--surface-2);}
.rr-grid th.rr-rowhead{text-align:left; white-space:normal;}
.rr-grid th.rr-rowhead select{display:block; width:100%; margin-top:.2rem; font-size:.72rem; padding:1px 2px;}
.rr-grid td{min-width:2.6rem;}
.rr-grid td.rr-diag{background:repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 4px, var(--border) 4px, var(--border) 5px);}
.rr-grid td.rr-cell{cursor:pointer;}
.rr-grid td.rr-cell:hover{background:var(--surface-2);}
.rr-win{color:var(--loss); font-weight:700;}
.jump-highlight{outline:3px solid var(--accent); outline-offset:2px; animation: jump-pulse 1s ease-in-out 2;}
@keyframes jump-pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,134,46,.5);} 50%{box-shadow:0 0 0 8px rgba(184,134,46,0);}}
.float-toolbar{position:fixed; bottom:1.4rem; right:1.4rem; z-index:55; display:flex; flex-direction:column; gap:.6rem;}
.float-btn{width:2.8rem; height:2.8rem; border-radius:50%; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text);}
.float-btn:hover{filter:brightness(1.05); border-color:var(--accent);}
.guide-step p{margin:0;}
.guide-arrow{font-size:1.4rem; color:var(--accent); line-height:1; padding:.3rem 0;}
.bflow-slot-edit select{width:100%; font-size:.7rem; padding:1px 2px;}
.bflow-side{
  display:flex; align-items:center; flex-wrap:wrap; gap:.3rem; padding:.4rem .55rem; flex:1; font-size:.88rem; cursor:pointer;
}
.bflow-side + .bflow-side{border-top:1px solid var(--border);}
.bflow-side:hover:not(.bye):not(.winner){background:var(--surface-2);}
.bflow-side span.pname{flex:1; min-width:0; white-space:normal; overflow-wrap:break-word;}
.bflow-side .badge, .simple-side .badge{flex:none;}
.bflow-side.winner{font-weight:700; background:color-mix(in srgb, var(--felt) 14%, transparent); cursor:default;}

      if(col+c<=-1||this.moduleCount<=col+c) continue;
      var on = (0<=r&&r<=6&&(c===0||c===6)) || (0<=c&&c<=6&&(r===0||r===6)) || (2<=r&&r<=4&&2<=c&&c<=4);
      this.modules[row+r][col+c] = on;

QrModel.prototype.setupTimingPattern=function(){

    else this.modules[this.moduleCount-15+i][8]=mod;
  }
  for(var i=0;i<15;i++){
    var mod2 = (!test && ((bits>>i)&1)===1);
    if(i<8) this.modules[8][this.moduleCount-i-1]=mod2;
    else if(i<9) this.modules[8][15-i-1+1]=mod2;

function qrPickAndEncode(text){
  var bytes=[];
  for(var i=0;i<text.length;i++) bytes.push(text.charCodeAt(i)&0xff);
  var levels=["M","L"];
  for(var li=0; li<levels.length; li++){
    for(var v=1; v<=6; v++){
      try{
        var model = new QrModel(v, levels[li]);
        model.dataBytes = bytes;
        model.make();
        return model;
      }catch(e){ /* try next version/level */ }
    }
  }
  return null;
}
function qrToSvg(model, opts){

  var rects = "";
  for(var r=0;r<n;r++){
    for(var c=0;c<n;c++){
      if(model.isDark(r,c)) rects += '<rect x="'+((c+margin)*cell)+'" y="'+((r+margin)*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" style="display:block;background:#fff">'+
    '<g fill="#000">'+rects+'</g></svg>';
}

// QRコードだけを印刷する(印刷用の一時領域に大会名・QR・URLを入れ、画面の他の部分は印刷しない)
function printDisplayQr(url, name){
  var model = qrPickAndEncode(url);
  if(!model) return;
  var root = document.getElementById("qr-print-root");
  if(!root){ root = document.createElement("div"); root.id = "qr-print-root"; document.body.appendChild(root); }
  root.innerHTML = '<h2 style="margin:0 0 .6rem;text-align:center">'+esc(name||"")+'</h2>'+
    '<div style="width:320px;margin:0 auto">'+qrToSvg(model, {cellSize:5, margin:3})+'</div>'+
    '<p style="margin:.6rem 0 0;text-align:center;word-break:break-all;font-size:12px">'+esc(url)+'</p>';
  document.body.classList.add("qr-print-only");
  window.print();
  document.body.classList.remove("qr-print-only");
  root.innerHTML = "";
}
function downloadQrPng(url, name){
  var model = qrPickAndEncode(url);
  if(!model) return;
  var px = 640;
  var svg = qrToSvg(model, {cellSize:5, margin:4}).replace('width="100%" height="100%"', 'width="'+px+'" height="'+px+'"');
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement("canvas");
    cv.width = px; cv.height = px;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, px, px);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, px, px);
    cv.toBlob(function(blob){
      if(!blob) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "QR_"+String(name||"大会結果").replace(/[\\/:*?"<>|]/g, "_")+".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }, "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function qrDetailsHTML(url){
  var model = qrPickAndEncode(url);
  if(!model) return "";
  var svg = qrToSvg(model, {cellSize:5, margin:3});
  return '<details class="qr-details"><summary class="hint" style="cursor:pointer">QRコードを表示</summary>'+
    '<div style="margin-top:.5rem;max-width:220px">'+svg+
    '<div class="hint" style="margin-top:.3rem;word-break:break-all">'+esc(url)+'</div></div></details>';
}

  if(!s.manualClassSetCountsC){
    s.manualClassSetCountsC = JSON.parse(JSON.stringify(MANUAL_SET_COUNT_C_DEFAULT));

    Object.keys(MANUAL_SET_COUNT_C_DEFAULT).forEach(function(cls){

    });
  }
  if(!s.setTableCDefaultsV2){
    function sameTable(a, b){ return Object.keys(b).every(function(k){ return a && a[k]===b[k]; }); }
    if(sameTable(s.manualClassSetCountsC, MANUAL_SET_COUNT_C_V1)) s.manualClassSetCountsC = JSON.parse(JSON.stringify(MANUAL_SET_COUNT_C_DEFAULT));
    if(sameTable(s.manualClassDownSetCountsC, MANUAL_DOWN_SET_COUNT_C_V1)) s.manualClassDownSetCountsC = JSON.parse(JSON.stringify(MANUAL_DOWN_SET_COUNT_C_DEFAULT));

// 保存済みの決勝トーナメントを、全ラウンドの対戦が揃った形へ変換する(選手が揃った対戦から進められるようにするため)
function migrateFinalsEager(parsed){
  if(!parsed) return parsed;
  (parsed.tournaments||[]).forEach(function(t){
    if(t && t.finals && t.finals.rounds && t.finals.rounds.length && t.finals.rounds.length < t.finals.totalRounds){
      try{ finalsSyncBracket(t.finals, !!(t.status==="prelim" || t.status==="preFinals")); }catch(e){}
    }
  });
  return parsed;
}
// 旧「セット数C」(設定画面で編集していた固定表)は廃止し、新しい「セット数C」(大会ごとに自由設定)へ置き換えた。
// 旧セット数Cを使っていた大会は、そのときの表と特別ルールをそのまま大会ごとの設定(t.customSets)に写して、表示が変わらないようにする
function migrateOldSetTableC(parsed){
  if(!(parsed && parsed.settings) || parsed.settings.setTableCCustomMigrated) return parsed;
  var st = parsed.settings;
  var win = st.manualClassSetCountsC || MANUAL_SET_COUNT_C_DEFAULT, lose = st.manualClassDownSetCountsC || MANUAL_DOWN_SET_COUNT_C_DEFAULT;
  (parsed.tournaments||[]).forEach(function(t){
    if(!t || t.setCountTable!=="C" || t.customSets) return;
    var cs = defaultCustomSets();
    MANUAL_CLASS_OPTIONS_WITH_SETS.forEach(function(c){
      var w = win[c]!=null ? win[c] : MANUAL_SET_COUNT_C_DEFAULT[c];
      var l = lose[c]!=null ? lose[c] : MANUAL_DOWN_SET_COUNT_C_DEFAULT[c];
      cs.sets[c] = w;
      if(l!==w) cs.downSets[c] = l;
    });
    var top = ["P","LP","SA"];
    cs.rules.push({cls:"A", vs:top.slice(), delta:-1, side:"win"});
    [["B",3,3],["C",3,2],["Be",2,2]].forEach(function(r){
      var dw = r[1]-cs.sets[r[0]];
      var base = cs.downSets[r[0]]!=null ? cs.downSets[r[0]] : cs.sets[r[0]];
      var dl = r[2]-base;
      if(dw) cs.rules.push({cls:r[0], vs:top.slice(), delta:dw, side:"win"});
      if(dl) cs.rules.push({cls:r[0], vs:top.slice(), delta:dl, side:"lose"});
    });
    t.customSets = cs;
  });
  st.setTableCCustomMigrated = true;
  return parsed;
}

var SYNC_URL = "/api/state";
// データ仕様のバージョン。クラウドのデータがこのアプリより新しい仕様で保存されているときは、確認なしに上書きしない
var APP_SPEC_VERSION = 2;
var specBlocked = false;      // クラウドの仕様が新しいため、同期(取得・保存)を止めている
var specPrompted = false;     // 新しい仕様の確認ダイアログは、1回の起動で1度だけ出す
var syncTimer = null;
var syncInFlight = false;
var syncDirty = false;
function setSyncStatus(status){
  var el = document.getElementById("sync-status");
  if(!el) return;
  var label = {
    syncing: "🔄 同期中…",
    ok: "☁ クラウドに同期済み",
    error: "⚠ 同期エラー(この端末にのみ保存されています)",
    offline: "📴 オフライン(この端末にのみ保存されています)",
    specnew: "⚠ クラウドの仕様が新しいため同期していません(ページを再読み込みしてください)"
  }[status] || "";
  el.textContent = label;
  el.className = "nav-foot sync-" + status;
}
function scheduleServerSync(){
  syncDirty = true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushStateToServer, 600);
}
function pushStateToServer(){
  if(specBlocked){ setSyncStatus("specnew"); return; }
  if(syncInFlight){ syncTimer = setTimeout(pushStateToServer, 600); return; }
  syncDirty = false;
  syncInFlight = true;
  setSyncStatus("syncing");
  fetch(SYNC_URL, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(state)
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    syncInFlight = false;
    if(syncDirty){ pushStateToServer(); } else { setSyncStatus("ok"); }
  }).catch(function(e){
    syncInFlight = false;
    console.warn("server sync failed", e);
    setSyncStatus("error");
  });
}
function syncFromServer(cb){
  if(syncDirty || syncInFlight){
    // ローカルでの変更がまだサーバーに反映されていない間は、定期的な取得で
    // その変更を上書きしてしまわないよう、今回の同期はスキップする
    if(cb) cb();
    return;
  }
  setSyncStatus("syncing");
  fetch(SYNC_URL, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(serverState){
    if(serverState && serverState.players && (serverState.specVersion||1) > APP_SPEC_VERSION){
      // クラウドのデータが、このアプリより新しい仕様で保存されている: 確認するまで取得も保存もしない(古いアプリが新しいデータを上書きしないため)
      specBlocked = true;
      setSyncStatus("specnew");
      if(!specPrompted){
        specPrompted = true;
        if(confirm("クラウド上のデータは、このアプリより新しい仕様で保存されています。\n最新のアプリに更新して同期しますか?\n\n[OK] ページを再読み込みして最新のアプリで同期する\n[キャンセル] 同期せず、この端末のデータもクラウドに保存しない")){
          location.reload();
          return;
        }
      }
      if(cb) cb();
      return;
    }
    specBlocked = false;
    if(serverState && serverState.players){
      state = applyRosterUpdate(migrateFinalsEager(migrateSetTableD(migrateAddBeClass(migrateBestBorC(serverState)))));
      state.entries = state.entries || {};
      state.currentTournamentId = state.currentTournamentId || null;
      if(!cb && !isComposingText && !userInteracting) render();
    }
    saveState();
    if(cb) cb();
  }).catch(function(e){
    console.warn("initial sync fetch failed", e);
    setSyncStatus("offline");
    if(cb) cb();
  });
}

function classSubRank(code){
  if(code==="Be") code="BB";
  var c2 = code.charAt(1);
  return c2==="A" ? 1 : c2==="B" ? 2 : c2==="C" ? 3 : null;
}
var SA_EXTRA_REDUCE_CLASSES = ["AC","BC","Be"];
function secondaryHandicap(classA, classB){
  var result = {breakFor:null, reduceA:0, reduceB:0};
  var aIsSA = classA==="SA", bIsSA = classB==="SA";
  if(aIsSA || bIsSA){
    if(aIsSA && bIsSA){ result.reduceA = 5; result.reduceB = 5; return result; }
    if(aIsSA){
      result.reduceA = SA_EXTRA_REDUCE_CLASSES.indexOf(classB)>=0 ? 10 : 5;
      result.breakFor = "b";
    } else {
      result.reduceB = SA_EXTRA_REDUCE_CLASSES.indexOf(classA)>=0 ? 10 : 5;
      result.breakFor = "a";
    }
    return result;
  }
  if(classA.charAt(0) !== classB.charAt(0)) return result;
  var rA = classSubRank(classA), rB = classSubRank(classB);
  if(rA==null || rB==null || rA===rB) return result;
  var idxA = CLASSES.indexOf(classA), idxB = CLASSES.indexOf(classB);
  var weaker = idxA>idxB ? "a" : "b";
  result.breakFor = weaker;
  if(Math.abs(rA-rB)>=2){
    if(weaker==="a") result.reduceB = 5; else result.reduceA = 5;
  }
  return result;
}
function setTableOf(t){

}

function defaultCustomSets(){
  var sets = {}, k;

function ensureCustomSets(holder){

// セット数C: クラスごとのセット数(blank=セット数を表示しない)に、対戦相手のクラス別の特別ルール(増減)を加えた値
// 特別ルールの対象クラス(複数選択可。旧形式のcls単数にも対応)
function ruleClassesOf(r){

function customSetsFor(t, cls, oppCls, useDownSet){

  if(base==null) return null;

    if(ruleClassesOf(r).indexOf(cls)<0 || !r.vs || r.vs.indexOf(oppCls)<0) return;
    if(r.side==="win" && useDownSet) return;

  var s = parts.length ? parts.join(" ・ ") : "セット数の設定なし";

// ---------- round robin / seeding ----------
// 総当たり戦の対戦順を提案する(サークル法): 各ラウンドで全員が同時に別の相手と対戦できるよう組み、
// 同じ選手が連続で対戦しなくて済むようにラウンド順に並べて返す(奇数人数の場合は各ラウンドで1名ずつ順番に休み)
function roundRobinPairs(ids){
  var arr = ids.slice();
  if(arr.length % 2 === 1) arr.push(null);
  var m = arr.length;
  var pairs = [];
  for(var r=0; r<m-1; r++){
    for(var i=0; i<m/2; i++){
      var a = arr[i], b = arr[m-1-i];
      if(a!=null && b!=null) pairs.push([a,b]);
    }
    var last = arr.pop();
    arr.splice(1, 0, last);
  }
  return pairs;
}
function seedOrder(size){
  var seeds=[1,2];
  while(seeds.length<size){
    var total = seeds.length*2+1;
    var next=[];
    for(var i=0;i<seeds.length;i++) next.push(seeds[i], total-seeds[i]);
    seeds=next;
  }
  return seeds;
}

  var sorted = ids.slice().sort(seedCompare(entries||{}));

  else { size=1; while(size<sorted.length) size*=2; }
  var order = seedOrder(size);
  return order.map(function(seedIdx){ return sorted[seedIdx-1] || null; });
}

    var a=slots[i], b=slots[i+1];

    round1.push({
      id:"r1_m"+(i/2), round:1, a:a, b:b,
      winner: bye ? (a || b) : null,
      deltas: null, bye: bye, score:{a:null,b:null}
    });
  }
  var totalRounds = Math.max(1, Math.round(Math.log2(slots.length)));

    if(stopAtSize!=null && winners.length<=stopAtSize) break;
    var nextRound=[];
    for(var i=0;i<winners.length;i+=2){
      var a=winners[i], b=winners[i+1];
      var bye = (!a || !b);
      nextRound.push({
        id:"r"+(bracket.rounds.length+1)+"_m"+(i/2), round: bracket.rounds.length+1,
        a:a, b:b, winner: bye ? (a||b) : null, deltas:null, bye:bye, score:{a:null,b:null}
      });
    }
    bracket.rounds.push(nextRound);
  }
}
function padBracketRounds(bracket, capRounds){
  var totalRounds = capRounds!=null ? Math.min(capRounds, bracket.totalRounds) : bracket.totalRounds;
  // 実際にもう進行してしまっているラウンド(g.wb.rounds に既に実データがある分)は、
  // 目安の進出人数から逆算した表示上限がそれより小さくても隠さない(隠すと対戦が入力できなくなるため)
  totalRounds = Math.max(totalRounds, bracket.rounds.length);
  var rounds = bracket.rounds.slice();
  // 対戦が1つ終わるごとに、そのラウンドがまだ全部終わっていなくても
  // 判明した勝者名だけ次のラウンドの枠に先出しする(敗者復活ブロックの
  // lbPreviewRoundsForProj と同じ考え方)
  var lastVals = rounds[rounds.length-1].map(function(m){ return m.winner; });
  for(var r=rounds.length; r<totalRounds; r++){
    var n = Math.max(1, Math.ceil(lastVals.length/2));
    var placeholder=[];
    var outVals=[];
    for(var i=0;i<n;i++){
      var a = lastVals[i*2]!=null ? lastVals[i*2] : null;
      var b = lastVals[i*2+1]!=null ? lastVals[i*2+1] : null;
      placeholder.push({id:"ph_r"+(r+1)+"_m"+i, round:r+1, a:a, b:b, winner:null, deltas:null, bye:false, preview:true, score:{a:null,b:null}});
      outVals.push(null);
    }
    rounds.push(placeholder);
    lastVals = outVals;
  }
  return rounds;
}
function roundsNeededForTarget(startSize, target){
  if(!target || target<1) target=1;
  var size = startSize, rounds=0;
  while(size>target){
    size = Math.ceil(size/2);
    rounds++;
  }
  return Math.max(1, rounds);
}
// 表(シングルエリミネーション)で、決勝進出人数まで絞り込むのに必要な(表示・入力する)ラウンド数。
// 各ラウンド終了時の勝ち残り人数は「次ラウンドの試合数×2」(最終ラウンド後は1名)
function tplSingleRoundsNeeded(def, advance){
  var R = def.wbRounds.length;
  for(var r=1;r<=R;r++){
    var alive = (r===R) ? 1 : def.wbRounds[r].length*2;
    if(alive<=advance) return r;
  }
  return R;
}
// 予選グループの勝者側で表示・入力の対象とするラウンド数(決勝進出人数に到達するまで。すでに結果が入っているラウンドは隠さない)
function cappedRoundsFor(t, g){
  var advance = (hasLoserBracket(t) && t.advancePerGroupWB!=null) ? t.advancePerGroupWB : t.advancePerGroup;
  if(g.tpl){
    var def = TPL_DEFS[g.tpl];
    if(def.type==="double") return g.wb.rounds.length;
    var cap = tplSingleRoundsNeeded(def, advance);
    g.wb.rounds.forEach(function(round, ri){
      round.forEach(function(m){ if(m.winner && !m.bye) cap = Math.max(cap, ri+1); });
    });
    return cap;
  }
  return Math.max(roundsNeededForTarget(g.targetSize, advance), g.wb.rounds.length);
}
function roundName(roundIdx, totalRounds){
  var fromEnd = totalRounds-roundIdx;
  if(fromEnd===0) return "決勝";
  if(fromEnd===1) return "準決勝";
  if(fromEnd===2) return "準々決勝";
  return roundIdx+"回戦";
}

// ---------- core scoring engine ----------
function applyPointDelta(player, amount, t){
  if(amount < 0 && t){
    var floor = state.settings.minPoints!=null ? state.settings.minPoints : MIN_POINTS_DEFAULT;
    var soFar = tournamentPointDeltas(t)[player.id] || 0;
    var maxLoss = Math.max(0, soFar - floor);
    amount = -Math.min(-amount, maxLoss);
  }
  player.points += amount;
  return amount;
}
// 対戦が終了した時点のセット数・持ち時間の表示を対戦に記録する(後から「設定」のセット数を変えても、終了済みの対戦の表示は変わらない)
function snapshotMatchFormats(match, winnerId, loserId, t){
  var snap = {};
  [[winnerId, loserId],[loserId, winnerId]].forEach(function(pr){
    var n = matchFormatFor(pr[0], pr[1], false, t), d = matchFormatFor(pr[0], pr[1], true, t);
    if(n && n.pairPoints==null) snap[pr[0]] = {n:n, d:d};
  });
  match.fmtSnap = snap;
}
function resolveMatch(match, winnerId, t){
  var loserId = winnerId===match.a ? match.b : match.a;
  var winner = getPlayer(winnerId), loser = getPlayer(loserId);
  if(!winner || !loser) return [];
  snapshotMatchFormats(match, winnerId, loserId, t);
  if(!usePointsAndSets(t)){
    match.winner = winnerId;
    match.deltas = [];
    match.finishedAt = Date.now();
    return [];
  }
  var wClass = entryClassOf(t, winnerId), lClass = entryClassOf(t, loserId);
  var winDelta = state.settings.winMatrix[wClass][lClass] || 0;
  var loseDelta = state.settings.loseMatrix[lClass][wClass] || 0;
  var deltas=[];
  if(winDelta){ winner.points += winDelta; deltas.push({playerId:winnerId, amount:winDelta, reason:"勝利 ("+wClass+" vs "+lClass+")"}); }
  if(loseDelta){ var appliedLoseDelta = applyPointDelta(loser, loseDelta, t); deltas.push({playerId:loserId, amount:appliedLoseDelta, reason:"敗北 ("+lClass+" vs "+wClass+")"}); }
  var prevChamp = previousChampionOf(t);
  if(prevChamp && loserId===prevChamp){
    var b = state.settings.bonuses.beatPrevChampion || 0;
    if(b){ winner.points += b; deltas.push({playerId:winnerId, amount:b, reason:BONUS_LABELS.beatPrevChampion}); }
  }
  match.winner = winnerId;
  match.deltas = deltas;
  match.finishedAt = Date.now();
  return deltas;
}
function undoMatchDeltas(match){
  match.finishedAt = null;
  match.fmtSnap = null;
  if(!match.winner || !match.deltas) { match.winner=null; match.deltas=null; return; }
  match.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
  match.winner=null; match.deltas=null;
}

// ---------- ② block prelim ----------
function recomputeBlockElimination(block, t){
  // リーグ戦(総当たり)では予選2敗による自動失格・ペナルティは適用しない(全試合を戦い切る方式のため)
  var losses={};
  block.playerIds.forEach(function(id){ losses[id]=0; });
  block.matches.forEach(function(m){
    if(m.winner){ var loserId = m.winner===m.a ? m.b : m.a; losses[loserId]=(losses[loserId]||0)+1; }
  });
  block.losses = losses;
}
function correctBlockMatch(t, block, matchId){
  unwindFinalsIfNeeded(t);
  var match = block.matches.find(function(m){ return m.id===matchId; });
  if(!match || !match.winner) return;
  undoMatchDeltas(match);
  recomputeBlockElimination(block, t);
}
var CIRCLED_NUMS = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
function circledNum(n){ return (n>=1 && n<=20) ? CIRCLED_NUMS[n-1] : "("+n+")"; }
function blockStandings(t, block){
  return block.playerIds.map(function(id){
    return {id:id, wins:block.matches.filter(function(m){ return m.winner===id; }).length, points:entryPointsOf(t, id)};
  }).sort(function(a,b){
    if(b.wins!==a.wins) return b.wins-a.wins;
    return b.points-a.points;
  });
}
function blockTieInfo(t, block, advanceCount){
  var standings = blockStandings(t, block);
  if(advanceCount>=standings.length) return null;
  var boundary = standings[advanceCount-1];
  var next = standings[advanceCount];
  if(!boundary || !next || boundary.wins!==next.wins) return null;
  var tiedIds=[], firstTiedIdx=-1;
  standings.forEach(function(s, i){
    if(s.wins===boundary.wins){
      tiedIds.push(s.id);
      if(firstTiedIdx<0) firstTiedIdx=i;
    }
  });
  return { tiedIds:tiedIds, needCount: advanceCount-firstTiedIdx, guaranteedIds: standings.slice(0, firstTiedIdx).map(function(s){return s.id;}) };
}
function finalizeBlockPrelim(t){
  var advancers=[];
  t.blocks.forEach(function(block){
    var tie = blockTieInfo(t, block, t.advancePerBlock);
    var adv;
    if(tie){
      var chosen = ((t.tieBreakSelections && t.tieBreakSelections[block.index]) || []).filter(function(id){ return tie.tiedIds.indexOf(id)>=0; });
      if(chosen.length < tie.needCount){
        adv = blockStandings(t, block).map(function(s){ return s.id; }).slice(0, t.advancePerBlock);
      } else {
        adv = tie.guaranteedIds.concat(chosen.slice(0, tie.needCount));
      }
    } else {
      adv = blockStandings(t, block).map(function(s){ return s.id; }).slice(0, t.advancePerBlock);
    }
    block.advanced = adv;
    advancers = advancers.concat(adv);
  });
  t.tieBreakSelections = null;
  applyAdvanceBonusAndBuildFinals(t, advancers);
}
function rebuildBlockFromSlots(t, b){
  if(b.matches){
    b.matches.forEach(function(m){ if(m.winner) undoMatchDeltas(m); });
  }
  if(b.penaltyDeltas){
    Object.keys(b.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= b.penaltyDeltas[id]; });
  }
  var real = b.slots.filter(function(x){ return x; });
  b.playerIds = real;
  b.matches = roundRobinPairs(real).map(function(pair,i){ return {id:"b"+b.index+"m"+i, a:pair[0], b:pair[1], winner:null, deltas:null, score:{a:null,b:null}}; });
  b.eliminated={}; b.losses={}; b.penaltyDeltas={}; b.advanced=[];
  if(t.tieBreakSelections) delete t.tieBreakSelections[b.index];
}

// ---------- ① single/double elimination prelim (per group) ----------
function tallyLosses(roundsArr, losses){
  roundsArr.forEach(function(round){
    round.forEach(function(m){
      if(m.winner && !m.bye){ var loserId = m.winner===m.a ? m.b : m.a; losses[loserId]=(losses[loserId]||0)+1; }
    });
  });
}
function hasLoserBracketType(prelimType){
  return prelimType==="double" || prelimType==="round1Double";
}
function hasLoserBracket(t){
  return hasLoserBracketType(t && t.prelimType);
}
function prelimTypeLabel(prelimType){
  if(prelimType==="double") return "ダブルエリミネーション";
  if(prelimType==="round1Double") return "1回戦のみダブルエリミネーション";
  return "シングルエリミネーション";
}
function tournamentFormatLabel(t){
  if(!t) return "";
  if(t.status==="entryPending") return "試合形式は未選択";
  if(t.format==="blockPrelim") return "②予選リーグ+決勝トーナメント";
  return "①トーナメント戦(予選:"+prelimTypeLabel(t.prelimType)+")";
}
function recomputeElimGroup(t, g){
  var threshold = g.threshold;
  var ids = g.wb.entrants;
  var isR1D = t.prelimType==="round1Double";
  var losses = {}, wbLaterLoss = {};
  ids.forEach(function(id){ losses[id]=0; });
  g.wb.rounds.forEach(function(round, ri){
    round.forEach(function(m){
      if(m.winner && !m.bye){
        var loserId = m.winner===m.a ? m.b : m.a;
        losses[loserId]=(losses[loserId]||0)+1;
        if(ri>0) wbLaterLoss[loserId]=true;
      }
    });
  });
  if(hasLoserBracket(t)) tallyLosses(g.lb.rounds, losses);
  // 1回戦のみダブル: 敗者復活は1回戦敗退者だけ。2回戦以降の敗北は即失格
  function isOut(id){
    if(isR1D) return (losses[id]||0)>=2 || !!wbLaterLoss[id];
    return (losses[id]||0) >= threshold;
  }
  g.eliminated = g.eliminated || {};
  g.penaltyDeltas = g.penaltyDeltas || {};
  ids.forEach(function(id){
    var was = !!g.eliminated[id];
    var now = isOut(id);
    if(now && !was){
      g.eliminated[id] = true;
      if(threshold===2 && (losses[id]||0)>=2){
        var pen = usePointsAndSets(t) ? (state.settings.bonuses.prelimDoubleLossPenalty || 0) : 0;
        if(pen){ var p=getPlayer(id); if(p) g.penaltyDeltas[id]=applyPointDelta(p, pen, t); }
      }
    } else if(!now && was){
      g.eliminated[id] = false;
      var applied = g.penaltyDeltas[id];
      if(applied){ var p2=getPlayer(id); if(p2) p2.points -= applied; delete g.penaltyDeltas[id]; }
    }
  });
  g.losses = losses;
  g.aliveCount = ids.filter(function(id){ return !isOut(id); }).length;
  g.wbAliveCount = ids.filter(function(id){ return (losses[id]||0)===0; }).length;
  g.lbAliveCount = ids.filter(function(id){ return (losses[id]||0)===1 && !isOut(id); }).length;
}
function groupReached(t, g){
  if(hasLoserBracket(t) && t.advancePerGroupWB!=null){
    return g.wbAliveCount<=t.advancePerGroupWB && g.lbAliveCount<=t.advancePerGroupLB;
  }
  return g.aliveCount <= t.advancePerGroup;
}
// ---------- 大会の進捗状況・次に入力できる対戦(進捗ナビ) ----------
// 進捗ナビの「勝者側優先/敗者側優先」設定(大会ごと。画面遷移・再読み込みをまたいで保持する必要がないためstateの外で管理)
var navPriorityByTid = {};
var NAV_SUGGESTION_LIMIT = 8;
function hasPartialScore(m){
  return !!(m.started || (m.score && (m.score.a!=null || m.score.b!=null)));
}
// 対戦相手が重複しない(誰も2試合に同時に出場しない)範囲で、優先順に候補から複数試合を選ぶ
function pickNonOverlapping(candidates, limit){
  var used = {};
  var picked = [];
  for(var i=0;i<candidates.length && picked.length<limit;i++){
    var c = candidates[i];
    if(used[c.aId] || used[c.bId]) continue;
    picked.push(c);
    used[c.aId]=true; used[c.bId]=true;
  }
  return picked;
}
function elimGroupCandidates(t, g, gi){
  var wbNotStarted=[], wbInProgress=[], wbTotal=0, wbDone=0;
  var cappedRounds = cappedRoundsFor(t, g);
  buildWbDisplayRounds(g, cappedRounds).forEach(function(round){
    round.forEach(function(m){
      // 表に対応する形式は、出場者がまだ決まっていない対戦も含めて「全試合数」として数える
      if(g.tpl && !m.bye) wbTotal++;
      if(m.a && m.b && !m.bye){
        if(!g.tpl) wbTotal++;
        if(m.winner){ wbDone++; return; }
        var info = {scope:"elim", side:"wb", groupIdx:gi, mid:m.id, aId:m.a, bId:m.b, aName:playerName(m.a), bName:playerName(m.b)};
        if(hasPartialScore(m)) wbInProgress.push(info); else wbNotStarted.push(info);
      }
    });
  });
  var lbNotStarted=[], lbInProgress=[], lbTotal=0, lbDone=0;
  if(hasLoserBracket(t)){
    var lbProj = computeLbSlotProjections(g, t, cappedRounds);
    lbRoundsForDisplay(g, lbProj).forEach(function(round){
      round.forEach(function(m){
        if(g.tpl && !m.bye) lbTotal++;
        if(m.a && m.b && !m.bye){
          if(!g.tpl) lbTotal++;
          if(m.winner){ lbDone++; return; }
          var info = {scope:"elim", side:"lb", groupIdx:gi, mid:m.id, aId:m.a, bId:m.b, aName:playerName(m.a), bName:playerName(m.b)};
          if(hasPartialScore(m)) lbInProgress.push(info); else lbNotStarted.push(info);
        }
      });
    });
  }
  return {wbNotStarted:wbNotStarted, wbInProgress:wbInProgress, wbTotal:wbTotal, wbDone:wbDone,
          lbNotStarted:lbNotStarted, lbInProgress:lbInProgress, lbTotal:lbTotal, lbDone:lbDone};
}
function computeElimProgress(t, priority){
  var total=0, done=0;
  var wbNotStartedAll=[], lbNotStartedAll=[], inProgressAll=[];
  t.groups.forEach(function(g, gi){
    var c = elimGroupCandidates(t, g, gi);
    total += c.wbTotal + c.lbTotal;
    done += c.wbDone + c.lbDone;
    wbNotStartedAll = wbNotStartedAll.concat(c.wbNotStarted);
    lbNotStartedAll = lbNotStartedAll.concat(c.lbNotStarted);
    inProgressAll = inProgressAll.concat(c.wbInProgress, c.lbInProgress);
  });
  var ordered = priority==="lb" ? lbNotStartedAll.concat(wbNotStartedAll) : wbNotStartedAll.concat(lbNotStartedAll);
  return {total:total, done:done, nextList: pickNonOverlapping(ordered, NAV_SUGGESTION_LIMIT), inProgress: inProgressAll};
}
function computeBlockProgress(t){
  var total=0, done=0;
  var notStartedAll=[], inProgressAll=[];
  t.blocks.forEach(function(b, bi){
    b.matches.forEach(function(m){
      total++;
      if(m.winner){ done++; return; }
      var info = {scope:"block", blockIdx:bi, mid:m.id, aId:m.a, bId:m.b, aName:playerName(m.a), bName:playerName(m.b)};
      if(hasPartialScore(m)) inProgressAll.push(info); else notStartedAll.push(info);
    });
  });
  return {total:total, done:done, nextList: pickNonOverlapping(notStartedAll, NAV_SUGGESTION_LIMIT), inProgress: inProgressAll};
}
function computePreFinalsProgress(t){
  var total = t.preFinals.matches.length, done=0;
  var notStartedAll=[], inProgressAll=[];
  t.preFinals.matches.forEach(function(m){
    if(m.winner){ done++; return; }
    var info = {scope:"preFinals", mid:m.id, aId:m.a, bId:m.b, aName:playerName(m.a), bName:playerName(m.b)};
    if(hasPartialScore(m)) inProgressAll.push(info); else notStartedAll.push(info);
  });
  return {total:total, done:done, nextList: pickNonOverlapping(notStartedAll, NAV_SUGGESTION_LIMIT), inProgress: inProgressAll};
}
function computeFinalsProgress(t){
  var total=0, done=0;
  var notStartedAll=[], inProgressAll=[];
  t.finals.rounds.forEach(function(round){
    round.forEach(function(m){
      if(m.a && m.b && !m.bye){
        total++;
        if(m.winner){ done++; return; }
        var info = {scope:"bracket", mid:m.id, aId:m.a, bId:m.b, aName:playerName(m.a), bName:playerName(m.b)};
        if(hasPartialScore(m)) inProgressAll.push(info); else notStartedAll.push(info);
      }
    });
  });
  return {total:total, done:done, nextList: pickNonOverlapping(notStartedAll, NAV_SUGGESTION_LIMIT), inProgress: inProgressAll};
}
// 予選の途中から先行編成した決勝の対戦も、進捗ナビの「次に開始できる対戦」などに含める
function computeTournamentProgress(t){
  var p = computeTournamentProgressBase(t);
  if(p && t.status==="prelim" && isEarlyFinals(t)){
    var pf = computeFinalsProgress(t);
    p.total += pf.total; p.done += pf.done;
    p.nextList = pickNonOverlapping(pf.nextList.concat(p.nextList), NAV_SUGGESTION_LIMIT);   // 先行編成した決勝の対戦(数が少ない)を先に並べる
    p.inProgress = p.inProgress.concat(pf.inProgress);
  }
  return p;
}
function computeTournamentProgressBase(t){
  if(t.status==="preFinals"){
    var p1 = computePreFinalsProgress(t);
    return {stageLabel:"予備決勝戦中", total:p1.total, done:p1.done, nextList:p1.nextList, inProgress:p1.inProgress, showPriorityToggle:false};
  }
  if(t.status==="finals"){
    var p2 = computeFinalsProgress(t);
    return {stageLabel:"決勝トーナメント中", total:p2.total, done:p2.done, nextList:p2.nextList, inProgress:p2.inProgress, showPriorityToggle:false};
  }
  if(t.status==="prelim"){
    if(t.format==="blockPrelim"){
      var p3 = computeBlockProgress(t);
      return {stageLabel:"予選中(リーグ戦)", total:p3.total, done:p3.done, nextList:p3.nextList, inProgress:p3.inProgress, showPriorityToggle:false};
    }
    var priority = navPriorityByTid[t.id] || "wb";
    var p4 = computeElimProgress(t, priority);
    return {stageLabel:"予選中(トーナメント)", total:p4.total, done:p4.done, nextList:p4.nextList, inProgress:p4.inProgress, showPriorityToggle: hasLoserBracket(t), priority: priority};
  }
  return null;
}
// ---------- 試合開始の予測時間(概算) ----------
// 進捗状況(終わった試合・試合中の試合)と、台数・1試合の所要時間から、残りの試合の開始・終了の見込み時刻を計算する。
// 各対戦は「前の対戦(勝者・敗者の入る元の試合)が終わってから」始められるものとして、台数の空きに合わせて順に割り当てる。
var estModal = null;           // 予測ポップアップの表示状態({tid})
var EST_DEFAULT_TABLES = 8;
var EST_DEFAULT_MINUTES = 40;
// 実際に試合開始〜結果入力にかかった時間の平均(分)。3試合以上の実績があるときだけ返す
function measuredMatchMinutes(t){
  var ds = [];
  function take(m){ if(m && m.startedAt && m.finishedAt && m.winner && !m.bye){ var d = (m.finishedAt - m.startedAt)/60000; if(d>=3 && d<=180) ds.push(d); } }
  (t.groups||[]).forEach(function(g){
    ((g.wb && g.wb.rounds)||[]).concat((g.lb && g.lb.rounds)||[]).forEach(function(r){ r.forEach(take); });
  });
  (t.blocks||[]).forEach(function(b){ (b.matches||[]).forEach(take); });
  if(t.finals) t.finals.rounds.forEach(function(r){ r.forEach(take); });
  if(ds.length < 3) return null;
  return {minutes: Math.round(ds.reduce(function(a,b){ return a+b; }, 0)/ds.length), count: ds.length};
}
// 実績の集計: 最初の試合の開始時刻・最後に終わった試合の終了時刻・1試合の平均所要時間(試合開始ボタン〜結果入力の記録から)
function matchActuals(t){
  var firstStart = null, lastEnd = null, ds = [];
  function take(m){
    if(!m || m.bye) return;
    if(m.startedAt && (firstStart==null || m.startedAt<firstStart)) firstStart = m.startedAt;
    if(m.winner && m.finishedAt){
      if(lastEnd==null || m.finishedAt>lastEnd) lastEnd = m.finishedAt;
      if(m.startedAt){ var d = (m.finishedAt - m.startedAt)/60000; if(d>0 && d<=180) ds.push(d); }
    }
  }
  (t.groups||[]).forEach(function(g){
    ((g.wb && g.wb.rounds)||[]).concat((g.lb && g.lb.rounds)||[]).forEach(function(r){ r.forEach(take); });
  });
  (t.blocks||[]).forEach(function(b){ (b.matches||[]).forEach(take); });
  if(t.preFinals) (t.preFinals.matches||[]).forEach(take);
  if(t.finals) t.finals.rounds.forEach(function(r){ r.forEach(take); });
  var avg = ds.length ? Math.round(ds.reduce(function(a,b){ return a+b; }, 0)/ds.length*10)/10 : null;
  return {firstStart:firstStart, lastEnd:lastEnd, avgMinutes:avg, count:ds.length};
}
function matchActualsHTML(t){
  var a = matchActuals(t);
  function cell(label, val){ return '<div style="min-width:9rem"><div class="hint">'+label+'</div><div><b>'+val+'</b></div></div>'; }
  return '<div class="form-row" style="gap:1.2rem;flex-wrap:wrap;margin:.3rem 0 .6rem;padding:.5rem .7rem;border:1px solid var(--border);border-radius:.5rem">'+
    cell("最初の試合の開始", a.firstStart ? fmtClock(a.firstStart) : "-")+
    cell("最後の試合の終了", a.lastEnd ? fmtClock(a.lastEnd) : "-")+
    cell("1試合の平均時間", a.avgMinutes!=null ? ("約"+Math.round(a.avgMinutes)+"分 <span class=\"hint\">("+a.count+"試合)</span>") : "-")+
  '</div>';
}
// 試合ごとの開始・終了時刻の一覧(確認・編集用)。出場者が決まっていて、開始または終了が記録されている試合だけ
function matchTimeRecords(t){
  var recs = [];
  function add(m, label){
    if(!m || m.bye || m.preview || !m.a || !m.b) return;
    if(!(m.winner || m.started || m.startedAt)) return;
    recs.push({m:m, label:label});
  }
  (t.groups||[]).forEach(function(g, gi){
    var gl = (t.groups.length>1) ? ("グループ"+(gi+1)+" ") : "";
    [["勝者側", g.wb], ["敗者側", g.lb]].forEach(function(pair){
      if(!pair[1] || !pair[1].rounds) return;
      var sl = g.lb ? (pair[0]+" ") : "";
      pair[1].rounds.forEach(function(r, ri){
        r.forEach(function(m){ add(m, gl+sl+(m.no!=null ? ("No."+m.no+" ") : "")+(m.round||(ri+1))+"回戦"); });
      });
    });
  });
  (t.blocks||[]).forEach(function(b){ (b.matches||[]).forEach(function(m, mi){ add(m, "ブロック"+(b.index+1)+" 第"+(mi+1)+"試合"); }); });
  if(t.preFinals) (t.preFinals.matches||[]).forEach(function(m){ add(m, "予備決勝戦"); });
  if(t.finals) t.finals.rounds.forEach(function(r, ri){
    r.forEach(function(m){ add(m, "決勝トーナメント "+roundName(ri+1, t.finals.totalRounds)); });
  });
  return recs;
}
// 「試合時間の記録」: 開始・終了時刻と1試合の平均時間。試合終了後(大会終了後)も確認でき、開始・終了時刻は編集できる
function renderMatchTimesSection(t){
  if(!t || t.status==="entryPending" || t.status==="assigning") return "";
  var recs = matchTimeRecords(t);
  var rows = recs.map(function(r, i){
    var m = r.m, attrs = 'data-action="edit-match-time" data-tid="'+t.id+'" data-idx="'+i+'"';
    var dur = (m.startedAt && m.finishedAt && m.finishedAt>m.startedAt) ? (Math.round((m.finishedAt-m.startedAt)/60000)+"分") : "-";
    return '<tr><td>'+esc(r.label)+'</td><td>'+esc(playerName(m.a))+' vs '+esc(playerName(m.b))+'</td>'+
      '<td><input type="time" value="'+(m.startedAt ? fmtClock(m.startedAt) : "")+'" data-which="start" '+attrs+'></td>'+
      '<td>'+(m.winner ? ('<input type="time" value="'+(m.finishedAt ? fmtClock(m.finishedAt) : "")+'" data-which="end" '+attrs+'>') : '<span class="hint">試合中</span>')+'</td>'+
      '<td class="num">'+dur+'</td></tr>';
  }).join("");
  return '<details class="card no-print" data-match-times-tid="'+t.id+'"'+(matchTimesOpenByTid[t.id] ? " open" : "")+'>'+
    '<summary style="cursor:pointer;font-weight:600">⏱ 試合時間の記録(開始・終了時刻・1試合の平均時間)</summary>'+
    '<div style="margin-top:.6rem">'+matchActualsHTML(t)+
    (rows ? ('<p class="hint" style="margin:.2rem 0 .4rem">試合開始・結果入力の時刻が自動で記録されます。時刻は直接修正できます(空欄にすると記録を消します)。</p>'+
      '<div class="table-wrap"><table class="data"><thead><tr><th>試合</th><th>対戦</th><th>開始</th><th>終了</th><th>所要</th></tr></thead><tbody>'+rows+'</tbody></table></div>') :
      '<p class="hint">まだ記録された試合はありません。</p>')+
    '</div></details>';
}
function estimateSettings(t){
  var meas = measuredMatchMinutes(t);
  var tables = (t.estTables>0) ? t.estTables : EST_DEFAULT_TABLES;
  var initial = (t.estMinutesInitial>0) ? t.estMinutesInitial : EST_DEFAULT_MINUTES;   // 大会作成時に設定した所要時間の目安
  var minutes = (t.estMinutes>0) ? t.estMinutes : (meas ? meas.minutes : initial);
  return {tables:tables, minutes:minutes, measured:meas, initial:initial, minutesIsAuto:!(t.estMinutes>0)};
}
// nodes: [{id, deps:[id], state:"done"|"live"|"todo"|"bye", startedAt, order, label}] を台数tablesで割り当て、各nodeのstart/finish(ms)を返す
function estimateSchedule(nodes, tables, minutes, now){
  var byId = {}; nodes.forEach(function(n){ byId[n.id] = n; });
  var dur = minutes*60000, free = [];
  for(var i=0;i<tables;i++) free.push(now);
  var fin = {};
  function finishOf(id, seen){
    var n = byId[id]; if(!n) return 0;
    if(fin[id]!=null) return fin[id];
    if(n.state==="done") return (fin[id] = 0);
    if(n.state==="bye"){
      var mx = 0; (n.deps||[]).forEach(function(d){ var f = finishOf(d); if(f==null) mx = null; else if(mx!=null) mx = Math.max(mx, f); });
      if(mx==null) return null;
      return (fin[id] = mx);
    }
    return null;   // live/todoは割り当て後に設定される
  }
  // 試合中の対戦は、その台を占有する(開始から所要時間が過ぎていれば、あと少しで終わるものとする)
  var live = nodes.filter(function(n){ return n.state==="live"; }).sort(function(a,b){ return (a.startedAt||now)-(b.startedAt||now); });
  live.forEach(function(n, i){
    var st = n.startedAt || now, end = st + dur;
    if(end <= now) end = now + dur*0.3;
    n.start = st; n.finish = end; fin[n.id] = end;
    if(i < free.length) free[i] = end;
  });
  var todo = nodes.filter(function(n){ return n.state==="todo"; });
  var guard = todo.length + 5;
  while(todo.length && guard-- > 0){
    var best = null, bestStart = Infinity;
    todo.forEach(function(n){
      var ready = now, ok = true;
      (n.deps||[]).forEach(function(d){ var f = finishOf(d); if(f==null) ok = false; else ready = Math.max(ready, f); });
      if(!ok) return;
      var minFree = Math.min.apply(null, free), st = Math.max(ready, minFree);
      if(st < bestStart || (st===bestStart && best && n.order < best.order)){ best = n; bestStart = st; }
    });
    if(!best) break;
    var ti = 0; for(var k=1;k<free.length;k++){ if(free[k] < free[ti]) ti = k; }
    best.start = bestStart; best.finish = bestStart + dur; fin[best.id] = best.finish; free[ti] = best.finish;
    todo.splice(todo.indexOf(best), 1);
  }
  return nodes;
}
// 大会の進捗から、予測の行(区分・開始見込み・終了見込み・残り試合数)と、予選・決勝の終了見込みを作る
function buildEstimate(t){
  var st = estimateSettings(t), now = Date.now(), rows = [], notes = [];
  var nodes = [], order = 0, prelimGroups = [];
  var prelimNodesStart = 0;
  if(t.format==="blockPrelim"){
    var remaining = 0;
    (t.blocks||[]).forEach(function(b){ (b.matches||[]).forEach(function(m){ if(!m.winner){ remaining++; } }); });
    var liveCount = 0; (t.blocks||[]).forEach(function(b){ (b.matches||[]).forEach(function(m){ if(m.started && !m.winner) liveCount++; }); });
    var waves = remaining ? Math.ceil(Math.max(0, remaining - Math.min(liveCount, st.tables)) / st.tables) : 0;
    var endMs = remaining ? now + (liveCount ? st.minutes*0.5*60000 : 0) + waves*st.minutes*60000 : now;
    if(t.status==="prelim") rows.push({label:"予選リーグの全試合が終了", start:null, finish:endMs, count:remaining, kind:"prelimEnd"});
    var prelimEnd = (t.status==="prelim") ? endMs : now;
  } else {
    var gIndexNodes = [];
    (t.groups||[]).forEach(function(g, gi){
      if(groupReached(t, g)) return;     // 決勝進出人数まで絞り込み済みのグループは、これ以上試合しない
      if(g.tpl){
        var def = TPL_DEFS[g.tpl], idx = tplIndex(g), cap = cappedRoundsFor(t, g);
        def.order.forEach(function(no){
          var dm = def.matches[no], m = idx[no];
          if(dm.side==="wb" && def.type!=="double" && dm.round>cap) return;     // 決勝進出人数まで絞り込むのに不要なラウンド
          var state = (m.bye || m.dead) ? "bye" : (m.winner ? "done" : (m.started ? "live" : "todo"));
          var deps = [];
          [dm.a, dm.b].forEach(function(src){ var fn = (src.w!=null) ? src.w : src.l; if(fn!=null) deps.push("g"+gi+"_"+fn); });
          nodes.push({id:"g"+gi+"_"+no, deps:deps, state:state, startedAt:m.startedAt, order:order++, group:gi, side:dm.side, round:dm.round, no:no, lbTpl:(def.type!=="single")});
        });
      } else if(g.wb){
        // 従来形式の表: 判明している対戦だけを対象にする
        g.wb.rounds.concat(g.lb ? g.lb.rounds : []).forEach(function(r, ri){
          r.forEach(function(m, mi){
            if(m.bye || !m.a || !m.b) return;
            nodes.push({id:"g"+gi+"_"+m.id, deps:[], state:(m.winner ? "done" : (m.started ? "live" : "todo")), startedAt:m.startedAt, order:order++, group:gi, side:"wb", round:(m.round||ri+1), no:null});
          });
        });
        notes.push("グループ"+(gi+1)+"は従来形式の表のため、判明している対戦だけを対象にした予測です。");
      }
    });
    estimateSchedule(nodes, st.tables, st.minutes, now);
    // 区分(勝者側/敗者側・回戦)ごとの開始・終了見込み(残っている対戦だけ)
    var groupsMulti = (t.groups||[]).length>1;
    var seen = {}, keyOrder = [];
    nodes.forEach(function(n){
      if(n.state==="done" || n.state==="bye") return;
      var key = n.group+"|"+n.side+"|"+n.round;
      if(!seen[key]){ seen[key] = {group:n.group, side:n.side, round:n.round, start:Infinity, finish:0, count:0, live:0}; keyOrder.push(key); }
      var r = seen[key]; r.count++; if(n.state==="live") r.live++;
      r.start = Math.min(r.start, n.start); r.finish = Math.max(r.finish, n.finish);
    });
    var hasLb = hasLoserBracket(t);
    keyOrder.sort(function(a,b){ var x=seen[a], y=seen[b]; return (x.start-y.start) || (x.group-y.group); });
    keyOrder.forEach(function(k){
      var r = seen[k];
      var sideLabel = hasLb ? (r.side==="lb" ? "敗者側 " : "勝者側 ") : "";
      rows.push({label:(groupsMulti ? ("グループ"+(r.group+1)+" ") : "")+sideLabel+r.round+"回戦", start:r.start, finish:r.finish, count:r.count, live:r.live, kind:"round"});
    });
    var prelimEnd = now;
    nodes.forEach(function(n){ if(n.state==="todo" || n.state==="live") prelimEnd = Math.max(prelimEnd, n.finish); });
    if(t.status==="prelim") rows.push({label:"予選が終了(決勝進出者が確定)", start:null, finish:prelimEnd, count:nodes.filter(function(n){ return n.state==="todo" || n.state==="live"; }).length, kind:"prelimEnd"});
  }
  // 決勝トーナメント
  if(t.status==="finals" && t.finals){
    var fn = [], fo = 0;
    t.finals.rounds.forEach(function(round, ri){
      round.forEach(function(m, mi){
        var state = (m.bye || m.dead) ? "bye" : (m.winner ? "done" : (m.started ? "live" : "todo"));
        var deps = ri>0 ? [ "f"+(ri-1)+"_"+(2*mi), "f"+(ri-1)+"_"+(2*mi+1) ] : [];
        fn.push({id:"f"+ri+"_"+mi, deps:deps, state:state, startedAt:m.startedAt, order:fo++, round:ri+1});
      });
    });
    estimateSchedule(fn, st.tables, st.minutes, now);
    var fseen = {}, forder = [];
    fn.forEach(function(n){
      if(n.state==="done" || n.state==="bye") return;
      if(!fseen[n.round]){ fseen[n.round] = {round:n.round, start:Infinity, finish:0, count:0, live:0}; forder.push(n.round); }
      var r = fseen[n.round]; r.count++; if(n.state==="live") r.live++; r.start = Math.min(r.start, n.start); r.finish = Math.max(r.finish, n.finish);
    });
    forder.sort(function(a,b){ return a-b; }).forEach(function(rd){
      var r = fseen[rd];
      rows.push({label:"決勝トーナメント "+roundName(rd, t.finals.totalRounds), start:r.start, finish:r.finish, count:r.count, live:r.live, kind:"finals"});
    });
  } else if(t.status==="prelim" || t.status==="preFinals"){
    var nFin = earlyFinalsExpectedCount(t), size = 1; while(size<nFin) size*=2;
    var total = Math.max(1, Math.round(Math.log2(size)));
    var startMs = (t.status==="prelim") ? prelimEnd : now;
    if(t.status==="preFinals" && t.preFinals){
      var pf = t.preFinals.matches.filter(function(m){ return !m.winner; }).length;
      if(pf){ rows.push({label:"予備決勝戦", start:now, finish:now + Math.ceil(pf/st.tables)*st.minutes*60000, count:pf, live:0, kind:"prelimEnd"}); startMs = now + Math.ceil(pf/st.tables)*st.minutes*60000; }
    }
    var cur = startMs;
    for(var rd=1; rd<=total; rd++){
      var cnt = (rd===1) ? Math.max(0, nFin - size/2) : size/Math.pow(2, rd);
      if(cnt<=0) continue;
      var fin2 = cur + Math.ceil(cnt/st.tables)*st.minutes*60000;
      rows.push({label:"決勝トーナメント "+roundName(rd, total), start:cur, finish:fin2, count:cnt, live:0, kind:"finals", rough:true});
      cur = fin2;
    }
    notes.push("決勝トーナメントは、予選が終わってからすぐ始まるものとした目安です(進出者数は設定の人数で計算)。");
  }
  return {settings:st, rows:rows, notes:notes, now:now};
}
function fmtClock(ms){
  var d = new Date(ms), p = function(n){ return (n<10?"0":"")+n; };
  return p(d.getHours())+":"+p(d.getMinutes());
}
function fmtUntil(ms, now){
  var mins = Math.round((ms-now)/60000);
  if(mins<=0) return "まもなく";
  if(mins<60) return "あと約"+mins+"分";
  return "あと約"+Math.floor(mins/60)+"時間"+(mins%60 ? (mins%60)+"分" : "");
}
function estimateRowsHTML(est){
  var now = est.now;
  return est.rows.length ? est.rows.map(function(r){
    var live = r.live ? ('・試合中'+r.live) : '';
    var startCell = (r.start==null) ? '<span class="hint">-</span>' : ((r.start<=now+30000 ? '<b>まもなく / 開始済み</b>' : '<b>'+fmtClock(r.start)+'頃</b> <span class="hint">('+fmtUntil(r.start, now)+')</span>'));
    return '<tr><td>'+esc(r.label)+(r.rough?' <span class="hint">(目安)</span>':'')+'</td><td>'+startCell+'</td>'+
      '<td><b>'+fmtClock(r.finish)+'頃</b> <span class="hint">('+fmtUntil(r.finish, now)+')</span></td><td class="num">'+(Math.round(r.count*10)/10)+live+'</td></tr>';
  }).join("") : '<tr><td colspan="4" class="hint">予測できる残りの試合がありません。</td></tr>';
}
function renderEstimateModal(){
  if(!estModal) return "";
  var t = findTournament(estModal.tid);
  if(!t) return "";
  var est = buildEstimate(t), st = est.settings, now = est.now;
  var rowsHTML = estimateRowsHTML(est);
  var measuredHint = st.measured ? ('実績: これまでの'+st.measured.count+'試合の平均は約'+st.measured.minutes+'分') : '実績がまだ少ないため、大会作成時に設定した目安('+st.initial+'分)を使っています(試合開始ボタンで開始、結果入力で終了を記録し、3試合以上たまると平均を自動で使います)';
  return '<div class="h2h-overlay"><div class="h2h-card" style="max-width:640px">'+
    '<div class="h2h-head"><h3>⏱ 試合開始の予測時間(概算)</h3><button class="btn btn-sm btn-ghost no-print" type="button" data-action="close-estimate">✕ 閉じる</button></div>'+
    '<p class="hint" style="margin:.2rem 0 .5rem">現在 '+fmtClock(now)+' の進捗を基準に、残りの試合をいつごろ始められるかを概算します(進捗が進むと自動で更新されます)。</p>'+
    '<div class="form-row" style="gap:.8rem;flex-wrap:wrap;align-items:flex-end">'+
      '<div class="field" style="width:8rem"><label>使える台数</label><input type="number" class="num" min="1" max="40" value="'+st.tables+'" data-action="update-est-tables" data-tid="'+t.id+'"></div>'+
      '<div class="field" style="width:11rem"><label>1試合の所要時間(分)</label><input type="number" class="num" min="3" max="180" value="'+st.minutes+'" data-action="update-est-minutes" data-tid="'+t.id+'"></div>'+
      (st.minutesIsAuto ? '<span class="hint" style="align-self:center">'+(st.measured?'(実績から自動)':'(初期の目安)')+'</span>' : '<button class="btn btn-sm btn-ghost" type="button" data-action="reset-est-minutes" data-tid="'+t.id+'">'+(st.measured?'実績の平均に戻す':'初期の目安('+st.initial+'分)に戻す')+'</button>')+
    '</div>'+
    '<p class="hint" style="margin:.3rem 0 .6rem">'+measuredHint+'</p>'+
    matchActualsHTML(t)+
    '<div class="table-wrap"><table class="data"><thead><tr><th>区分</th><th>開始の見込み</th><th>終了の見込み</th><th>残り試合数</th></tr></thead><tbody>'+rowsHTML+'</tbody></table></div>'+
    est.notes.map(function(n){ return '<p class="hint" style="margin:.4rem 0 0">'+esc(n)+'</p>'; }).join("")+
    '<p class="hint" style="margin:.5rem 0 0">※概算です。試合の長さ・休憩・遅れで前後します。「開始の見込み」は、その区分で最初の試合を始められそうな時刻です(前の試合の結果が出てから始められるものとして計算)。</p>'+
  '</div></div>';
}
function renderProgressNav(t){
  var prog = computeTournamentProgress(t);
  if(!prog) return "";
  var pct = prog.total>0 ? Math.round(prog.done/prog.total*100) : 0;
  // 呼び出し用: 名前に、所属とクラスを添えて表示する
  function navPlayerHTML(id, fallbackName){
    var p = id ? getPlayer(id) : null;
    var aff = (p && p.affiliation) ? p.affiliation : "";
    var cl = id ? displayClassOf(t, id) : "";
    var sub = [aff, cl].filter(function(x){ return !!x; }).join("・");
    return '<span class="nav-pl">'+esc(id ? playerName(id) : fallbackName)+(sub ? '<span class="nav-sub">'+esc(sub)+'</span>' : '')+'</span>';
  }
  function matchBtnHTML(info, cls){
    return '<button class="btn btn-sm '+cls+'" type="button" data-action="jump-to-match" data-tid="'+t.id+'" data-scope="'+info.scope+'" data-mid="'+esc(info.mid)+'"'+
      (info.groupIdx!=null?(' data-group="'+info.groupIdx+'"'):'')+
      (info.blockIdx!=null?(' data-block="'+info.blockIdx+'"'):'')+
      (info.side?(' data-side="'+info.side+'"'):'')+
      '>'+navPlayerHTML(info.aId, info.aName)+' <span class="nav-vs">vs</span> '+navPlayerHTML(info.bId, info.bName)+'</button>';
  }
  var priorityToggleHTML = prog.showPriorityToggle
    ? ('<div class="form-row" style="gap:.4rem;align-items:center;margin:0">'+
        '<span class="hint">優先:</span>'+
        '<button class="btn btn-sm'+(prog.priority==="wb"?" btn-felt":" btn-ghost")+'" type="button" data-action="set-nav-priority" data-tid="'+t.id+'" data-priority="wb">勝者側優先</button>'+
        '<button class="btn btn-sm'+(prog.priority==="lb"?" btn-felt":" btn-ghost")+'" type="button" data-action="set-nav-priority" data-tid="'+t.id+'" data-priority="lb">敗者側優先</button>'+
      '</div>')
    : '';
  var nextHTML = prog.nextList.length

function lbRoundSource(prelim, i){
  if(i % 2 === 1){
    if(i===1){
      var wbR1 = prelim.wb.rounds[0];
      if(!wbR1 || !roundIsDone(wbR1)) return null;
      return wbR1.filter(function(m){ return !m.bye; }).map(function(m){ return m.winner===m.a?m.b:m.a; });
    }
    var prevLB = prelim.lb.rounds[i-2];
    if(!prevLB || !roundIsDone(prevLB)) return null;
    return prevLB.map(function(m){ return m.winner; }).filter(function(x){ return x; });
  }
  var prevLB2 = prelim.lb.rounds[i-2];
  if(!prevLB2 || !roundIsDone(prevLB2)) return null;
  var wbRoundIdx = (i/2+1)-1;
  var wbRound = prelim.wb.rounds[wbRoundIdx];
  if(!wbRound || !roundIsDone(wbRound)) return null;
  var lbWinners = prevLB2.map(function(m){ return m.winner; }).filter(function(x){ return x; });
  var wbLosers = wbRound.filter(function(m){ return !m.bye; }).map(function(m){ return m.winner===m.a?m.b:m.a; });
  // クロスオーバー方式: 敗者復活勝者と新規降格者を1対1で組ませる(反転させて同じ山出身同士の再戦を避ける)
  var wbLosersCrossed = wbLosers.slice().reverse();
  var merged = [];
  var n = Math.max(lbWinners.length, wbLosersCrossed.length);
  for(var k=0; k<n; k++){
    if(k<lbWinners.length) merged.push(lbWinners[k]);
    if(k<wbLosersCrossed.length) merged.push(wbLosersCrossed[k]);
  }
  return merged;
}
function advanceLB(prelim, maxRounds){
  var guard=0;
  while(guard<40){
    guard++;
    if(maxRounds!=null && prelim.lb.rounds.length>=maxRounds) break;
    var nextIdx = prelim.lb.rounds.length+1;
    var source = lbRoundSource(prelim, nextIdx);
    if(!source) break;
    if(source.length===0) break;
    var matches=[];
    for(var idx=0; idx<source.length; idx+=2){
      var a=source[idx], b=source[idx+1];
      if(b===undefined){
        matches.push({id:"lb_r"+nextIdx+"_m"+(idx/2), round:nextIdx, a:a, b:null, winner:a, deltas:null, bye:true, score:{a:null,b:null}});
      } else {
        matches.push({id:"lb_r"+nextIdx+"_m"+(idx/2), round:nextIdx, a:a, b:b, winner:null, deltas:null, bye:false, score:{a:null,b:null}});
      }
    }

  }

// 勝者側の各ラウンドの敗者が敗者復活ブロックのどのラウンド・何番目の枠に入るかを、
// 実際の結果を待たず組み合わせの形(不戦勝の有無・人数)だけから静的に予測する。
// ラウンド2回戦以降は不戦勝が発生しないため、非不戦勝の試合数はラウンド0の人数から一意に決まる。
function computeLbSlotProjections(g, t, cappedWbRounds){
  var proj = {};
  proj.__lbMatchCount = {};
  if(g.tpl) return proj;
  if(!hasLoserBracket(t) || !g.wb || !g.wb.rounds || !g.wb.rounds[0]) return proj;
  var r0 = g.wb.rounds[0];
  var r0len = r0.length;
  function nonByeCountAtRound(ri){
    if(ri===0) return r0.filter(function(m){ return !m.bye; }).length;
    return Math.round(r0len / Math.pow(2, ri));
  }
  var fullMaxWbRoundIdx = (t.prelimType==="round1Double") ? 0 : (g.wb.totalRounds-1);
  var maxWbRoundIdx = (cappedWbRounds!=null) ? Math.min(fullMaxWbRoundIdx, cappedWbRounds-1) : fullMaxWbRoundIdx;
  var lbMatchCount = proj.__lbMatchCount;
  var i=1, guard=0;
  while(guard<60){
    guard++;
    var source;
    if(i===1){
      var n0 = nonByeCountAtRound(0);
      if(n0===0) break;
      source = [];
      for(var k=0;k<n0;k++) source.push({ri:0, idx:k});
    } else if(i%2===1){
      var prevCount = lbMatchCount[i-1];
      if(!prevCount) break;
      source = [];
      for(var k2=0;k2<prevCount;k2++) source.push({lbWinner:true});
    } else {
      var wbRoundIdx = i/2;
      var prevCount2 = lbMatchCount[i-1];
      if(prevCount2==null) break;
      if(wbRoundIdx>maxWbRoundIdx) break;
      var nB = nonByeCountAtRound(wbRoundIdx);
      var lbTokens=[]; for(var k3=0;k3<prevCount2;k3++) lbTokens.push({lbWinner:true});
      var wbTokens=[]; for(var k4=0;k4<nB;k4++) wbTokens.push({ri:wbRoundIdx, idx:k4});
      var wbTokensCrossed = wbTokens.slice().reverse();
      source=[];
      var n = Math.max(lbTokens.length, wbTokensCrossed.length);
      for(var k5=0;k5<n;k5++){
        if(k5<lbTokens.length) source.push(lbTokens[k5]);
        if(k5<wbTokensCrossed.length) source.push(wbTokensCrossed[k5]);
      }
    }
    if(!source || !source.length) break;
    var matchCount = Math.ceil(source.length/2);
    lbMatchCount[i] = matchCount;
    for(var p=0;p<source.length;p++){
      var tok = source[p];
      if(tok.ri!=null){
        if(!proj[tok.ri]) proj[tok.ri]={};
        proj[tok.ri][tok.idx] = {lbRound:i, no: Math.floor(p/2)+1};
      }
    }
    var isLastNeeded = (i===1 && maxWbRoundIdx===0) || (i%2===0 && (i/2)===maxWbRoundIdx);
    if(isLastNeeded) break;
    i++;
  }
  return proj;
}
function findElimMatch(g, side, mid){
  var rounds = side==="wb" ? g.wb.rounds : g.lb.rounds;
  var found=null;
  rounds.forEach(function(r){ r.forEach(function(m){ if(m.id===mid) found=m; }); });
  return found;
}
// ---------- WBの先取り(そのラウンドが全部揃わなくても、両者決定済みの対戦は先に対戦開始・印刷できるようにする) ----------
// 対象は勝者側ブラケットの2回戦以降すべて(決勝トーナメント・敗者復活ブロックは対象外)
function parseWbFuturePos(mid){
  var m = /^(?:ph_)?r(\d+)_m(\d+)$/.exec(mid||"");
  return m ? {round:Number(m[1]), mi:Number(m[2])} : null;

function wbMatchDecided(m){
  return !!(m && (m.winner || (m.bye && !m.a && !m.b)));

// roundIdx(1始まり)・組番号(0始まり)の対戦を、本物のデータがあればそれを、
// 無ければ1つ前のラウンドの該当ペアを再帰的にたどって組み立てた仮対戦を返す(どちらも決まっていなければnull)。
// 片方だけ決まっている場合(例: 1回戦シードの不戦勝)は、対戦相手が未定のまま
// 判明している選手だけをその枠に先出しするプレビュー対戦を返す(対戦開始・得点入力はできない)。
function virtualWbMatch(g, roundIdx, mi){
  if(roundIdx<=1){
    return (g.wb.rounds[0] && g.wb.rounds[0][mi]) || null;
  }
  var realRound = g.wb.rounds[roundIdx-1];
  if(realRound && realRound[mi]) return realRound[mi];
  var m1 = virtualWbMatch(g, roundIdx-1, mi*2);
  var m2 = virtualWbMatch(g, roundIdx-1, mi*2+1);
  var d1 = wbMatchDecided(m1), d2 = wbMatchDecided(m2);
  if(!d1 && !d2) return null;
  var a = d1 ? m1.winner : null, b = d2 ? m2.winner : null;
  if(!d1 || !d2){
    return {
      id: "ph_r"+roundIdx+"_m"+mi, round:roundIdx, a:a, b:b, bye:false,
      winner:null, deltas:null, score:{a:null,b:null}, started:false,
      preview:true, wbFuture:false
    };
  }
  var stored = (g.futureWbByPos && g.futureWbByPos[roundIdx+"_"+mi]) || null;
  var bye = (!a || !b);
  return {
    id: "ph_r"+roundIdx+"_m"+mi, round:roundIdx, a:a, b:b, bye:bye,
    winner: bye ? (a||b) : (stored ? stored.winner : null),
    deltas: bye ? null : (stored ? stored.deltas : null),
    fmtSnap: stored ? (stored.fmtSnap||null) : null,
    score:{a:null,b:null},
    started: stored ? !!stored.started : false,
    preview:false, wbFuture:true
  };
