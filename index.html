// 本物のデータをたどれるだけ先まで組み立てた、表示用のラウンド配列を返す(padBracketRoundsのWB版)
function buildWbDisplayRounds(g, totalRoundsToShow){
  if(g.tpl) return totalRoundsToShow!=null ? g.wb.rounds.slice(0, totalRoundsToShow) : g.wb.rounds;
  var rounds = g.wb.rounds.slice();
  for(var ri=rounds.length; ri<totalRoundsToShow; ri++){
    var roundNum = ri+1;
    var prevLen = rounds[ri-1].length;
    var n = Math.max(1, Math.ceil(prevLen/2));
    var placeholder = [];
    for(var mi=0; mi<n; mi++){
      var virt = virtualWbMatch(g, roundNum, mi);
      placeholder.push(virt || {id:"ph_r"+roundNum+"_m"+mi, round:roundNum, a:null, b:null, winner:null, deltas:null, bye:false, preview:true, score:{a:null,b:null}});
    }
    rounds.push(placeholder);
  }
  return rounds;
}
// この枠(roundIdx・mi)より先の先取り結果を再帰的に取り消す(ポイントも戻す)
function retractFutureWbFrom(g, roundIdx, mi){
  if(!g.futureWbByPos) return;
  var key = roundIdx+"_"+mi;
  var entry = g.futureWbByPos[key];
  if(!entry) return;
  retractFutureWbFrom(g, roundIdx+1, Math.floor(mi/2));
  if(entry.deltas) entry.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
  delete g.futureWbByPos[key];
}
// 本物になったラウンドに、先取りしていた結果があれば引き継ぐ
function mergeFutureWbIntoReal(g){
  if(!g.futureWbByPos || !Object.keys(g.futureWbByPos).length) return;
  g.wb.rounds.forEach(function(round, ri){
    var roundNum = ri+1;
    round.forEach(function(m, mi){
      var key = roundNum+"_"+mi;
      var stored = g.futureWbByPos[key];
      if(stored && !m.bye && !m.winner){
        m.winner = stored.winner; m.deltas = stored.deltas; m.fmtSnap = stored.fmtSnap || null;
        delete g.futureWbByPos[key];

    });
  });

function correctElimMatch(t, g, side, matchId){
  unwindFinalsIfNeeded(t);

    var tm = findElimMatch(g, side, matchId);

    recomputeElimGroup(t, g);

  }
  if(side==="wb"){
    var match = findElimMatch(g, "wb", matchId);
    if(!match){
      // 本物のラウンドとしては見つからない → 先取りしている対戦(まだ本物になっていない対戦)の取消
      var parsedUndo = parseWbFuturePos(matchId);
      if(parsedUndo) retractFutureWbFrom(g, parsedUndo.round, parsedUndo.mi);
      advanceElimGroup(t, g);
      recomputeElimGroup(t, g);
      return;
    }
    if(match.bye || !match.winner) return;
    var targetRound = match.round;
    if(hasLoserBracket(t)){
      var affectedLbFrom = targetRound===1 ? 1 : 2*(targetRound-1);
      var keepLbCount = affectedLbFrom - 1;
      while(g.lb.rounds.length > keepLbCount){
        var poppedLb = g.lb.rounds.pop();
        poppedLb.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
      }
    }
    while(g.wb.rounds.length > targetRound){
      var poppedWb = g.wb.rounds.pop();
      poppedWb.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
    }
    if(g.futureWbByPos){

      // (それより先の本物のラウンドを丸ごと巻き戻したのと同じ扱いにするため)
      Object.keys(g.futureWbByPos).forEach(function(key){
        if(Number(key.split("_")[0]) > targetRound){
          var entry = g.futureWbByPos[key];
          if(entry.deltas) entry.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
          delete g.futureWbByPos[key];
        }
      });
    }

    var matchLb = findElimMatch(g, "lb", matchId);

      var popped2 = g.lb.rounds.pop();

    }
    undoMatchDeltas(matchLb);
  }

  recomputeElimGroup(t, g);

function finalizeElimPrelim(t){
  var advancers=[];
  t.groups.forEach(function(g){
    if(hasLoserBracket(t) && t.advancePerGroupWB!=null){
      var wbAlive = g.wb.entrants.filter(function(id){ return (g.losses[id]||0)===0; });
      var lbAlive = g.wb.entrants.filter(function(id){ return (g.losses[id]||0)===1 && !g.eliminated[id]; });
      var wbRanked = wbAlive.slice().sort(function(a,b){ return entryPointsOf(t, b)-entryPointsOf(t, a); }).slice(0, t.advancePerGroupWB);
      var lbRanked = lbAlive.slice().sort(function(a,b){ return entryPointsOf(t, b)-entryPointsOf(t, a); }).slice(0, t.advancePerGroupLB);
      g.advanced = wbRanked.concat(lbRanked);
      advancers = advancers.concat(g.advanced);
    } else {
      var alive = g.wb.entrants.filter(function(id){ return !g.eliminated[id]; });
      var ranked = alive.slice().sort(function(a,b){ return entryPointsOf(t, b)-entryPointsOf(t, a); });
      if(ranked.length > t.advancePerGroup) ranked = ranked.slice(0, t.advancePerGroup);
      g.advanced = ranked;
      advancers = advancers.concat(ranked);
    }

function buildPreFinalsMatches(atRiskIds){
  var matches = [];
  for(var i=0;i<atRiskIds.length;i+=2){
    matches.push({ id:"pf_m"+(i/2), a:atRiskIds[i], b:atRiskIds[i+1], winner:null, deltas:null, score:{a:null,b:null} });
  }
  return matches;

function preFinalsAtRiskPairing(ranked, overflow){
  // ranked: ポイント降順の全選出者。下位 overflow*2 名を「上位(安全圏に近い) vs 下位」でクロス配置する
  var atRiskCount = overflow*2;
  var atRisk = ranked.slice(ranked.length-atRiskCount);
  var paired = [];
  for(var i=0;i<overflow;i++){
    paired.push(atRisk[i]);
    paired.push(atRisk[atRiskCount-1-i]);
  }
  return paired;

function startPreFinals(t, advancers){
  var overflow = advancers.length - t.finalsTargetSize;
  if(overflow*2 > advancers.length) overflow = Math.floor(advancers.length/2);
  if(overflow<=0){ applyAdvanceBonusAndBuildFinals(t, advancers); return; }
  var ranked = advancers.slice().sort(function(a,b){ return entryPointsOf(t,b)-entryPointsOf(t,a); });
  var byeIds = ranked.slice(0, ranked.length - overflow*2);
  var atRiskPaired = preFinalsAtRiskPairing(ranked, overflow);
  t.preFinalsByeIds = byeIds;
  t.preFinalsPoolIds = advancers;
  t.preFinalsDrawCards = {};
  t.preFinals = { matches: buildPreFinalsMatches(atRiskPaired) };

}
function preFinalsAllDone(t){
  return !!(t.preFinals && t.preFinals.matches.every(function(m){ return !!m.winner; }));
}
function completePreFinalsAndBuildFinals(t){
  var winners = t.preFinals.matches.map(function(m){ return m.winner; }).filter(Boolean);
  var finalists = (t.preFinalsByeIds||[]).concat(winners);
  t.preFinals = null;
  t.preFinalsByeIds = null;
  t.preFinalsPoolIds = null;
  t.preFinalsDrawCards = null;
  applyAdvanceBonusAndBuildFinals(t, finalists);
}
function preserveScheduleTimes(oldRounds, newRounds){
  if(!oldRounds || !newRounds) return;
  var times = {};
  oldRounds.forEach(function(round){ round.forEach(function(m){ if(m.startTime) times[m.id] = m.startTime; }); });
  newRounds.forEach(function(round){ round.forEach(function(m){ if(times[m.id]) m.startTime = times[m.id]; }); });
}

    Object.keys(g.futureWbByPos).forEach(function(key){

      if(entry.deltas) entry.deltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
    });
    g.futureWbByPos = {};
  }
  var oldWbRounds = g.wb ? g.wb.rounds : null;
  var tplKey = tplKeyFor(t, g.targetSize);
  if(tplKey){
    var tdef = TPL_DEFS[tplKey];
    if(g.slots.length!==tdef.slotCount){
      g.slots = tplDefaultSlots(tplKey, g.slots.filter(function(x){ return x; }), t.entries);
    }
    tplBuildGroup(t, g, tplKey);
    preserveScheduleTimes(oldWbRounds, g.wb.rounds);
  } else {
    delete g.tpl;
    g.wb = buildBracketFromSlots(g.slots);
    preserveScheduleTimes(oldWbRounds, g.wb.rounds);
    g.lb = hasLoserBracket(t) ? {rounds:[]} : null;
  }
  g.losses={}; g.eliminated={}; g.penaltyDeltas={};
  g.threshold = hasLoserBracket(t) ? 2 : 1;
  advanceElimGroup(t, g);
  recomputeElimGroup(t, g);
}

// ---------- 予選の途中からの決勝トーナメント(先行編成) ----------
// 予選が終わる前に、決勝トーナメントの枠へ選手を選んで入れ、1回戦の試合を開始・結果入力できる。
//  - 先行編成中は t.finals があり、大会の状態は「予選中」のまま(t.status==="prelim")。空き枠は不戦ではなく「未定」として扱う
//  - 予選を確定すると、先に入れた選手と結果はそのまま残し、空いている枠へ残りの進出者を入れる(mergeEarlyFinals)
function isEarlyFinals(t){
  return !!(t && t.finals && (t.status==="prelim" || t.status==="preFinals"));
}
function finalsInteractive(t){
  return !!(t && t.finals && (t.status==="finals" || isEarlyFinals(t)));
}
// 決勝の枠に入れる選手の候補(通常は決勝進出者、先行編成中は決勝進出が確定している選手のみ)
function finalsPoolIds(t){
  return isEarlyFinals(t) ? confirmedFinalistIds(t) : t.finalists;
}
// 予選がまだ終わっていない時点で、決勝トーナメントへの進出が確定している選手のid
//  ②予選リーグ: ブロックの全対戦が終わったブロックの上位進出者(境界が同数の場合は手動選択済みのときだけ確定)
//  ①トーナメント戦: 勝者側の最終ラウンドの勝者(projectedElimAdvancersForGroup)と、グループが進出人数まで絞り込まれたときの勝ち残り(敗者復活側を含む)
//  予備決勝戦が必要な構成(複数グループで決勝進出人数が少ない)では、全グループが絞り込まれてから予備決勝戦の不戦者・勝者だけが確定
function confirmedFinalistIds(t){
  var ids = [];
  function add(id){ if(id && ids.indexOf(id)<0) ids.push(id); }
  if(t.status==="preFinals"){
    (t.preFinalsByeIds||[]).forEach(add);
    ((t.preFinals && t.preFinals.matches) || []).forEach(function(m){ add(m.winner); });
    return ids;
  }
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(block){
      var matches = block.matches || [];
      if(!matches.every(function(m){ return !!m.winner; })) return;
      var tie = blockTieInfo(t, block, t.advancePerBlock);
      var standings = blockStandings(t, block).map(function(s){ return s.id; });
      if(tie){
        var chosen = ((t.tieBreakSelections && t.tieBreakSelections[block.index]) || []).filter(function(id){ return tie.tiedIds.indexOf(id)>=0; });
        if(chosen.length < tie.needCount) return;   // 同数でどちらが進出するか未選択 → 確定していない
        tie.guaranteedIds.concat(chosen.slice(0, tie.needCount)).forEach(add);
      } else {
        standings.slice(0, t.advancePerBlock).forEach(add);
      }
    });
    return ids;
  }
  var groups = t.groups || [];
  var lbSplit = hasLoserBracket(t) && t.advancePerGroupWB!=null;
  var perGroup = lbSplit ? (t.advancePerGroupWB + (t.advancePerGroupLB||0)) : (t.advancePerGroup||1);
  var needPreFinals = groups.length>1 && t.finalsTargetSize!=null && groups.length*perGroup > t.finalsTargetSize;
  function reachedAdvancers(g){
    if(lbSplit){
      var wbAlive = g.wb.entrants.filter(function(id){ return (g.losses[id]||0)===0; });
      var lbAlive = g.wb.entrants.filter(function(id){ return (g.losses[id]||0)===1 && !g.eliminated[id]; });
      var byPts = function(a,b){ return entryPointsOf(t, b)-entryPointsOf(t, a); };
      return wbAlive.sort(byPts).slice(0, t.advancePerGroupWB).concat(lbAlive.sort(byPts).slice(0, t.advancePerGroupLB));
    }
    var alive = g.wb.entrants.filter(function(id){ return !g.eliminated[id]; });
    return alive.sort(function(a,b){ return entryPointsOf(t, b)-entryPointsOf(t, a); }).slice(0, t.advancePerGroup);
  }
  if(needPreFinals){
    if(!groups.every(function(g){ return groupReached(t, g); })) return ids;
    var all = [];
    groups.forEach(function(g){ all = all.concat(reachedAdvancers(g)); });
    if(all.length > t.finalsTargetSize){
      var overflow = Math.min(all.length - t.finalsTargetSize, Math.floor(all.length/2));
      var ranked = all.slice().sort(function(a,b){ return entryPointsOf(t,b)-entryPointsOf(t,a); });
      ranked.slice(0, ranked.length - overflow*2).forEach(add);   // 予備決勝戦を免除される選手のみ確定
    } else {
      all.forEach(add);
    }
    return ids;
  }
  groups.forEach(function(g){
    projectedElimAdvancersForGroup(t, g).forEach(add);
    if(groupReached(t, g)) reachedAdvancers(g).forEach(add);
  });
  return ids;
}
// 先行編成中の決勝の枠から、進出が確定していない選手を外す(予選結果の取消などで確定でなくなった場合)。
// 外した選手が出ていた対戦の結果と、その結果に依存する後のラウンドの結果は取り消す
function pruneEarlyFinals(t){
  if(!isEarlyFinals(t)) return;
  var ok = confirmedFinalistIds(t), f = t.finals, changed = false;
  f.rounds[0].forEach(function(m){
    ["a","b"].forEach(function(k){
      if(m[k] && ok.indexOf(m[k])<0){
        if(m.winner && !m.bye){
          var loserId = m.winner===m.a ? m.b : m.a;
          if(loserId && f.eliminatedRound) delete f.eliminatedRound[loserId];
          undoMatchDeltas(m);
          m.score = {a:null,b:null}; m.started = false;
        }
        m[k] = null;
        changed = true;
      }
    });
  });
  if(!changed) return;
  f.entrants = finalsSlotsArray(t).filter(Boolean);
  finalsSyncBracket(f, true);
}
// ---------- 決勝トーナメント: 全ラウンドの対戦を最初から作り、選手が揃った対戦から順に進められる ----------
// 各ラウンドの対戦は、前のラウンドの2試合の勝者がそろった時点で出場者が決まり、他の試合の終了を待たずに開始・結果入力できる。
// 相手が空き(不戦)の対戦は、勝ち上がる選手が決まり次第そのまま次へ進む。early=true(予選の途中の先行編成)では、空き枠は不戦ではなく「未定」
function finalsEmptyMatch(round, mi){
  return {id:"r"+round+"_m"+mi, round:round, a:null, b:null, winner:null, deltas:null, bye:false, score:{a:null,b:null}};
}
// 出場者・勝者から各対戦の出場者・不戦・待ち状態を再計算する(結果と矛盾する入力済みの結果は取り消す)
function finalsSyncBracket(f, early){
  for(var r=f.rounds.length; r<f.totalRounds; r++){   // 従来の「ラウンドごとに作る」形式で保存された大会を、全ラウンドが揃った形へ変換
    var cnt = Math.max(1, Math.ceil(f.rounds[r-1].length/2)), arr = [];
    for(var q=0;q<cnt;q++) arr.push(finalsEmptyMatch(r+1, q));
    f.rounds.push(arr);
  }
  f.rounds.forEach(function(round, ri){
    round.forEach(function(m, mi){
      if(ri===0){
        if(m.winner && !m.bye){ m.dead = false; m.preview = false; return; }
        m.bye = !early && (!m.a || !m.b);
        m.dead = m.bye && !m.a && !m.b;
        m.winner = m.bye ? (m.a || m.b || null) : null;
        if(m.bye) m.deltas = null;
        m.preview = !m.bye && (!m.a || !m.b);
        return;
      }
      var fa = f.rounds[ri-1][2*mi], fb = f.rounds[ri-1][2*mi+1];
      var aId = (fa && !fa.dead && fa.winner) ? fa.winner : null, bId = (fb && !fb.dead && fb.winner) ? fb.winner : null;
      if(m.winner && !m.bye && (!aId || !bId || (m.winner!==aId && m.winner!==bId))){
        var loserOld = m.winner===m.a ? m.b : m.a;
        if(loserOld && f.eliminatedRound) delete f.eliminatedRound[loserOld];
        undoMatchDeltas(m); m.score = {a:null,b:null}; m.started = false;
      }
      m.a = aId; m.b = bId;
      m.deadA = !!(fa && fa.dead); m.deadB = !!(fb && fb.dead);
      m.dead = m.deadA && m.deadB;
      m.bye = m.deadA || m.deadB;
      if(m.bye){
        if(m.deltas) undoMatchDeltas(m);
        m.winner = m.dead ? null : (m.deadA ? bId : aId);
        m.deltas = null;
        m.preview = false;
      } else {
        m.preview = !aId || !bId;
      }
    });
  });
}
function finalsSync(t){
  if(t && t.finals) finalsSyncBracket(t.finals, isEarlyFinals(t));
}
function buildFinalsBracket(slots, early){
  var round1 = [];
  for(var i=0;i<slots.length;i+=2){
    var m = finalsEmptyMatch(1, i/2); m.a = slots[i] || null; m.b = slots[i+1] || null; round1.push(m);
  }
  var totalRounds = Math.max(1, Math.round(Math.log2(slots.length)));
  var bracket = {totalRounds:totalRounds, rounds:[round1], eliminatedRound:{}, entrants:slots.filter(function(x){ return x; })};
  finalsSyncBracket(bracket, !!early);
  return bracket;
}
function earlyFinalsExpectedCount(t){
  if(t.format==="blockPrelim") return Math.max(2, (t.blocks||[]).length * (t.advancePerBlock||1));
  if(t.finalsTargetSize!=null) return Math.max(2, t.finalsTargetSize);
  return Math.max(2, (t.groups||[]).length * (t.advancePerGroup||1));
}
function createEarlyFinals(t){
  if(t.finals || t.status!=="prelim") return;
  var count = earlyFinalsExpectedCount(t), size = 1; while(size<count) size*=2;
  var known = confirmedFinalistIds(t);   // 進出が確定している選手だけを最初から枠に入れる
  var slots = known.length ? computeDefaultBracketSlots(known, size, t.entries) : new Array(size).fill(null);
  t.finals = buildFinalsBracket(slots, true);
  t.finalists = null;
}
function cancelEarlyFinals(t){
  if(!isEarlyFinals(t)) return;
  t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  t.finals = null;
  t.finalists = null;
}
// 予選確定時: 先行編成の決勝に、残りの進出者を空き枠へ入れて(先に入れた選手・結果は残す)通常の決勝トーナメントにする
function mergeEarlyFinals(t, advancers){
  var slots = finalsSlotsArray(t), size = slots.length;
  var placed = slots.filter(function(x){ return x; });
  var fresh = advancers.filter(function(id){ return placed.indexOf(id)<0; });
  var empties = slots.filter(function(x){ return !x; }).length;
  if(fresh.length > empties){
    // 枠が足りない場合だけ、先に入力した決勝の結果を取り消し、全員で組み直す
    t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
    var all = placed.concat(fresh);
    t.finalists = all;
    t.finals = buildFinalsBracket(computeDefaultBracketSlots(all, null, t.entries), false);
    t.status = "finals";
    alert("決勝トーナメントの枠が足りなかったため、先に入力した決勝の結果を取り消して組み直しました。");
    return;
  }
  var ideal = computeDefaultBracketSlots(placed.concat(fresh), size, t.entries);
  fresh.slice().sort(seedCompare(t.entries)).forEach(function(id){
    var want = ideal.indexOf(id), pos = (want>=0 && !slots[want]) ? want : -1;
    if(pos<0){ for(var i=0;i<slots.length;i++){ if(!slots[i]){ pos = i; break; } } }
    slots[pos] = id;
  });
  t.finals.rounds[0].forEach(function(m, mi){
    if(m.winner && !m.bye) return;   // 結果が入力済みの対戦は両者が決まっている
    m.a = slots[mi*2] || null; m.b = slots[mi*2+1] || null;
  });
  t.finals.entrants = slots.filter(function(x){ return x; });
  t.finalists = t.finals.entrants.slice();
  t.status = "finals";
  finalsSync(t);
}
// 予選が全て終わった(②全ブロックの全試合が終了し同点の進出者も選択済み / ①全グループが進出人数まで絞り込まれた)大会は、
// 「予選を締める」操作なしで自動的に決勝進出者を確定する(先行編成した決勝があれば、その結果を残したまま残りの進出者が入る)
function prelimIsComplete(t){
  if(t.status!=="prelim") return false;
  if(t.format==="blockPrelim"){
    var blocks = t.blocks || [];
    if(!blocks.length) return false;
    return blocks.every(function(b){
      if(!(b.matches && b.matches.length && b.matches.every(function(m){ return !!m.winner; }))) return false;
      var tie = blockTieInfo(t, b, t.advancePerBlock);
      if(!tie) return true;
      var chosen = ((t.tieBreakSelections && t.tieBreakSelections[b.index]) || []).filter(function(id){ return tie.tiedIds.indexOf(id)>=0; });
      return chosen.length >= tie.needCount;
    });
  }
  var groups = t.groups || [];
  return groups.length>0 && groups.every(function(g){ return !!g.wb && groupReached(t, g); });
}
function autoFinalizePrelims(){
  var changed = false;
  (state.tournaments||[]).forEach(function(t){
    if(!t || !prelimIsComplete(t)) return;
    try{
      if(t.format==="blockPrelim") finalizeBlockPrelim(t); else finalizeElimPrelim(t);
      changed = true;
    }catch(e){}
  });
  if(changed) saveState();
}
// 予選の途中から始めた決勝トーナメントで決勝まで決まったとき: 予選の残りは行わず、決勝の出場者を進出者として大会を終える
function completeEarlyFinals(t){
  var ids = finalsSlotsArray(t).filter(Boolean);
  var bonus = usePointsAndSets(t) ? (state.settings.bonuses.finalsAdvance || 0) : 0;
  t.advanceBonusApplied = t.advanceBonusApplied || {};
  ids.forEach(function(id){
    if(!t.advanceBonusApplied[id] && bonus){ var p = getPlayer(id); if(p){ p.points += bonus; t.advanceBonusApplied[id] = bonus; } }
  });
  t.finalists = ids;
  t.earlyCompleted = true;
  t.status = "finals";
  finalsSync(t);
}
// 予選の途中から始めた決勝の結果を取り消すときは、予選中・先行編成の状態へ戻す
function restoreEarlyIfNeeded(t){
  if(!t.earlyCompleted || t.status!=="finals") return;
  if(t.advanceBonusApplied){
    Object.keys(t.advanceBonusApplied).forEach(function(id){ var p = getPlayer(id); if(p) p.points -= t.advanceBonusApplied[id]; });
    t.advanceBonusApplied = {};
  }
  t.finalists = null;
  t.earlyCompleted = false;
  t.status = "prelim";
}
function applyAdvanceBonusAndBuildFinals(t, advancers){
  var bonus = usePointsAndSets(t) ? (state.settings.bonuses.finalsAdvance || 0) : 0;
  t.advanceBonusApplied = t.advanceBonusApplied || {};
  advancers.forEach(function(id){
    if(!t.advanceBonusApplied[id] && bonus){
      var p=getPlayer(id); if(p){ p.points += bonus; t.advanceBonusApplied[id]=bonus; }
    }
  });
  if(isEarlyFinals(t)){ mergeEarlyFinals(t, advancers); return; }
  t.earlyCompleted = false;
  t.finalists = advancers;
  t.finals = buildFinalsBracket(computeDefaultBracketSlots(advancers, null, t.entries), false);
  t.status = "finals";
}

function finalizeTournamentResult(t){
  var lastRound = t.finals.rounds[t.finals.rounds.length-1];
  var finalMatch = lastRound[0];
  var championId = finalMatch.winner;
  var runnerUpId = championId===finalMatch.a ? finalMatch.b : finalMatch.a;
  var bonuses = state.settings.bonuses;
  var finishDeltas=[];
  function progressRank(id){
    if(id===championId) return Infinity;
    var r = t.finals.eliminatedRound[id];
    return (r===undefined) ? -1 : r;
  }
  if(usePointsAndSets(t)){
    var champAmt = tierBelowB(t, championId) ? bonuses.championBelowB : bonuses.champion;
    if(champAmt){ getPlayer(championId).points += champAmt; finishDeltas.push({playerId:championId, amount:champAmt, reason:BONUS_LABELS.champion}); }
    if(runnerUpId){
      var ruAmt = tierBelowB(t, runnerUpId) ? bonuses.runnerUpBelowB : bonuses.runnerUp;
      if(ruAmt){ getPlayer(runnerUpId).points += ruAmt; finishDeltas.push({playerId:runnerUpId, amount:ruAmt, reason:BONUS_LABELS.runnerUp}); }
    }
    var entrants = t.finals.entrants;
    var bTier = entrants.filter(function(id){ return tierOf(entryClassOf(t, id))==="B"; });
    var cTier = entrants.filter(function(id){ return tierOf(entryClassOf(t, id))==="C"; });
    function pickBest(list){
      if(!list.length) return null;
      return list.slice().sort(function(a,b){
        var pr = progressRank(b)-progressRank(a);
        if(pr!==0) return pr;
        return entryPointsOf(t, b)-entryPointsOf(t, a);
      })[0];
    }
    var bestB = pickBest(bTier);
    if(bestB && bonuses.bestBInFinals){ getPlayer(bestB).points += bonuses.bestBInFinals; finishDeltas.push({playerId:bestB, amount:bonuses.bestBInFinals, reason:BONUS_LABELS.bestBInFinals}); }
    var bestC = pickBest(cTier);
    if(bestC && bonuses.bestCInFinals){ getPlayer(bestC).points += bonuses.bestCInFinals; finishDeltas.push({playerId:bestC, amount:bonuses.bestCInFinals, reason:BONUS_LABELS.bestCInFinals}); }
  }
  t.finishDeltas = finishDeltas;
  t.championId = championId;
  t.runnerUpId = runnerUpId;
  if(usePointsAndSets(t)){
    t.previousChampionBefore = (state.previousChampionId===undefined) ? null : state.previousChampionId;
    state.previousChampionId = championId;
  }
  t.status = "completed";
}
function reverseFinalize(t){
  if(!t.finishDeltas) { return; }
  t.finishDeltas.forEach(function(d){ var p=getPlayer(d.playerId); if(p) p.points -= d.amount; });
  if(t.previousChampionBefore!==undefined){
    state.previousChampionId = t.previousChampionBefore;
  }
  t.finishDeltas=null; t.championId=null; t.runnerUpId=null; t.previousChampionBefore=undefined;
}
function correctBracketMatch(t, matchId){
  var finals = t.finals;
  var match=null, ri0=-1, mi0=-1;
  finals.rounds.forEach(function(r,ri){ r.forEach(function(m,mi){ if(m.id===matchId){ match=m; ri0=ri; mi0=mi; } }); });
  if(!match || match.bye || !match.winner) return;
  if(t.status==="completed"){ reverseFinalize(t); t.status="finals"; }
  restoreEarlyIfNeeded(t);
  // この対戦と、その結果に依存する後の対戦(勝ち上がり先)の結果をまとめて取り消す
  var ri = ri0, mi = mi0;
  while(ri < finals.rounds.length){
    var m = finals.rounds[ri][mi];
    if(m && m.winner && !m.bye){
      var loserId = m.winner===m.a ? m.b : m.a;
      if(loserId) delete finals.eliminatedRound[loserId];
      undoMatchDeltas(m);
      m.score = {a:null,b:null}; m.started = false;
    }
    ri++; mi = Math.floor(mi/2);
  }
  finalsSync(t);
}
function unwindFinalsIfNeeded(t){
  if(!t.finals) return;
  if(isEarlyFinals(t)){   // 予選中に先行編成した決勝は、予選側の変更では取り消さない(「先行編成を取り消す」で消す)。ただし進出が確定でなくなった選手は枠から外す
    pruneEarlyFinals(t);
    return;
  }
  if(t.status==="completed") reverseFinalize(t);
  t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  if(t.advanceBonusApplied){
    Object.keys(t.advanceBonusApplied).forEach(function(id){
      var p=getPlayer(id); if(p) p.points -= t.advanceBonusApplied[id];
    });
    t.advanceBonusApplied = {};
  }
  t.finals = null;
  t.finalists = null;
  t.status = "prelim";
}
function unwindPreFinalsIfNeeded(t){
  if(!t.preFinals) return;
  if(t.finals) unwindFinalsIfNeeded(t);
  (t.preFinals.matches||[]).forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
  t.preFinals = null;
  t.preFinalsByeIds = null;
  t.preFinalsPoolIds = null;
  t.preFinalsDrawCards = null;
  t.status = "prelim";
}
function groupOrBlockHasProgress(t, idx){
  if(t.format==="blockPrelim"){
    var b = t.blocks[idx];
    return !!(b.matches && b.matches.some(function(m){ return !!m.winner; }));
  }
  var g = t.groups[idx];
  if(!g.wb) return false;
  var wbHas = g.wb.rounds.some(function(r){ return r.some(function(m){ return m.winner && !m.bye; }); });
  var lbHas = g.lb && g.lb.rounds.some(function(r){ return r.some(function(m){ return m.winner && !m.bye; }); });
  var futureHas = g.futureWbByPos && Object.keys(g.futureWbByPos).length>0;
  return wbHas || !!lbHas || !!futureHas;
}
function resizeGroupOrBlockSlots(t, idx, newSize){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  var g = groups[idx];
  var newLen = newSize;
  if(t.format==="elimPrelim"){
    newLen = 1; while(newLen < newSize) newLen *= 2;
  }
  var newSlots = g.slots.slice(0, newLen);
  while(newSlots.length < newLen) newSlots.push(null);
  g.slots = newSlots;
  g.targetSize = newSize;
}

function finalizeTournamentSetup(t, opts){
  t.format = opts.format;
  t.usePointsAndSets = opts.usePointsAndSets!==false;
  t.setCountTable = normalizeSetTable(opts.setCountTable, t.usePointsAndSets);
  if(opts.customSets) t.customSets = JSON.parse(JSON.stringify(opts.customSets));
  t.useSchedule = opts.useSchedule===true;
  t.estTables = (opts.estTables>=1 && opts.estTables<=40) ? Math.round(opts.estTables) : EST_DEFAULT_TABLES;
  t.estMinutesInitial = (opts.estMinutes>=3 && opts.estMinutes<=180) ? Math.round(opts.estMinutes) : EST_DEFAULT_MINUTES;
  t.estMinutes = null;
  var eligible = eligiblePlayerIdsForTournament(t, t.usePointsAndSets);
  var basePool = eligible.length ? eligible : state.players.map(function(p){ return p.id; });
  t.eligiblePlayerIds = (opts.selectedIds && opts.selectedIds.length)
    ? basePool.concat(opts.selectedIds.filter(function(id){ return basePool.indexOf(id)<0; }))
    : basePool;
  t.manualClasses = {};
  if(!t.usePointsAndSets){
    t.eligiblePlayerIds.forEach(function(id){
      var p = getPlayer(id);
      if(p) t.manualClasses[id] = p.manualEntryClass || manualTierOf(classOf(p.points));
    });
  }
  if(opts.format==="blockPrelim"){
    var sizes = distributeCount(opts.totalParticipants, opts.groupCount);
    var perGroupIds = null;
    if(opts.selectedIds && opts.selectedIds.length){
      var sortedSelected = opts.selectedIds.slice().sort(seedCompare(t.entries));
      perGroupIds = sizes.map(function(){ return []; });
      sortedSelected.forEach(function(id, i){ perGroupIds[i % sizes.length].push(id); });
    }
    t.blockCount = opts.groupCount;
    t.advancePerBlock = opts.advancePerBlock;
    t.advanceBonusApplied = {};
    t.blocks = sizes.map(function(size, bi){
      var slots = new Array(size).fill(null);
      if(perGroupIds){ perGroupIds[bi].forEach(function(id, i){ slots[i] = id; }); }
      return { index:bi, targetSize:size, slots:slots };
    });
    t.finals = null;
    t.blocks.forEach(function(b){ rebuildBlockFromSlots(t, b); });
  } else {
    t.prelimType = opts.prelimType;
    t.lbOneSetDown = hasLoserBracket(t) ? (opts.lbOneSetDown!==false) : undefined;
    t.advancePerGroup = opts.advancePerGroup;
    if(hasLoserBracket(t)){
      t.advancePerGroupWB = opts.advancePerGroupWB;
      t.advancePerGroupLB = opts.advancePerGroupLB;
    }
    t.advanceBonusApplied = {};
    t.bracketSize = opts.bracketSize;
    t.elimGroupCount = 1;
    t.finalsTargetSize = null;
    applyTplAdvance(t);
    var gs0 = makeGroupSlots(t, opts.selectedIds||[], opts.bracketSize);
    t.groups = [{ index:0, targetSize:gs0.targetSize, slots: gs0.slots }];
    t.finals = null;
    t.preFinals = null; t.preFinalsByeIds = null; t.preFinalsPoolIds = null; t.preFinalsDrawCards = null;
    t.groups.forEach(function(g){ rebuildGroupFromSlots(t, g); });
  }
  t.status = "assigning";
  if(route.tournamentSetup) delete route.tournamentSetup[t.id];
  saveState();
  render();
}
function reverseAllTournamentEffects(t){
  if(t.finals){
    reverseFinalize(t);
    t.finals.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); });
  }
  if(t.preFinals){
    (t.preFinals.matches||[]).forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); });
  }
  if(t.advanceBonusApplied){
    Object.keys(t.advanceBonusApplied).forEach(function(id){
      var p=getPlayer(id); if(p) p.points -= t.advanceBonusApplied[id];
    });
  }
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(b){
      (b.matches||[]).forEach(function(m){ if(m.winner) undoMatchDeltas(m); });
      if(b.penaltyDeltas){
        Object.keys(b.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= b.penaltyDeltas[id]; });
      }
    });
  } else {
    (t.groups||[]).forEach(function(g){
      if(g.wb){ g.wb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.lb){ g.lb.rounds.forEach(function(r){ r.forEach(function(m){ if(m.winner && !m.bye) undoMatchDeltas(m); }); }); }
      if(g.penaltyDeltas){
        Object.keys(g.penaltyDeltas).forEach(function(id){ var p=getPlayer(id); if(p) p.points -= g.penaltyDeltas[id]; });
      }
    });
  }
}

  t.runnerUpId = null;

  if(newFormat==="blockPrelim"){
    var groupCount = t.blockCount || 3;

    var sizes = distributeCount(Math.max(participantIds.length, groupCount), groupCount);
    var sortedIds = participantIds.slice().sort(seedCompare(t.entries));

    t.blocks = sizes.map(function(size, bi){
      var slots = new Array(size).fill(null);
      perGroupIds[bi].forEach(function(id, i){ if(i<slots.length) slots[i]=id; });

    });

  } else {

    t.groups.forEach(function(g){ rebuildGroupFromSlots(t, g); });
    if(hasLoserBracket(t)){
      t.lbOneSetDown = t.lbOneSetDown!==false;
      t.advancePerGroupWB = t.advancePerGroupWB || Math.ceil(t.advancePerGroup/2);
      t.advancePerGroupLB = t.advancePerGroupLB || Math.floor(t.advancePerGroup/2);
    }

  }
  saveState(); render();
}
function changeUsePointsAndSets(t, newVal){

function changeBracketFormat(t, newSize){

  if(hasProg && !confirm("フォーマットを変更すると、出場選手が自動で再割当され、既に入力されている対戦結果(場合によっては予備決勝戦・決勝トーナメントの結果も)がすべて取り消されます。よろしいですか?")){
    render();
    return;
  }
  var participantIds = [];
  t.groups.forEach(function(g){
    (g.slots||[]).forEach(function(id){ if(id && participantIds.indexOf(id)<0) participantIds.push(id); });
  });
  if(Math.ceil(participantIds.length/t.groups.length)>newSize){
    alert("現在の出場人数("+participantIds.length+"名、"+t.groups.length+"グループ)が「"+newSize+"名用」フォーマットの1グループあたりの人数を超えているため、変更できません。");
    render();

  }
  reverseAllTournamentEffects(t);
  t.finals = null;
  t.finalists = null;
  t.preFinals = null; t.preFinalsByeIds = null; t.preFinalsPoolIds = null; t.preFinalsDrawCards = null;
  t.advanceBonusApplied = {};
  t.entryPoints = null;
  t.previousChampionAtEntry = undefined;
  t.finishDeltas = null;
  t.championId = null;
  t.runnerUpId = null;
  t.previousChampionBefore = undefined;
  t.tieBreakSelections = null;
  t.status = "assigning";
  t.bracketSize = newSize;
  applyTplAdvance(t);
  var resultBF = computeAiBlockAssignment(participantIds, t.groups.length, t);
  t.groups = resultBF.perGroupIds.map(function(ids, gi){
    var gsBF = makeGroupSlots(t, ids, newSize);
    return { index:gi, targetSize:gsBF.targetSize, slots:gsBF.slots };
  });
  t.groups.forEach(function(g){ rebuildGroupFromSlots(t, g); });
  saveState(); render();
}

// ---------- slot assignment ----------
function findSlotOwner(t, playerId){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  for(var gi=0; gi<groups.length; gi++){
    var si = groups[gi].slots.indexOf(playerId);
    if(si>=0) return {idx:gi, slotIdx:si};
  }
  return null;
}
function assignSlot(t, targetIdx, targetSlotIdx, newPlayerId){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  var arr = groups[targetIdx].slots;
  var newVal = newPlayerId || null;
  var touched = [targetIdx];
  if(newVal!==null){
    var owner = findSlotOwner(t, newVal);
    if(owner && !(owner.idx===targetIdx && owner.slotIdx===targetSlotIdx)){
      var ownerArr = groups[owner.idx].slots;
      ownerArr[owner.slotIdx] = arr[targetSlotIdx];
      touched.push(owner.idx);
    }
  }
  arr[targetSlotIdx] = newVal;
  return touched;
}

// ---------- AI再配置(シード順を保ちつつ、同じ所属の選手をできるだけ離す) ----------
function currentLineupIds(t){
  var groups = t.format==="blockPrelim" ? t.blocks : t.groups;
  var ids = [];
  (groups||[]).forEach(function(g){ g.slots.forEach(function(id){ if(id) ids.push(id); }); });
  return ids;
}
function affiliationOf(id){
  var p = getPlayer(id);
  return (p && p.affiliation) ? p.affiliation : null;
}
// ①トーナメント戦: シード順の山分け配置をベースに、1回戦(隣り合う2枠)で同じ所属が
// 当たる組み合わせを、他の枠との入れ替えでできるだけ解消する(貪欲法。完全解消は保証しない)
// 表に対応する形式で、1回戦に当たる枠の組(0始まりの枠番号)と、2回戦に当たりうる枠のグループを返す
function tplRiskStructure(key){
  var def = TPL_DEFS[key];
  var r1 = [], r2 = [];
  function slotsOf(s){
    if(s.p!=null) return [s.p-1];
    if(s.w!=null){ var m = def.matches[s.w]; return slotsOf(m.a).concat(slotsOf(m.b)); }
    return [];
  }
  def.order.forEach(function(no){
    var m = def.matches[no];
    if(m.side!=="wb") return;
    if(m.round===1 && m.a.p!=null && m.b.p!=null) r1.push([m.a.p-1, m.b.p-1]);
    if(m.round===2) r2.push([slotsOf(m.a), slotsOf(m.b)]);
  });
  return {r1:r1, r2:r2};
}
function computeAiEliminationSlots(ids, fixedSize, t){
  var tkey = tplKeyFor(t, fixedSize);
  var slots = tkey ? tplDefaultSlots(tkey, ids, t.entries) : computeDefaultBracketSlots(ids, fixedSize, t.entries);
  var pairList = [];
  if(tkey){ pairList = tplRiskStructure(tkey).r1; }
  else { for(var q=0; q<slots.length; q+=2) pairList.push([q, q+1]); }
  var partnerOf = {};
  pairList.forEach(function(pr){ partnerOf[pr[0]] = pr[1]; partnerOf[pr[1]] = pr[0]; });
  var guard = slots.length + 5;
  while(guard-- > 0){
    var pairIdx = -1, bIdx = -1;
    for(var pi=0; pi<pairList.length; pi++){
      var a = slots[pairList[pi][0]], b = slots[pairList[pi][1]];
      if(a && b && affiliationOf(a) && affiliationOf(a)===affiliationOf(b)){ pairIdx = pairList[pi][0]; bIdx = pairList[pi][1]; break; }
    }
    if(pairIdx<0) break;
    var bId = slots[bIdx];
    var bAff = affiliationOf(bId);
    var swapped = false;
    for(var j=0; j<slots.length; j++){
      if(j===pairIdx || j===bIdx) continue;
      if(partnerOf[j]==null) continue;
      var candId = slots[j];
      if(!candId) continue;
      var partnerIdx = partnerOf[j];
      var partnerId = slots[partnerIdx];
      var candAff = affiliationOf(candId);
      var conflictAtB = candAff && candAff===affiliationOf(slots[pairIdx]);
      var conflictAtJ = bAff && partnerId && bAff===affiliationOf(partnerId);
      if(!conflictAtB && !conflictAtJ){
        slots[bIdx] = candId; slots[j] = bId;
        swapped = true;
        break;
      }
    }
    if(!swapped) break;
  }
  return slots;
}
// 現在の組み合わせ(実際の組み替えは行わない)を対象に、同じ所属の選手が対戦することになっていないか
// (①トーナメント戦は1回戦・2回戦目まで、②予選リーグ戦は同じブロック内)をチェックして一覧で返す
function computeAffiliationRisks(t){
  var risks = [];
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(b, bi){
      var seen = {};
      (b.slots||[]).forEach(function(id){
        var aff = id && affiliationOf(id);
        if(!aff) return;
        (seen[aff] = seen[aff] || []).push(id);
      });
      Object.keys(seen).forEach(function(aff){
        var ids = seen[aff];
        if(ids.length>1){
          risks.push({label:'ブロック'+(bi+1)+': '+ids.map(playerName).map(esc).join(' と ')+'(所属: '+esc(aff)+')が同じブロックです'});
        }
      });
    });
  } else {
    (t.groups||[]).forEach(function(g, gi){
      var slots = g.slots||[];
      var gLabel = (t.groups.length>1) ? ('グループ'+(gi+1)+' ') : '';
      if(g.tpl){
        var rs = tplRiskStructure(g.tpl);
        rs.r1.forEach(function(pr){
          var x = slots[pr[0]], y = slots[pr[1]];
          var ax = x && affiliationOf(x), ay = y && affiliationOf(y);
          if(ax && ax===ay) risks.push({label:gLabel+'1回戦: '+esc(playerName(x))+' と '+esc(playerName(y))+'(所属: '+esc(ax)+')が対戦します'});
        });
        rs.r2.forEach(function(grp){
          grp[0].forEach(function(xi){
            grp[1].forEach(function(yi){
              var x2 = slots[xi], y2 = slots[yi];
              var ax2 = x2 && affiliationOf(x2), ay2 = y2 && affiliationOf(y2);
              if(ax2 && ax2===ay2) risks.push({label:gLabel+'2回戦(勝ち上がり次第): '+esc(playerName(x2))+' と '+esc(playerName(y2))+'(所属: '+esc(ax2)+')が対戦する可能性があります'});
            });
          });
        });
        return;
      }
      for(var i=0;i<slots.length;i+=4){
        var a=slots[i], b=slots[i+1], c=slots[i+2], d=slots[i+3];
        var affA=a&&affiliationOf(a), affB=b&&affiliationOf(b), affC=c&&affiliationOf(c), affD=d&&affiliationOf(d);
        if(affA && affA===affB){
          risks.push({label:gLabel+'1回戦: '+esc(playerName(a))+' と '+esc(playerName(b))+'(所属: '+esc(affA)+')が対戦します'});
        }
        if(affC && affC===affD){
          risks.push({label:gLabel+'1回戦: '+esc(playerName(c))+' と '+esc(playerName(d))+'(所属: '+esc(affC)+')が対戦します'});
        }
        [a,b].forEach(function(x){
          [c,d].forEach(function(y){
            var ax = x && affiliationOf(x), ay = y && affiliationOf(y);
            if(ax && ax===ay){
              risks.push({label:gLabel+'2回戦(勝ち上がり次第): '+esc(playerName(x))+' と '+esc(playerName(y))+'(所属: '+esc(ax)+')が対戦する可能性があります'});
            }
          });
        });
      }
    });
  }
  return risks;
}
// ②予選リーグ: 現行と同じシード順のブロック均等振り分けをベースに、同じブロックに入った
// 同じ所属の選手を、他ブロックの選手との入れ替えでできるだけ解消する(貪欲法)
function computeAiBlockAssignment(ids, blockCount, t){
  var sizes = distributeCount(ids.length, blockCount);
  var sorted = ids.slice().sort(seedCompare(t.entries));
  var perGroupIds = sizes.map(function(){ return []; });
  sorted.forEach(function(id, i){ perGroupIds[i % sizes.length].push(id); });
  var guard = sorted.length + 5;
  while(guard-- > 0){
    var conflict = null;
    for(var bi=0; bi<perGroupIds.length && !conflict; bi++){
      var seen = {};
      for(var k=0; k<perGroupIds[bi].length; k++){
        var aff = affiliationOf(perGroupIds[bi][k]);
        if(aff){
          if(seen[aff]!==undefined){ conflict = {blockIdx:bi, slotIdx:k}; break; }
          seen[aff] = k;
        }
      }
    }
    if(!conflict) break;
    var block = perGroupIds[conflict.blockIdx];
    var moveId = block[conflict.slotIdx];
    var moveAff = affiliationOf(moveId);
    var swapped = false;
    for(var obi=0; obi<perGroupIds.length && !swapped; obi++){
      if(obi===conflict.blockIdx) continue;
      var otherBlock = perGroupIds[obi];
      for(var oi=0; oi<otherBlock.length; oi++){
        var candId = otherBlock[oi];
        var candAff = affiliationOf(candId);
        var conflictHome = candAff && block.some(function(pid, pi){ return pi!==conflict.slotIdx && affiliationOf(pid)===candAff; });
        var conflictAway = moveAff && otherBlock.some(function(pid, pi){ return pi!==oi && affiliationOf(pid)===moveAff; });
        if(!conflictHome && !conflictAway){
          block[conflict.slotIdx] = candId; otherBlock[oi] = moveId;
          swapped = true;
          break;
        }
      }
    }
    if(!swapped) break;
  }
  return {sizes:sizes, perGroupIds:perGroupIds};
}

function csvEscape(v){
  v = String(v==null ? "" : v);
  if(/[",\n\r]/.test(v)){ v = '"' + v.replace(/"/g,'""') + '"'; }
  return v;
}

  });

}
function parseCsvLine(line){
  var result = [], cur = "", inQuotes = false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else { cur += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ result.push(cur); cur = ""; }
      else { cur += c; }
    }
  }
  result.push(cur);
  return result;
}
function decodeCsvBuffer(buffer){
  var bytes = new Uint8Array(buffer);
  if(bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF){
    return new TextDecoder("utf-8").decode(bytes.subarray(3));
  }
  try{
    return new TextDecoder("utf-8", {fatal:true}).decode(bytes);
  }catch(e){
    try{
      return new TextDecoder("shift-jis").decode(bytes);
    }catch(e2){
      return new TextDecoder("utf-8").decode(bytes);
    }
  }
}
function normalizeNameForMatch(name){
  return (name||"").replace(/[\s　]+/g, "");
}
function importGuestEntriesFromCSV(t, text){
  var lines = text.replace(/^﻿/, "").split(/\r\n|\n|\r/).filter(function(l){ return l.trim()!==""; });
  if(!lines.length){ alert("CSVにデータがありません。"); return; }
  if(/^氏名/.test(lines[0])) lines.shift();
  var added = 0, matched = 0;
  lines.forEach(function(line){
    var cols = parseCsvLine(line);
    var name = (cols[0]||"").trim();
    if(!name) return;
    var kana = (cols[1]||"").trim();
    var affiliation = (cols[2]||"").trim();
    var clsRaw = (cols[3]||"").trim().toUpperCase();
    var cls = MANUAL_CLASS_OPTIONS.indexOf(clsRaw)>=0 ? clsRaw : "Be";
    var existing = state.players.find(function(p){ return normalizeNameForMatch(p.name)===normalizeNameForMatch(name); });
    var id;
    if(existing){
      id = existing.id; matched++;
    } else {
      id = addGuestPlayer(name, kana, cls, affiliation);
      added++;
    }
    t.entries[id] = {entered:true, feePaid:false};
  });
  saveState(); render();
  alert("CSVを取り込みました(新規イベント大会出場選手登録: "+added+"名、既存選手のエントリー: "+matched+"名)。参加費受領のチェックは別途行ってください。");
}

// data-*属性をすべて使って要素を一意に特定するセレクタを作る(同じdata-actionが並ぶ一覧の行(チェックボックスなど)でも
// 再描画後に同じ行の要素へフォーカスを戻せるようにするため。data-id等がなく複数該当する場合はnullを返す)
function elementDataSelector(el){
  if(!el || !el.attributes) return null;
  var parts = [];
  for(var i=0;i<el.attributes.length;i++){
    var attr = el.attributes[i];
    if(attr.name.indexOf("data-")===0) parts.push('['+attr.name+'="'+attr.value.replace(/"/g,'\\"')+'"]');
  }
  // 同じdata-action・data-tidを共有するラジオボタンの組(例: 「はい/いいえ」)はvalue属性でのみ区別できるため、
  // ラジオボタンに限りvalue属性も判定材料に加える(テキスト系inputは入力中に値が変わるため対象外)
  if(el.tagName==="INPUT" && el.type==="radio"){
    var valueAttr = el.getAttribute("value");
    if(valueAttr!=null) parts.push('[value="'+valueAttr.replace(/"/g,'\\"')+'"]');
  }
  if(!parts.length) return null;
  return el.tagName.toLowerCase()+parts.join("");
}
function captureFocusInfo(){
  var activeEl = document.activeElement;
  if(!activeEl || !activeEl.getAttribute || !activeEl.getAttribute("data-action")) return null;
  var selector = elementDataSelector(activeEl);
  if(!selector) return null;
  try{
    if(document.querySelectorAll(selector).length!==1) return null;
  }catch(e){ return null; }
  return {selector: selector, selectionStart: activeEl.selectionStart, selectionEnd: activeEl.selectionEnd};
}
function restoreFocusInfo(focusInfo){
  if(!focusInfo) return;
  var toFocus;
  try{ toFocus = document.querySelector(focusInfo.selector); }catch(e){ return; }
  if(toFocus){
    toFocus.focus({preventScroll:true});
    if(typeof focusInfo.selectionStart==="number" && toFocus.setSelectionRange){
      try{ toFocus.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd); }catch(e){}
    }
  }
}
// window.scrollTo()を再描画直後に呼ぶだけでは、モバイル端末側の非同期なスクロール位置の
// 再調整(フォーカス喪失時の自動スクロールなど)で直後に上書きされてしまうことがあるため、
// 次以降の描画フレームでも念のため再度スクロール位置を指定し直す
function reassertScroll(x, y){
  window.scrollTo(x, y);
  if(window.requestAnimationFrame){
    requestAnimationFrame(function(){
      window.scrollTo(x, y);
      requestAnimationFrame(function(){ window.scrollTo(x, y); });
    });
  }
}
// トーナメント表(.tsh-scroll)の横・縦スクロール位置は、再描画(ポップアップの表示・勝者の決定・自動更新など)のたびに
// 先頭へ戻らないよう、再描画の前に控えて、描画後に同じ位置へ戻す
function captureTshScroll(){
  return Array.from(document.querySelectorAll(".tsh-scroll")).map(function(el){ return {l:el.scrollLeft, t:el.scrollTop}; });
}
function restoreTshScroll(snap){
  var els = document.querySelectorAll(".tsh-scroll");
  snap.forEach(function(s, i){ var el = els[i]; if(el){ el.scrollLeft = s.l; el.scrollTop = s.t; } });
}
function render(){
  if(DISPLAY_MODE){
    var dispScrollX = window.scrollX, dispScrollY = window.scrollY, dispTsh = captureTshScroll();
    document.getElementById("main").innerHTML = renderDisplayScreen();
    applyTshFit();
    reassertScroll(dispScrollX, dispScrollY);
    restoreTshScroll(dispTsh);
    return;
  }
  if(STREAM_MODE){
    document.getElementById("main").innerHTML = renderStreamScreen();
    return;
  }
  if(DRAW_MODE){
    var drawScrollY = window.scrollY, drawScrollX = window.scrollX;
    var drawFocusInfo = captureFocusInfo();
    document.getElementById("main").innerHTML = renderDrawScreen();
    reassertScroll(drawScrollX, drawScrollY);
    restoreFocusInfo(drawFocusInfo);
    return;
  }
  if(GUIDE_MODE){
    document.getElementById("main").innerHTML = renderGuideScreen();
    return;
  }
  autoFinalizePrelims();
  var scrollY = (pendingScrollRestore!=null) ? pendingScrollRestore : window.scrollY;
  var scrollX = window.scrollX;
  pendingScrollRestore = null;
  var innerScrollers = Array.from(document.querySelectorAll("[data-preserve-scroll]")).map(function(el){
    return {id: el.id, scrollTop: el.scrollTop, scrollLeft: el.scrollLeft};
  });
  var bflowScrollers = Array.from(document.querySelectorAll(".bflow-wrap")).map(function(el){
    return {scrollLeft: el.scrollLeft, scrollTop: el.scrollTop};
  });
  var tshScrollers = captureTshScroll();
  var focusInfo = captureFocusInfo();
  renderNav();
  var navTour = (route.screen==="tournament") ? findTournament(route.id) : null;
  document.body.classList.toggle("t-head-sticky", tournamentInPlay(navTour));

  if(route.screen==="roster") html = renderRoster();
  else if(route.screen==="rosterPrint") html = renderRosterPrint();
  else if(route.screen==="tournamentPrint") html = renderTournamentResultPrint(route.id);
  else if(route.screen==="matchPrint") html = renderMatchPrint(route);
  else if(route.screen==="settings") html = renderSettings();
  else if(route.screen==="newTournament") html = renderCreateTournamentShellForm();
  else if(route.screen==="history") html = renderHistory();
  else if(route.screen==="tournament") html = renderTournamentScreen(route.id);

  main.innerHTML = html;
  document.getElementById("h2h-modal-root").innerHTML = h2hModal ? renderH2HModal() : (estModal ? renderEstimateModal() : (tplSlotModal ? renderTplSlotModal() : (tplModal ? renderTplMatchModal() : (gridCellModal ? renderGridCellModal() : ""))));
  function applyInnerScrolls(){
    innerScrollers.forEach(function(s){
      var el = document.getElementById(s.id);
      if(el){ el.scrollTop = s.scrollTop; el.scrollLeft = s.scrollLeft; }
    });
    var newBflowScrollers = document.querySelectorAll(".bflow-wrap");
    bflowScrollers.forEach(function(s, i){
      var el = newBflowScrollers[i];
      if(el){ el.scrollLeft = s.scrollLeft; el.scrollTop = s.scrollTop; }
    });
    restoreTshScroll(tshScrollers);
  }
  applyTshFit();
  reassertScroll(scrollX, scrollY);
  applyInnerScrolls();
  if(window.requestAnimationFrame){
    requestAnimationFrame(function(){
      applyInnerScrolls();
      requestAnimationFrame(applyInnerScrolls);
    });
  }
  restoreFocusInfo(focusInfo);
}

function sortPlayers(players, sortMode){
  if(sortMode==="order") return players.slice();
  return players.slice().sort(function(a,b){
    if(sortMode==="name"){
      var ka = a.kana||a.name, kb = b.kana||b.name;
      return ka.localeCompare(kb, "ja");
    }
    return b.points-a.points;
  });
}

  var nameNorm = normalizeNameForMatch(p.name||"").toLowerCase();

}

function formatBackupDate(iso){
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    function p2(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"/"+p2(d.getMonth()+1)+"/"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
  }catch(e){ return iso; }
}
function formatBytes(n){
  if(n==null) return "-";
  if(n<1024) return n+"B";
  if(n<1024*1024) return (n/1024).toFixed(1)+"KB";
  return (n/1024/1024).toFixed(1)+"MB";
}
function loadCloudBackups(){
  if(cloudBackupsLoading) return;
  cloudBackupsLoading = true;
  cloudBackupsError = null;
  fetch("/api/backups", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    cloudBackups = (data && data.backups) || [];
    cloudBackupsLoading = false;
    render();
  }).catch(function(e){
    cloudBackupsError = String((e&&e.message)||e);
    cloudBackupsLoading = false;
    render();
  });
}
function createCloudBackup(){
  if(cloudBackupBusy) return;
  cloudBackupBusy = true; cloudBackupsError = null; render();
  fetch("/api/backups", {method:"POST"}).then(function(r){
    if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||("HTTP "+r.status)); });
    return r.json();
  }).then(function(){
    cloudBackupBusy = false;
    cloudBackups = null;
    render();
  }).catch(function(e){
    cloudBackupBusy = false;
    cloudBackupsError = String((e&&e.message)||e);
    render();
  });
}

    if(!r.ok) return r.json().then(function(j){ throw new Error((j&&j.error)||("HTTP "+r.status)); });

    cloudBackupBusy = false;

function ensureTournamentSetupState(t){
  route.tournamentSetup = route.tournamentSetup || {};
  var nt = route.tournamentSetup[t.id];
  if(!nt){
    nt = route.tournamentSetup[t.id] = {
      format:"elimPrelim", prelimType:"single", lbOneSetDown:true,
      advancePerGroup:4,
      advancePerGroupWB:4, advancePerGroupLB:4,
      blockCount:3, advancePerBlock:2,
      usePointsAndSets: true,
      setCountTable: "A",
      useSchedule: false,
      estTables: EST_DEFAULT_TABLES,
      estMinutes: EST_DEFAULT_MINUTES,
      totalParticipants: 8
    };
  }
  // 出場選手はエントリー受付(エントリー済み)の状況をそのまま使う
  var eligibleIds = eligiblePlayerIdsForTournament(t, nt.usePointsAndSets);

function displayMatchRowHTML(match, matchNo, t){
  function side(id, sideKey){
    if(!id) return '<span class="hint">(不戦)</span>';
    var oppId = sideKey==="a" ? match.b : match.a;
    var isWinner = match.winner===id;
    var score = match.score || {a:null,b:null};
    var val = score[sideKey];
    var scoreHTML = isWinner ? '<span class="score-num num win-mark" style="margin-left:.3rem">(W)</span>' : (val!=null ? '<span class="score-num num" style="margin-left:.3rem">('+val+')</span>' : walkoverTagHTML(match, sideKey));
    var rowBadge = classBadgeOrEmpty(t, id);
    return '<span'+(isWinner?' style="font-weight:700"':'')+'>'+esc(playerNameWithAffiliation(t, id))+(rowBadge?(' '+rowBadge):'')+(isWinner?' 🏆':'')+'</span>'+matchFormatHintHTML(id, oppId, false, t, match)+scoreHTML+(usePointsAndSets(t)?matchDeltaHTML(match, id):'');
  }
  var matchNoHTML = matchNo ? '<span class="match-no">'+matchNo+'</span>' : "";
  return '<div class="match-row">'+matchNoHTML+
    '<div class="match-side">'+side(match.a,"a")+'</div>'+
    '<div class="match-vs">vs</div>'+
    '<div class="match-side">'+side(match.b,"b")+'</div>'+
  '</div>';
}
function renderDisplayBlock(t, block){
  var perRound = Math.max(1, Math.floor(block.playerIds.length/2));
  var matches = block.matches.map(function(m,mi){
    var roundHeader = (mi % perRound === 0)
      ? ('<p class="hint" style="margin:'+(mi===0?'0':'1rem')+' 0 .3rem;font-weight:600">第'+(Math.floor(mi/perRound)+1)+'ラウンド</p>')
      : '';
    return roundHeader + displayMatchRowHTML(m, blockMatchLabel(block, mi), t);
  }).join("");
  return '<div class="card"><h3>ブロック '+(block.index+1)+'</h3>'+
    renderBlockGrid(t, block, {editable:false})+
    '<div style="margin-top:.6rem">'+matches+'</div></div>';
}

function fireworksHTML(){
  var colors = ["#ffd23f","#ff6b6b","#4ecdc4","#c77dff","#ffa62b"];
  var bursts = [
    {x:22, y:24, delay:0}, {x:78, y:22, delay:0.8}, {x:50, y:30, delay:1.6}
  ];
  var html = '<div class="fireworks" aria-hidden="true">';
  bursts.forEach(function(b, bi){
    var n = 8;
    for(var i=0;i<n;i++){
      var angle = Math.round(i*(360/n));
      var color = colors[(bi+i)%colors.length];
      var dist = 60 + (i%3)*12;
      var dur = 1.8 + (i%3)*0.3;
      html += '<div class="fw-particle" style="left:'+b.x+'%;top:'+b.y+'%;background:'+color+';color:'+color+';--fw-angle:'+angle+'deg;--fw-dist:'+dist+'px;animation-duration:'+dur+'s;animation-delay:'+(b.delay+i*0.02)+'s"></div>';
    }
  });
  html += '</div>';
  return html;
}
function renderDisplayResult(t){

    '<h3>大会結果</h3>'+

    (log?('<div class="bonus-log">'+log+'</div>'):'')+
  '</div>';
}

// ---------- 大会結果共有ページの自動スクロール ----------
// ページ全体を、上から下まで60秒かけて自動でゆっくりスクロールする(下まで来たら少し止まって先頭へ戻り、繰り返す)。
// 画面を操作(ホイール・タッチ・クリック・キー)したら一時停止し、20秒操作がなければ再開する。
// 「自動スクロール」ボタンでオン/オフでき、この端末のブラウザに保存する(初期値はオン)
var DISPLAY_AUTOSCROLL_KEY = "gspec_display_autoscroll";
var DISPLAY_SCROLL_SECONDS = 60;
var DISPLAY_SCROLL_EDGE_PAUSE_MS = 3000;
var DISPLAY_SCROLL_RESUME_MS = 20000;
function isDisplayAutoScrollOn(){
  try{ return localStorage.getItem(DISPLAY_AUTOSCROLL_KEY)!=="0"; }catch(e){ return true; }
}
function setDisplayAutoScrollOn(v){
  try{ localStorage.setItem(DISPLAY_AUTOSCROLL_KEY, v ? "1" : "0"); }catch(e){}
}
function startDisplayAutoScroll(){
  var pos = window.scrollY, lastSet = pos, lastT = null, holdUntil = 0, pausedUntil = 0;
  // 表示倍率・自動スクロールのボタンの操作では止めない(倍率を変えてもスクロールを続ける)
  function interact(e){
    var el = e && e.target;
    if(el && el.closest && el.closest('[data-action="set-tsh-zoom"],[data-action="toggle-display-autoscroll"]')) return;
    pausedUntil = Date.now() + DISPLAY_SCROLL_RESUME_MS;
  }
  ["wheel","touchstart","mousedown","keydown"].forEach(function(ev){ window.addEventListener(ev, interact, {passive:true}); });
  function frame(){
    var ts = performance.now();
    var now = Date.now();
    var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if(lastT==null) lastT = ts;
    var dt = Math.min(200, ts - lastT); lastT = ts;
    if(Math.abs(window.scrollY - lastSet) > 2) pos = window.scrollY;   // 利用者が動かした/再描画で位置が変わった場合は、その位置から続ける
    var active = isDisplayAutoScrollOn() && !displayQrOpen && !displayEstOpen && now >= pausedUntil && now >= holdUntil && maxY > 4;
    if(active){
      pos += (maxY / (DISPLAY_SCROLL_SECONDS*1000)) * dt;
      if(pos >= maxY){
        pos = maxY; holdUntil = now + DISPLAY_SCROLL_EDGE_PAUSE_MS; window.scrollTo(0, pos); lastSet = window.scrollY;
        setTimeout(function(){ pos = 0; window.scrollTo(0, 0); lastSet = window.scrollY; holdUntil = Date.now() + DISPLAY_SCROLL_EDGE_PAUSE_MS; }, DISPLAY_SCROLL_EDGE_PAUSE_MS);
      } else {
        window.scrollTo(0, pos); lastSet = window.scrollY;
      }
    } else {
      pos = window.scrollY; lastSet = pos;
    }
  }
  // タイマーで動かす(画面が見えていない間に止まるrequestAnimationFrameではなく、一定間隔で位置を進める)
  setInterval(frame, 40);
}

// ---------- stream mode rendering (single-match OBS-friendly scoreboard) ----------
function findStreamMatch(t, scope, idx, side, mid){
  if(!t || !mid) return null;
  if(scope==="block"){
    var block = (t.blocks||[])[idx];
    return block ? (block.matches||[]).find(function(m){ return m.id===mid; }) || null : null;
  }
  if(scope==="elim"){
    var g = (t.groups||[])[idx];
    if(!g) return null;
    var foundElim = findElimMatch(g, side, mid);
    if(foundElim) return foundElim;
    if(side==="wb"){
      var parsedVirt = parseWbFuturePos(mid);
      if(parsedVirt) return virtualWbMatch(g, parsedVirt.round, parsedVirt.mi);
    }
    return null;
  }
  if(scope==="bracket"){
    var found = null;
    (t.finals ? t.finals.rounds : []).forEach(function(r){ r.forEach(function(m){ if(m.id===mid) found=m; }); });
    return found;
  }
  if(scope==="preFinals"){
    return t.preFinals ? (t.preFinals.matches.find(function(m){ return m.id===mid; }) || null) : null;
  }
  return null;
}
function listStreamableMatches(t){
  var list = [];
  function isFinalistMatch(m){
    return !!(t.finalists && (t.finalists.indexOf(m.a)>=0 || t.finalists.indexOf(m.b)>=0));
  }
  function addRounds(rounds, scope, idx, side, sectionLabel, roundLabelFn){
    (rounds||[]).forEach(function(round, ri){
      round.forEach(function(m){
        if(!m.a || !m.b || m.bye) return;
        if(scope!=="bracket" && isFinalistMatch(m)) return;
        list.push({scope:scope, idx:idx, side:side, mid:m.id, match:m, section:sectionLabel+(roundLabelFn?(" ・ "+roundLabelFn(ri)):"")});
      });
    });
  }
  if(t.format==="blockPrelim"){
    (t.blocks||[]).forEach(function(b){
      (b.matches||[]).forEach(function(m){
        if(!m.a || !m.b || m.bye) return;
        if(isFinalistMatch(m)) return;
        list.push({scope:"block", idx:b.index, side:null, mid:m.id, match:m, section:"予選 ・ ブロック"+(b.index+1)});
      });
    });
  } else {
    (t.groups||[]).forEach(function(g){
      addRounds(g.wb.rounds, "elim", g.index, "wb", "予選 ・ グループ"+(g.index+1)+"・勝者側", function(ri){ return (ri+1)+"回戦"; });
      if(hasLoserBracket(t)) addRounds(g.lb.rounds, "elim", g.index, "lb", "予選 ・ グループ"+(g.index+1)+"・敗者復活", function(ri){ return (ri+1)+"回戦"; });
    });
  }
  if(t.preFinals){
    t.preFinals.matches.forEach(function(m){
      if(!m.a || !m.b || m.bye) return;
      list.push({scope:"preFinals", idx:null, side:null, mid:m.id, match:m, section:"予備決勝戦"});
    });
  }
  if(t.finals) addRounds(t.finals.rounds, "bracket", null, null, "決勝トーナメント", function(ri){ return roundName(ri+1, t.finals.totalRounds); });
  return list;
}

// ---------- 対戦成績(2選手間の過去の対戦記録) ----------
function headToHeadMatches(aId, bId){
  var out = [];
  function consider(t, m, stageLabel){
    if(!m || m.bye || !m.winner) return;
    if(!((m.a===aId && m.b===bId) || (m.a===bId && m.b===aId))) return;
    out.push({
      tournamentId: t.id,
      tournamentName: t.name,
      createdAt: t.createdAt || 0,
      eventDate: t.eventDate || null,
      stageLabel: stageLabel,
      winnerId: m.winner,
      score: (m.score && (m.score.a!=null || m.score.b!=null)) ? m.score : null,
      showPS: usePointsAndSets(t)
    });
  }
  state.tournaments.forEach(function(t){
    if(t.format==="blockPrelim"){
      (t.blocks||[]).forEach(function(b){
        (b.matches||[]).forEach(function(m){ consider(t, m, "予選リーグ"); });
      });
    } else {
      (t.groups||[]).forEach(function(g){
        (g.wb && g.wb.rounds || []).forEach(function(round){ round.forEach(function(m){ consider(t, m, "予選"); }); });
        if(g.futureWbByPos){
          Object.keys(g.futureWbByPos).forEach(function(key){
            var parts = key.split("_");
            var vm = virtualWbMatch(g, parseInt(parts[0],10), parseInt(parts[1],10));
            if(vm) consider(t, vm, "予選");
          });
        }
        if(g.lb && g.lb.rounds){
          g.lb.rounds.forEach(function(round){ round.forEach(function(m){ consider(t, m, "予選(敗者復活)"); }); });
        }
      });
    }
    if(t.finals && t.finals.rounds){
      t.finals.rounds.forEach(function(round){ round.forEach(function(m){ consider(t, m, "決勝トーナメント"); }); });
    }
  });
  out.sort(function(x,y){ return y.createdAt-x.createdAt; });
  return out;
}

function rosterOptionsHTML(t, currentValue, allowBye, eligibleIds, usedElsewhere, activeElsewhereSet){
  var placeholder = allowBye ? ('<option value=""'+(currentValue?"":" selected")+'>(不戦/空き)</option>')
                              : ('<option value=""'+(currentValue?"":" selected")+'>(未定)</option>');
  var pool = (eligibleIds && eligibleIds.length) ? state.players.filter(function(p){ return eligibleIds.indexOf(p.id)>=0; }) : state.players.slice();
  var players = pool.sort(function(a,b){ return a.name.localeCompare(b.name,"ja"); });
  // 大会の開始後は、まだエントリーしていない選手も「途中参加」として枠に追加できる(選ぶと、エントリー済みの選手に加わる)
  var lateHTML = "";
  if(eligibleIds && eligibleIds===t.eligiblePlayerIds && t.status!=="assigning" && t.status!=="entryPending"){
    var usePts = usePointsAndSets(t);
    var late = state.players.filter(function(p){
      return eligibleIds.indexOf(p.id)<0 && !(usePts && p.isGuest);
    }).sort(function(a,b){ return a.name.localeCompare(b.name,"ja"); });
    if(late.length){
      lateHTML = '<optgroup label="途中参加(未エントリーの選手を追加)">'+late.map(function(p){
        var clsLabel = p.isGuest ? (p.manualEntryClass || "-") : classOf(p.points);
        return '<option value="'+p.id+'">'+esc(playerNameWithAffiliation(t, p.id))+' ('+clsLabel+')</option>';
      }).join("")+'</optgroup>';
    }
  }
  var opts = placeholder + players.map(function(p){
    var isUsed = usedElsewhere && usedElsewhere.indexOf(p.id)>=0;
    var isActiveElsewhere = !isUsed && activeElsewhereSet && activeElsewhereSet[p.id] && p.id!==currentValue;
    var clsLabel = p.isGuest ? (p.manualEntryClass || "-") : classOf(p.points);
    var label = esc(playerNameWithAffiliation(t, p.id))+' ('+clsLabel+')'+(isUsed?' ✓選択済み':'')+(isActiveElsewhere?' (他大会で対戦中)':'');
    return '<option value="'+p.id+'"'+(currentValue===p.id?" selected":"")+((isUsed||isActiveElsewhere)?' style="background:#ddd;color:#777;"':'')+'>'+label+'</option>';
  }).join("") + lateHTML;
  return opts;
}

  var eligible = eligiblePlayerIdsForTournament(t, t.usePointsAndSets);

  var assignedIds = [];
  (t.format==="blockPrelim" ? (t.blocks||[]) : (t.groups||[])).forEach(function(g){

function lbPlaceholderRounds(g){
  var r0 = (g.wb && g.wb.rounds && g.wb.rounds[0]) || [];
  var loserCount = r0.filter(function(m){ return !m.bye; }).length;
  if(loserCount<1) return [];
  var round = [];
  for(var i=0;i<loserCount;i+=2){
    round.push({id:"lb_ph_m"+(i/2), round:1, a:null, b:null, winner:null, deltas:null, bye:false, score:{a:null,b:null}});
  }
  return [round];
}
// 敗者復活ブロックの「まだ実データが作られていないラウンド」について、
// 勝者側で既に判明している結果から敗者名を先読みして表示する(表示専用。resolvable にはしない)。
function lbPreviewRoundsForProj(g, proj){
  var counts = (proj && proj.__lbMatchCount) || {};
  var maxRound = 0;
  Object.keys(counts).forEach(function(k){ maxRound = Math.max(maxRound, Number(k)); });
  var realRounds = (g.lb && g.lb.rounds) || [];
  var r0 = (g.wb && g.wb.rounds && g.wb.rounds[0]) || [];
  var r0len = r0.length;
  function nonByeCountAtRound(ri){
    if(ri===0) return r0.filter(function(m){ return !m.bye; }).length;
    return Math.round(r0len / Math.pow(2, ri));
  }
  function wbLoserVals(wbRoundIdx){
    var nB = nonByeCountAtRound(wbRoundIdx);
    var vals = new Array(nB).fill(null);
    var wbRound = g.wb && g.wb.rounds && g.wb.rounds[wbRoundIdx];
    if(wbRound){
      var nonBye = wbRound.filter(function(m){ return !m.bye; });
      for(var k=0;k<nB && k<nonBye.length;k++){
        var m = nonBye[k];
        vals[k] = m.winner ? (m.winner===m.a?m.b:m.a) : null;
      }
    }
    return vals;
  }
  var winnerVals = {};
  var rounds = [];
  for(var i=1; i<=maxRound; i++){
    if(i<=realRounds.length){
      rounds.push(realRounds[i-1]);
      winnerVals[i] = realRounds[i-1].map(function(m){ return m.winner; });
      continue;
    }
    var n = counts[i];
    if(!n) break;
    var source;
    if(i===1){
      source = wbLoserVals(0);
    } else if(i%2===1){
      source = (winnerVals[i-1]||[]).slice();
    } else {
      var wbRoundIdx = i/2;
      var lbVals = winnerVals[i-1]||[];
      var wbVals = wbLoserVals(wbRoundIdx).slice().reverse();
      source=[];
      var nn = Math.max(lbVals.length, wbVals.length);
      for(var k2=0;k2<nn;k2++){
        if(k2<lbVals.length) source.push(lbVals[k2]);
        if(k2<wbVals.length) source.push(wbVals[k2]);
      }
    }
    var matches=[]; var outVals=[];
    for(var mi=0; mi<n; mi++){
      var a = (source[mi*2]!=null) ? source[mi*2] : null;
      var b = (source[mi*2+1]!=null) ? source[mi*2+1] : null;
      matches.push({id:"lb_ph_r"+i+"_m"+mi, round:i, a:a, b:b, winner:null, deltas:null, bye:false, preview:true, score:{a:null,b:null}});
      outVals.push(null);
    }
    winnerVals[i] = outVals;
    rounds.push(matches);
  }
  return rounds;
}
function lbRoundsForDisplay(g, proj){
  var real = (g.lb && g.lb.rounds) ? g.lb.rounds : [];
  if(g.tpl) return real;
  if(!proj) return real.length ? real : lbPlaceholderRounds(g);
  var rounds = lbPreviewRoundsForProj(g, proj);
  if(rounds.length) return rounds;
  return real.length ? real : lbPlaceholderRounds(g);
}

      return '<div class="simple-match'+(m.preview?' preview':'')+'">'+simpleSideHTML(m, m.a, opts, "a")+simpleSideHTML(m, m.b, opts, "b")+'<div class="bflow-match-footer">'+noHTML+lossHintSp+undo+startBtnSp+h2hBtnSp+((m.preview || !opts.printScope)?"":printMatchLinkHTML(opts.tournament, m, opts.printScope, opts.printIdx, "lb"))+'</div></div>';

// ②予選リーグの総当たり表(N×Nグリッド)。editable:true で管理画面用(セルクリックで入力ポップアップ・行見出しに選手選択プルダウン)、false で観戦ディスプレイ・印刷用(読み取り専用)
function renderBlockGrid(t, block, opts){
  var editable = !!opts.editable;
  var ids = block.playerIds;
  var showPS = usePointsAndSets(t);
  var activeElsewhereSet = editable ? playersActiveInOtherTournaments(t.id) : null;
  var usedInOtherContainers = editable ? playersUsedInOtherContainers(t, "block", block.index) : [];
  function usedElsewhere(si){ return block.slots.filter(function(id, idx){ return idx!==si && id; }).concat(usedInOtherContainers); }
  function matchBetween(a, b){
    return block.matches.find(function(m){ return (m.a===a && m.b===b) || (m.a===b && m.b===a); });
  }
  var standings = blockStandings(t, block);
  var rankOf = {};
  standings.forEach(function(s, i){ rankOf[s.id] = i+1; });
  var lossesOf = {};
  ids.forEach(function(id){ lossesOf[id] = block.losses ? (block.losses[id]||0) : 0; });
  var headerCells = ids.map(function(id, i){ return '<th class="num">No.'+(i+1)+'</th>'; }).join("");

// ---------- Excel(表)と同じ見た目のトーナメント表 ----------
// 添付の表(xlsx)と同じ、「選手枠 → 結合線 → 勝ち上がり枠」を線でつないだ表として描く。
//  ・ダブルエリミネーション: 中央に選手枠、左に勝者側、右に敗者側(敗者側の入口は「N-L」=N番の試合の敗者)
//  ・シングルエリミネーション: 32名用以上は左右の山が中央の決勝に向かう形、16名用・24名用は下から上に勝ち上がる縦の形
// 各結合線の番号が試合番号。選手名の枠をクリックでその試合の勝者に決定、番号をクリックでスコア入力・試合開始・取消など。
var TSH = {BH:34, BW:134, SN:26, STUB:14, TAIL:30, LBP:44, GAP:30, VT:44, VL:116, VSN:22, CG:92, PAD:12};
// 表の表示倍率(画面の一時設定。保存しない)。数値=その倍率、"fit"=画面に全体を収める、"fitw"=画面の幅に合わせる。
// 大会結果共有ページ(観戦用ディスプレイ)は、トーナメント全体が見える「全体表示」が初期値
var tshZoom = (window.innerWidth < 700) ? "fitw" : (DISPLAY_MODE ? "fit" : 1);   // スマホは幅に合わせて表示(ピンチで拡大、横スクロールも可)
// 「全体表示」「幅に合わせる」のときの倍率を、表ごとに画面の大きさから計算して当てる(拡大はせず、最大100%)
// ブラウザの拡大・縮小(PCのCtrl+ホイール・Ctrl+「+/-」)の倍率。読み込み時を100%として、画面の幅(CSSピクセル)が変わっても、
// 「全体表示」「幅に合わせる」の大きさを計算し直して打ち消してしまわないよう、拡大・縮小の分を補正する(PDFのように拡大・縮小できる)。
// スマホのピンチ操作は画面の幅が変わらないので、そのまま拡大・縮小できる
var TSH_BASE_DPR = window.devicePixelRatio || 1;
function tshBrowserZoom(){ return (window.devicePixelRatio || 1) / TSH_BASE_DPR; }
function applyTshFit(){
  var bz = tshBrowserZoom();
  Array.prototype.forEach.call(document.querySelectorAll(".tsh-zoom[data-fit]"), function(z){
    var mode = z.getAttribute("data-fit"), w = Number(z.getAttribute("data-w")), h = Number(z.getAttribute("data-h"));
    var box = z.parentElement, availW = box ? (box.clientWidth - 12) * bz : 0;
    if(!w || !h || availW<=0) return;
    var scale = availW / w;
    if(mode==="fit") scale = Math.min(scale, (window.innerHeight * bz - 30) / h);
    scale = Math.max((window.innerWidth < 700) ? 0.5 : 0.2, Math.min(1, scale));   // スマホは読める大きさ(50%)を下限にし、それより広い表は横にスクロールして見る
    z.style.zoom = scale.toFixed(3);
    // 文字の大きさ: 表の倍率に合わせて調整する。ブラウザで縮小したときは画面上の文字が小さくなるので、その分も大きくして読めるようにする
    // (拡大したときは表と一緒に比例して大きくなるので、そのまま。枠に収まらない名前は省略され、文字が重ならない)
    tshApplyTextScale(z, scale * Math.min(1, bz));
  });
}
// 表示倍率に合わせた文字の大きさ。縮小するほど、画面上の文字が読める大きさ(約9px)になるよう表の中の文字を大きくする。
// 枠に収まらない分は省略(…)で切り、文字が重ならないようにする。倍率が小さい(65%未満)ときは、枠が小さく読めないため所属・クラスの行は省き、名前を大きく表示する
function tshTextScale(z){
  z = (z>0) ? z : 1;
  var phone = window.innerWidth < 700;   // スマホは画面が小さいので、画面上の文字を少し大きめにする
  function f(base, target, cap){ return Math.round(Math.min(cap, Math.max(base, (phone ? target*1.2 : target)/z))*10)/10; }
  return {
    vars: '--nfs:'+f(12,9,28)+'px;--lfs:'+f(10,8,20)+'px;--numfs:'+f(11,8,20)+'px;--snofs:'+f(11,8,13)+'px;--scfs:'+f(12,9,18)+'px;--capfs:'+f(11,8,18)+'px',
    compact: z < 0.65
  };
}
function tshApplyTextScale(zoomEl, z){
  var ts = tshTextScale(z);
  ts.vars.split(";").forEach(function(kv){ var i = kv.indexOf(":"); zoomEl.style.setProperty(kv.slice(0,i), kv.slice(i+1)); });
  zoomEl.classList.toggle("tsh-compact", ts.compact);
}
// 画面のどこでも、マウスのドラッグでそのまま動かして見たい所へスクロールできるようにする(メニュー・設定画面・表・ポップアップなど。スマホ・タブレットは指でのスワイプ・ピンチ)。
// 横にも縦にもスクロールできる一番近い領域を動かし、なければページ全体を動かす。
// ボタン・入力欄・リンクなど操作できる部品の上から始めたドラッグは、スクロールせずそのまま操作として扱う(トーナメント表の選手枠・試合番号の上からは、ドラッグでスクロールできる)。
// 少しでも動かした(ドラッグした)あとのクリックは、ボタンなどの操作として扱わない
(function(){
  var drag = null, justDragged = false;
  var INTERACTIVE = "input,select,textarea,button,a,label,summary,option,[contenteditable],[data-action],.tsh-edit";
  function canScroll(el, axis){
    var cs = getComputedStyle(el), ov = axis==="x" ? cs.overflowX : cs.overflowY;
    if(ov!=="auto" && ov!=="scroll") return false;
    return axis==="x" ? el.scrollWidth > el.clientWidth + 1 : el.scrollHeight > el.clientHeight + 1;
  }
  function scrollerFor(start, axis){
    for(var el = start; el && el!==document.body && el!==document.documentElement; el = el.parentElement){
      if(canScroll(el, axis)) return el;
    }
    return null;   // ページ全体
  }
  document.addEventListener("mousedown", function(e){
    if(e.button!==0 || !e.target.closest) return;
    var inSheet = !!e.target.closest(".tsh-scroll");
    if(e.target.closest(INTERACTIVE) && !(inSheet && !e.target.closest("input,select,textarea,a,summary,.tsh-edit"))) return;
    drag = {x:e.clientX, y:e.clientY, moved:false, xs:scrollerFor(e.target, "x"), ys:scrollerFor(e.target, "y")};
  }, false);
  document.addEventListener("mousemove", function(e){
    if(!drag) return;
    if(e.buttons!==1){ endDrag(); return; }
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved){
      if(Math.abs(dx)<5 && Math.abs(dy)<5) return;
      drag.moved = true;
      document.body.classList.add("dragging");
    }
    drag.x = e.clientX; drag.y = e.clientY;
    if(drag.xs) drag.xs.scrollLeft -= dx; else window.scrollBy(-dx, 0);
    if(drag.ys) drag.ys.scrollTop -= dy; else window.scrollBy(0, -dy);
    e.preventDefault();
  }, false);
  function endDrag(){
    if(!drag) return;
    if(drag.moved){
      justDragged = true;
      setTimeout(function(){ justDragged = false; }, 0);
      document.body.classList.remove("dragging");
    }
    drag = null;
  }
  document.addEventListener("mouseup", endDrag, false);
  window.addEventListener("blur", endDrag, false);
  document.addEventListener("click", function(e){
    if(justDragged){ e.stopPropagation(); e.preventDefault(); justDragged = false; }
  }, true);
})();
// 倍率を数字で指定している表(大会の編集画面の初期表示など)も、ブラウザの拡大・縮小に合わせて文字の大きさを調整する
function applyTshFixedZoomText(){
  var bz = tshBrowserZoom();
  Array.prototype.forEach.call(document.querySelectorAll(".tsh-zoom[data-z]"), function(z){
    tshApplyTextScale(z, Number(z.getAttribute("data-z")) * Math.min(1, bz));
  });
}
window.addEventListener("resize", function(){ applyTshFit(); applyTshFixedZoomText(); });
var tshLayoutCache = {};
var tplModal = null;        // 試合の詳細(スコア入力など)ポップアップ {tid, gi, side, mid}
var tplSlotModal = null;    // 表の選手枠から開く「選手を変更」ポップアップ {tid, kind:"group"|"finals", idx, slot}
function tshBuild(def){
  var C = TSH, CW = C.STUB + C.TAIL, T = 2;
  var items = [];
  var isDouble = def.type==="double";
  var kind = def.type!=="single" ? "double" : (def.size<=24 ? "vertical" : "side");
  function Dn(R, s){ return (s-1)*(R.L+CW)+CW; }
  function edgeOf(R, s){ return Dn(R, s)+R.L; }
  function rect(R, d0, u0, d1, u1){
    var a = R.map(d0, u0), b = R.map(d1, u1);
    return {x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]), w:Math.abs(a[0]-b[0]), h:Math.abs(a[1]-b[1])};
  }
  function lineD(R, d0, d1, u){
    var a = R.map(d0, u), b = R.map(d1, u);
    if(R.vert) items.push({k:"ln", x:a[0]-1, y:Math.min(a[1],b[1])-1, w:T, h:Math.abs(a[1]-b[1])+T});
    else items.push({k:"ln", x:Math.min(a[0],b[0])-1, y:a[1]-1, w:Math.abs(a[0]-b[0])+T, h:T});
  }
  function lineU(R, d, u0, u1){
    var a = R.map(d, u0), b = R.map(d, u1);
    if(R.vert) items.push({k:"ln", x:Math.min(a[0],b[0])-1, y:a[1]-1, w:Math.abs(a[0]-b[0])+T, h:T});
    else items.push({k:"ln", x:a[0]-1, y:Math.min(a[1],b[1])-1, w:T, h:Math.abs(a[1]-b[1])+T});
  }
  function addBox(R, stage, u, role, props){
    var d0, d1;
    if(role==="slot"){ d0 = -R.slotLen; d1 = 0; } else { d0 = Dn(R, stage); d1 = d0 + R.L; }
    var r = rect(R, d0, u - R.thick/2, d1, u + R.thick/2);
    var it = {k:"box", x:r.x, y:r.y, w:r.w, h:r.h, role:role, vert:!!R.vert, numAt:R.numAt};
    for(var key in props) it[key] = props[key];
    items.push(it);
    return it;
  }
  function addNum(R, no, bar, dp, pu){
    var r = rect(R, bar, pu, dp, pu);
    if(R.vert) items.push({k:"num", x:r.x+4, y:r.y+(r.h-16)/2, w:26, h:16, no:no, vert:true});
    else items.push({k:"num", x:r.x, y:r.y-16, w:r.w, h:14, no:no});
  }
  function finalFlag(no){ return (isDouble && (def.wbFinal||[]).indexOf(no)>=0) || (def.type!=="single" && (def.lbFinal||[]).indexOf(no)>=0); }
  function drawMatch(R, no){
    var m = def.matches[no], kids = [];
    ["a","b"].forEach(function(sd){
      var src = m[sd], kid;
      if(src.w!=null){
        kid = drawMatch(R, src.w);
        kid.box.cons = {no:no, side:sd};
      } else if(src.p!=null){
        var u = R.slotU(src.p);
        kid = {u:u, stage:0, box:addBox(R, 0, u, "slot", {slot:src.p, cons:{no:no, side:sd}})};
      } else {
        var u2 = R.leafU(), st = m.round-1;
        kid = {u:u2, stage:st, box:addBox(R, st, u2, "leaf", {lsrc:src.l, cons:{no:no, side:sd}})};
      }
      kids.push(kid);
    });
    var ps = Math.max(kids[0].stage, kids[1].stage) + 1;
    var bar = Math.max(edgeOf(R, kids[0].stage), edgeOf(R, kids[1].stage)) + C.STUB;
    kids.forEach(function(k){ lineD(R, edgeOf(R, k.stage), bar, k.u); });
    lineU(R, bar, kids[0].u, kids[1].u);
    var pu = Math.round((kids[0].u + kids[1].u)/2);
    lineD(R, bar, Dn(R, ps), pu);
    addNum(R, no, bar, Dn(R, ps), pu);
    var box = addBox(R, ps, pu, "node", {own:no, round:m.round, goal:finalFlag(no)});
    return {u:pu, stage:ps, box:box};
  }
  function region(o){
    o.leafCount = 0;
    o.slotU = function(p){ return o.u0 + (p-1-o.slotOffset)*o.slotPitch + o.thick/2; };
    o.leafU = function(){ return o.u0 + (o.leafCount++)*o.leafPitch + o.thick/2; };
    return o;
  }
  var F = def.order[def.order.length-1];
  var roots = def.roots || null;   // 打ち切った表: 最後のラウンドの試合(それぞれの勝者が決勝進出)
  if(kind==="double"){
    var leafN = 0;
    def.order.forEach(function(no){ var m = def.matches[no]; if(m.side==="lb"){ if(m.a.l!=null) leafN++; if(m.b.l!=null) leafN++; } });
    var Hw = def.size*C.BH, Hl = leafN*C.LBP, Hmax = Math.max(Hw, Hl);
    var SR = C.SN + C.BW;
    var RW = region({map:function(d,u){ return [-d, u]; }, vert:false, L:C.BW, slotLen:SR, thick:C.BH, slotPitch:C.BH, leafPitch:C.LBP, numAt:"left", u0:(Hmax-Hw)/2, slotOffset:0});
    var RL = region({map:function(d,u){ return [SR + C.GAP + C.BW + d, u]; }, vert:false, L:C.BW, slotLen:SR, thick:C.BH, slotPitch:C.BH, leafPitch:C.LBP, numAt:"left", u0:(Hmax-Hl)/2, slotOffset:0});
    def.wbFinal.forEach(function(no){ drawMatch(RW, no); });
    (def.lbFinal||[]).forEach(function(no){ drawMatch(RL, no); });
    items.push({k:"cap", x:0, y:-24, w:SR, h:16, text:"WINNER'S BRACKET"});
    items.push({k:"cap", x:SR+C.GAP, y:-24, w:C.BW, h:16, text:"LOSER'S BRACKET"});
  } else if(kind==="side"){
    var Rn = roots ? (def.matches[roots[0]].round + 1) : def.matches[F].round;
    var SR2 = C.SN + C.BW;
    var RLf = region({map:function(d,u){ return [d, u]; }, vert:false, L:C.BW, slotLen:SR2, thick:C.BH, slotPitch:C.BH, leafPitch:C.BH, numAt:"left", u0:0, slotOffset:0});
    var xL = edgeOf(RLf, Rn-1), X0R = 2*xL + C.CG;
    var RRt = region({map:function(d,u){ return [X0R - d, u]; }, vert:false, L:C.BW, slotLen:SR2, thick:C.BH, slotPitch:C.BH, leafPitch:C.BH, numAt:"right", u0:0, slotOffset:def.size/2});
    if(roots){
      // 前半の試合は左の山、後半の試合は右の山(中央の決勝戦は描かない)
      var halfR = Math.floor(roots.length/2);
      roots.slice(0, halfR).forEach(function(no){ drawMatch(RLf, no); });
      roots.slice(halfR).forEach(function(no){ drawMatch(RRt, no); });
    } else {
    var fm = def.matches[F];
    var kl = drawMatch(RLf, fm.a.w), kr = drawMatch(RRt, fm.b.w);
    kl.box.cons = {no:F, side:"a"}; kr.box.cons = {no:F, side:"b"};
    var uF = kl.u;
    items.push({k:"ln", x:xL-1, y:uF-1, w:C.CG+T, h:T});
    items.push({k:"num", x:xL+4, y:uF+2, w:C.CG-8, h:14, no:F});
    items.push({k:"ln", x:xL+C.CG/2-1, y:uF-18, w:T, h:19});
    items.push({k:"box", role:"champ", own:F, round:fm.round, goal:false, vert:false, x:xL+C.CG/2-C.BW/2, y:uF-18-2*C.BH, w:C.BW, h:2*C.BH});
    }
  } else {
    var RV = region({map:function(d,u){ return [u, -d]; }, vert:true, L:C.VL, slotLen:C.VSN + C.VL, thick:C.VT, slotPitch:C.VT+4, leafPitch:C.VT+4, numAt:"top", u0:0, slotOffset:0});

      var root = drawMatch(RV, F);

  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  items.forEach(function(it){ minX = Math.min(minX, it.x); minY = Math.min(minY, it.y); maxX = Math.max(maxX, it.x+it.w); maxY = Math.max(maxY, it.y+it.h); });
  items.forEach(function(it){ it.x = Math.round(it.x - minX + C.PAD); it.y = Math.round(it.y - minY + C.PAD); it.w = Math.round(it.w); it.h = Math.round(it.h); });

}
// シングルエリミネーションの表は、決勝進出人数が決まるラウンド(cut)までを描く。最後のラウンドの試合が複数あり(それぞれの勝者が進出)、決勝戦は描かない
function tplTruncatedDef(def, cut){
  if(!def || def.type!=="single" || !(cut>=1) || cut>=def.wbRounds.length) return def;
  if(def.trio && cut<2) return def;
  var roots = def.wbRounds[cut-1];
  if(!roots || roots.length<2) return def;
  var cache = def._trunc = def._trunc || {};
  if(cache[cut]) return cache[cut];
  var matches = {}, order = [];
  def.order.forEach(function(no){ if(def.matches[no].round<=cut){ matches[no] = def.matches[no]; order.push(no); } });
  var d = {};
  Object.keys(def).forEach(function(k){ d[k] = def[k]; });
  d._trunc = null;
  d.key = def.key+"@"+cut; d.matches = matches; d.order = order; d.roots = roots.slice();
  d.wbRounds = def.wbRounds.slice(0, cut); d.wbFinal = roots.slice();
  cache[cut] = d;
  return d;
}
function tshLayoutFor(def){
  if(!tshLayoutCache[def.key]) tshLayoutCache[def.key] = tshBuild(def);

}
// o: {getMatch(no), tournament, interactive, canResolve, isActive(m), goalOf(item), attrsFor(m), openAttrs(m)}
function renderTplSheet(def, o){
  var lay = tshLayoutFor(def), t = o.tournament;
  function resolvable(m){ return !!(o.canResolve && o.isActive(m) && m.a && m.b && !m.bye && !m.winner && !m.preview); }
  var lines = "", boxes = "", labels = "";
  lay.items.forEach(function(it){
    var pos = 'left:'+it.x+'px;top:'+it.y+'px;width:'+it.w+'px;height:'+it.h+'px';

    if(it.k==="cap"){ labels += '<div class="tsh-cap" style="'+pos+'">'+esc(it.text)+'</div>'; return; }

      }

      var noInner = String(it.no);
